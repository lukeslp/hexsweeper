<!DOCTYPE html>
<!--
  File Purpose: Render 1200x630 OG cards for Hexsweeper themes, lab skins, sphere, and Flux Sphere.
  Primary Functions/Classes: CARDS table; live game iframe backdrop + title/desc plate;
        optional per-card `layout: "side"` (board right, plate left) and `stage(win)`
        hook that sets up a scene in the board once it loads.
  Inputs: ?card=<home|infinite|light|dark|fire|plague|escape|sphere|flux-sphere|skin-<id>>.
  Outputs: an on-screen 1200x630 stage to screenshot into assets/social/<card>-og.png
        (flux-sphere goes to flux-sphere/assets/og.png; see tools/shoot-og-cards.sh).
  Note: Authoring tool, not a public page. Uses the game's own IBM Plex faces so the
        cards match the site rather than whatever a compositor has installed.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hexsweeper OG cards</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;background:#22262c}
  /* Exact OG frame: screenshot this box, nothing around it. */
  #stage{
    position:relative;width:1200px;height:630px;overflow:hidden;
    background:var(--card-bg,#0e1218);
  }
  #board{position:absolute;inset:0;width:1200px;height:630px;border:0}
  /* Scrim keeps the type legible over whatever the board happens to deal. */
  #scrim{
    position:absolute;inset:0;
    background:linear-gradient(
      to top,
      var(--scrim-strong) 0%,
      var(--scrim-mid) 34%,
      transparent 62%
    );
  }
  #plate{
    position:absolute;left:64px;right:64px;bottom:56px;
    font-family:"IBM Plex Sans",system-ui,sans-serif;
  }
  .rule{width:56px;height:3px;background:var(--accent);margin-bottom:22px}
  h1{
    margin:0;color:var(--ink);
    font:700 68px/1.02 "IBM Plex Sans",system-ui,sans-serif;
    letter-spacing:-.028em;
  }
  p{
    margin:14px 0 0;max-width:800px;color:var(--ink-sub);
    font:400 26px/1.34 "IBM Plex Sans",system-ui,sans-serif;
  }
  .url{
    margin:26px 0 0;color:var(--ink-faint);
    font:500 18px/1 "IBM Plex Mono",ui-monospace,monospace;
    letter-spacing:.02em;
  }
  /* Side layout: board on the right, plate centered on the left, so controls
     the card should show (Flux's bottom-center Twin button) stay clear of it. */
  #stage.side #board{left:400px;width:800px}
  #stage.side #scrim{
    background:linear-gradient(
      to right,
      var(--scrim-strong) 0%,
      var(--scrim-mid) 36%,
      transparent 52%
    );
  }
  #stage.side #plate{right:auto;width:520px;top:50%;bottom:auto;transform:translateY(-50%)}
  #stage.side p{max-width:470px}
  /* Sphere: the real monochrome board, whole and unobscured. */
  #stage.sphere-card { background: #000; }
  #stage.sphere-card #board { left: 440px; width: 760px; }
  #stage.sphere-card #scrim { display: none; }
  #stage.sphere-card #plate { left: 56px; right: auto; width: 380px; top: 50%; bottom: auto; transform: translateY(-50%); }
  #stage.sphere-card h1 { color: #fff; font-size: 64px; line-height: 1.08; }
  #stage.sphere-card p { color: #bdbdbd; font-size: 24px; }
  #stage.sphere-card .url { color: #888; font-size: 15px; margin-top: 32px; }
  #stage.sphere-card .rule { background: #ff0000; width: 32px; margin-bottom: 24px; }
  #stage.infinite-card #board { left: 480px; width: 720px; mask-image: linear-gradient(to right, transparent, #000 18%); }
  #stage.infinite-card .url { font-size: 13px; }
</style>
</head>
<body>

  <iframe id="board" title="Board" scrolling="no"></iframe>
  <div id="scrim"></div>
  <div id="plate">
    <div class="rule"></div>
    <h1 id="t"></h1>
    <p id="d"></p>
    <p class="url" id="u">dr.eamer.dev/games/hexsweeper</p>
  </div>
</div>
<script>

      accent: "#7ec8a8", bg: "#141e1c", dark: true,

      accent: "#ff0000", bg: "#000000", dark: true,
      url: "dr.eamer.dev/games/hexsweeper",
      layout: "sphere-card",
      hide: ".quiet-chrome,.hud-cluster,.hud-stats,.sphere-banner,.help-overlay,.count-style-toast,#history-lightbox",
      stage: stageSphere,
    },
    "flux-sphere": {

      title: "Flux Sphere",
      desc: "Every face has a twin. Dig one and its twin opens too: both safe or both mines.",
      accent: "linear-gradient(90deg,#00a6b2,#d97706)", bg: "#ffffff", dark: false,
      url: "dr.eamer.dev/games/hexsweeper/flux-sphere",
      layout: "side",
      // Keep the Twin button; hide the rest of the chrome and the status pill.
      hide: ".hud-cluster,.hud-stats,.sphere-banner,.help-overlay,.count-style-toast,#history-lightbox,.flux-status,.hex-bloom-corner,.hex-bloom-hub,.hex-bloom-tooltip",
      stage: stageFluxEcho,
    },
    "skin-classic": {
      src: "../collection/skin-classic.html",
      title: "Soft Honeycomb Hexagonal Minesweeper",
      desc: "A minimalist take on old school Minesweeper, with raised neumorphic cells and hex geometry that keeps surprising you.",
      accent: "#718096", bg: "#e0e5ec", dark: false,

    },
    "skin-particle-bloom": {

    },
    "skin-glass-lens": {

      desc: "Old school Minesweeper seen through frostpane glass and a cursor-following magnifier over the hex grid.",
      accent: "#7eb8ff", bg: "#0a1420", dark: true,
      url: "dr.eamer.dev/games/hexsweeper/collection",
    },
    "skin-parallax-depth": {
      src: "../collection/skin-parallax-depth.html",
      title: "Parallax Ring Hexagonal Minesweeper",
      desc: "Classic Minesweeper with ring depth and pointer parallax that tilts the honeycomb as you hunt mines.",
      accent: "#ff6400", bg: "#1c120c", dark: true,
      url: "dr.eamer.dev/games/hexsweeper/collection",
    },
    "skin-brass-plaque": {
      src: "../collection/skin-brass-plaque.html",
      title: "Brass Plaque Hexagonal Minesweeper",
      desc: "A warm ceramic-metal desk take on Minesweeper, with brass finish tokens and hexagonal surprises under each cover.",
      accent: "#c9a86c", bg: "#141820", dark: true,
      url: "dr.eamer.dev/games/hexsweeper/collection",
    },
    "skin-frostpane": {
      src: "../collection/skin-frostpane.html",
      title: "Frostpane Hexagonal Minesweeper",
      desc: "Old school Minesweeper behind dark frosted glass, with cyan-violet glow and translucent hex faces.",
      accent: "#7eb8ff", bg: "#0a1420", dark: true,
      url: "dr.eamer.dev/games/hexsweeper/collection",
    },
    "skin-paper-relief": {

      title: "Paper Relief Hexagonal Minesweeper",
      desc: "Classic Minesweeper embossed on cream paper stock, with soft shadows and tactile hex geometry.",
      accent: "#4a5568", bg: "#f4efe6", dark: false,
      url: "dr.eamer.dev/games/hexsweeper/collection",
    },
    "skin-comet-void": {
      src: "../collection/skin-comet-void.html",
      title: "Comet Void Hexagonal Minesweeper",
      desc: "Minesweeper in void black with ember sparks and meteor streaks threading through the hex grid.",
      accent: "#ffd24a", bg: "#080a0f", dark: true,
      url: "dr.eamer.dev/games/hexsweeper/collection",
    },
    "skin-mycelium": {
      src: "../collection/skin-mycelium.html",
      title: "Mycelium Web Hexagonal Minesweeper",
      desc: "Classic Minesweeper where hyphal links grow between revealed cells and nutrient particles flow through the hexes.",
      accent: "#7ec8a8", bg: "#141e1c", dark: true,
      url: "dr.eamer.dev/games/hexsweeper/collection",
    },
    "skin-caustic-lens": {
      src: "../collection/skin-caustic-lens.html",
      title: "Caustic Lens Hexagonal Minesweeper",
      desc: "Old school Minesweeper with under-board light caustics and a hover refraction bulge over each hex.",
      accent: "#34d399", bg: "#0a1420", dark: true,
      url: "dr.eamer.dev/games/hexsweeper/collection",
    },
  };

  // Deal a reproducible Infinite opening through the game's own controls.
  function stageInfinite(win) {
    let seed = 20261007;
    const random = win.Math.random;
    win.Math.random = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
    try { win.document.getElementById("reset-btn").click(); }
    finally { win.Math.random = random; }
    const canvas = win.document.getElementById("gameCanvas");
    canvas.dispatchEvent(new win.WheelEvent("wheel", {deltaY: -450, clientX: 360, clientY: 315, bubbles: true, cancelable: true}));
    // Two covered cells beside the seeded opening, marked with the real flag control.
    for (const [clientX, clientY] of [[126, 49], [168, 358]]) {
      canvas.dispatchEvent(new win.MouseEvent("mousedown", {button: 2, clientX, clientY, bubbles: true}));
      canvas.dispatchEvent(new win.MouseEvent("mouseup", {button: 2, clientX, clientY, bubbles: true}));
    }
  }

  // A seeded, genuine playable deal. The preview URL suspends autosave.
  function stageSphere(win) {
    const game = win.HEXSWEEPER_SPHERE_GAME;
    if (!game) throw new Error("Sphere was not ready for capture");
    let seed = 20261007;
    const random = win.Math.random;
    win.Math.random = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
    try {
      game.setSize("easy");
      const st = game.getState();
      st.reduceMotion = true;
      st.ambientSpin = false;
      const center = game.pickTile(st.centerX, st.centerY);
      game.digAt(center);
      // Flag two actual mines bordering the opening, preferring its front.
      const front = st.tiles[center].centerPoint;
      const choices = st.cells.map((c, i) => ({c, i})).filter(({c, i}) =>
        c.isMine && st.tiles[i].neighborIndices.some(n => st.cells[n].revealed));
      choices.sort((a, b) => {
        const dot = i => { const p = st.tiles[i].centerPoint; return p.x * front.x + p.y * front.y + p.z * front.z; };
        return dot(b.i) - dot(a.i);
      });
      choices.slice(0, 2).forEach(({i}) => game.flagAt(i));
    } finally { win.Math.random = random; }
  }

  /**
   * Flux Sphere: an echo arc between two twins, with the Twin button showing.
   * ?deal=1 suspends the board's autosave (so shooting a card never touches a
   * player's run) but opens a plain dig without twins, so the stage digs again
   * on seeded deals until one reads well: a modest opening, and a twin on its
   * edge whose echo opens a separate island. The card is the same every time.
   */
  function stageFluxEcho(win) {
    const route = new win.Function(
      "return typeof fluxSphereRoute === 'undefined' ? null : fluxSphereRoute"
    )();
    if (!route || !route.game) return;
    const game = route.game;
    const st = game.getState();
    const center = game.pickTile(st.centerX, st.centerY);
    if (center < 0) return;

    const unit = (i) => {
      const p = st.tiles[i].centerPoint;
      const l = Math.hypot(p.x, p.y, p.z) || 1;
      return { x: p.x / l, y: p.y / l, z: p.z / l };
    };
    const centroid = (indices) => {
      const sum = { x: 0, y: 0, z: 0 };
      for (const i of indices) {
        const u = unit(i);
        sum.x += u.x;
        sum.y += u.y;
        sum.z += u.z;
      }
      const l = Math.hypot(sum.x, sum.y, sum.z) || 1;
      return { x: sum.x / l, y: sum.y / l, z: sum.z / l };
    };
    const dot = (a, b) => a.x * b.x + a.y * b.y + a.z * b.z;

    function deal(seed) {
      win.Math.random = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
      for (const cell of st.cells) {
        cell.isMine = false;
        cell.revealed = false;
        cell.flagged = false;
        cell.neighborMines = 0;
        cell.animReveal = 0;
      }
      st.isFirstClick = true;
      st.isGameOver = false;
      st.won = false;
      st.detonatorIdx = -1;
      game.digAt(center);
    }

    /** Faces an echo onto `start` opens: the twin, plus its flood if it is a 0. */
    function island(start) {
      const seen = new Set([start]);
      const queue = st.cells[start].neighborMines > 0 ? [] : [start];
      while (queue.length) {
        const i = queue.shift();
        if (st.cells[i].neighborMines > 0) continue;
        for (const n of st.tiles[i].neighborIndices) {
          const c = st.cells[n];
          if (seen.has(n) || c.revealed || c.isMine) continue;
          seen.add(n);
          queue.push(n);
        }
      }
      return seen;
    }

    function choose() {
      const opening = [];
      st.cells.forEach((c, i) => { if (c.revealed) opening.push(i); });
      if (opening.length < 20 || opening.length > 70) return null;
      // Faces within two steps of the opening: an island must clear them, so
      // a band of covered faces separates it from the opening.
      const near = new Set(opening);
      for (let step = 0; step < 2; step++) {
        for (const i of Array.from(near)) {
          for (const n of st.tiles[i].neighborIndices) near.add(n);
        }
      }
      const twins = route.adapter.exportState().pairs.pairFor;
      const openSet = new Set(opening);
      let best = null;
      st.cells.forEach((cell, from) => {
        const twin = twins[from];
        if (twin < 0 || cell.revealed || cell.isMine) return;
        if (!st.tiles[from].neighborIndices.some((n) => openSet.has(n))) return;
        const faces = island(twin);
        if (faces.size < 6 || faces.size > 24) return;
        for (const i of faces) if (near.has(i)) return;
        // Aim halfway between the opening and the island, and keep both ends
        // of the arc well inside the disk.
        const a = centroid(opening);
        const b = centroid(faces);
        const mid = Math.hypot(a.x + b.x, a.y + b.y, a.z + b.z) || 1;
        const view = { x: (a.x + b.x) / mid, y: (a.y + b.y) / mid, z: (a.z + b.z) / mid };
        if (dot(unit(from), view) < 0.75 || dot(unit(twin), view) < 0.75) return;
        const score = Math.abs(faces.size - 12);
        if (!best || score < best.score) best = { from, twin, view, score };
      });
      return best;
    }

    let pick = null;
    for (let attempt = 1; attempt <= 60 && !pick; attempt++) {
      deal(20261003 + attempt);
      pick = choose();
    }
    if (!pick) return;

    // Turn the globe so the opening and the twin's island both face the camera.
    st.ambientSpin = false;
    st.rotY = st.targetRotY = Math.atan2(-pick.view.x, pick.view.z);
    st.rotX = st.targetRotX = Math.atan2(pick.view.y, Math.hypot(pick.view.x, pick.view.z));

    // Reduced motion paints the arc still (no travelling pulse) for its full
    // two seconds; re-dig before it expires so the arc is always on screen,
    // whenever the frame is captured.
    st.reduceMotion = true;
    game.digAt(pick.from);
    win.setInterval(() => {
      if (game.undo()) game.digAt(pick.from);
    }, 1500);
  }

  const params = new URL(location.href).searchParams;
  const key = params.get("card") || "home";
  // Production Minimal previews use reviewed board-only captures, never title plates.
  if (["sphere", "infinite", "skin-classic"].includes(key)) {
    const stage = document.getElementById("stage");
    const image = document.createElement("img");
    image.src = "../assets/social/" + key + "-og.png?v=board-20261009";
    image.alt = "Board-only gameplay screenshot";
    image.width = 1200; image.height = 630;
    stage.replaceChildren(image);
    return;
  }
  const card = CARDS[key] || CARDS.home;
  const root = document.documentElement.style;

  if (card.layout) document.getElementById("stage").classList.add(card.layout);
  if (key === "infinite") document.getElementById("stage").classList.add("infinite-card");

  const scale = parseFloat(params.get("scale") || "1");
  if (Number.isFinite(scale) && scale > 0 && scale !== 1) {
    document.getElementById("stage").style.zoom = String(scale);
  }

  root.setProperty("--card-bg", card.bg);
  root.setProperty("--accent", card.accent);
  if (card.dark) {
    root.setProperty("--ink", "#f4f7fb");
    root.setProperty("--ink-sub", "rgba(244,247,251,.82)");
    root.setProperty("--ink-faint", "rgba(244,247,251,.5)");
    root.setProperty("--scrim-strong", "rgba(4,7,12,.94)");
    root.setProperty("--scrim-mid", "rgba(4,7,12,.62)");
  } else {
    root.setProperty("--ink", "#141922");
    root.setProperty("--ink-sub", "rgba(20,25,34,.76)");
    root.setProperty("--ink-faint", "rgba(20,25,34,.5)");
    root.setProperty("--scrim-strong", "rgba(233,238,246,.95)");
    root.setProperty("--scrim-mid", "rgba(233,238,246,.66)");
  }

  document.getElementById("t").textContent = card.title;
  document.getElementById("d").textContent = card.desc;
  document.getElementById("u").textContent = card.url || "dr.eamer.dev/games/hexsweeper";

  try {
    localStorage.setItem("hexsweeper-welcome-v1", "1");
    localStorage.setItem("hexsweeper-sphere-welcome-v1", "1");
    localStorage.removeItem("hexsweeper-endless-plate-v1");
    localStorage.removeItem("hexsweeper-endless-escape-v1");
  } catch (_) {}

  const board = document.getElementById("board");
  const hideSel = card.hide || ".hud-actions,#modal-overlay,#theme-toast";
  board.addEventListener("load", () => {
    try {
      const doc = board.contentDocument;
      const hide = doc.createElement("style");
      hide.textContent = hideSel + "{display:none!important}";
      doc.head.appendChild(hide);
    } catch (_) {}
    if (typeof card.stage === "function") {
      try {
        card.stage(board.contentWindow);
      } catch (err) {
        console.error("[og-card] stage failed", err);
      }
    }
  });
  board.src = card.src;
})();
</script>
<script data-goatcounter="https://stats.dr.eamer.dev/count"
        async src="https://stats.dr.eamer.dev/count.js"></script>
