<!DOCTYPE html>
<!--
  File Purpose: Template for the native app's mode picker (build/app/index.html).
  Primary Functions/Classes: one centered logo tile unfolds into three mode
    links on the same axial hex grid. The FONTS placeholder is replaced by
    tools/export-collection.py; do not repeat it outside the tag below.
  Inputs: none at runtime. Outputs: links into games/*.html.
  A11y: native button + links, closed links are inert, Escape/background closes,
    focus is restored, targets exceed 44pt, reduced motion is honoured.
  Author: Luke Steuber <luke@lukesteuber.com>
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hexsweeper</title>
<meta name="description" content="Choose Infinite, Bounded, or Sphere Hexsweeper.">
{{FONTS}}
<style>
  :root {
    --font-ui: "IBM Plex Sans", system-ui, sans-serif;
    --field: #eef2f8;
    --field-edge: #d4dce8;
    --paper: #f8fafc;
    --paper-hover: #e5eaf2;
    --ink: #26303f;
    --stroke: rgba(38, 48, 63, .72);
    --focus: #2f6f9f;
    --tile-w: clamp(86px, 26.67vw, 104px);
    --tile-h: calc(var(--tile-w) * 1.1547);
    --dx: var(--tile-w);
    --diag-x: calc(var(--tile-w) * .5);
    --diag-y: calc(var(--tile-h) * .75);
    color-scheme: light dark;
  }
  :root[data-appearance="dark"] {
    --field: #10151d;
    --field-edge: #080b11;
    --paper: #171e28;
    --paper-hover: #242e3c;
    --ink: #e6edf7;
    --stroke: rgba(230, 237, 247, .72);
    --focus: #7fc4f2;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; }
  body {
    margin: 0;
    min-width: 280px;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-text-size-adjust: 100%;
    font-family: var(--font-ui);
    color: var(--ink);
    background:
      radial-gradient(110% 78% at 50% 18%, var(--field) 0%, transparent 68%),
      var(--field-edge);
  }

  main, .flower {
    position: fixed;
    inset: 0;
  }
  .flower {
    isolation: isolate;
  }
  .hex {
    position: absolute;
    left: 50%;
    top: 50%;
    width: var(--tile-w);
    height: var(--tile-h);
    margin-left: calc(var(--tile-w) / -2);
    margin-top: calc(var(--tile-h) / -2);
    display: grid;
    place-items: center;
    border: 0;
    padding: 0;
    color: var(--ink);
    background: var(--stroke);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    text-decoration: none;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    outline: none;
    filter:
      drop-shadow(0 0 3px var(--paper))
      drop-shadow(0 1px 0 var(--paper));
    transition:
      transform 340ms cubic-bezier(.22, 1, .3, 1),
      opacity 220ms ease,
      background 160ms ease;
    will-change: transform, opacity;
  }
  .hex::before {
    content: "";
    position: absolute;
    inset: 1.5px;
    z-index: -1;
    clip-path: inherit;
    background: var(--paper);
    transition: inset 150ms ease, background 160ms ease;
  }
  .hex:focus-visible { background: var(--focus); }
  .hex:focus-visible::before,
  .hex:hover::before { inset: 3px; background: var(--paper-hover); }
  .hex:active::before { inset: 4px; }

  .seed {
    z-index: 3;
    transform: translate(0, 0);
  }
  .logo {
    width: 54%;
    max-width: 54px;
    position: relative;
    z-index: 1;
  }
  .close {
    display: none;
    position: relative;
    z-index: 1;
    font-size: clamp(1.45rem, 7vw, 1.8rem);
    font-weight: 500;
    line-height: 1;
  }
  .flower[data-open="true"] .logo { display: none; }
  .flower[data-open="true"] .close { display: block; }

  .mode {
    z-index: 2;
    opacity: 0;
    pointer-events: none;
    transform: translate(0, 0) scale(.5) rotateY(-104deg);
    transform-origin: 50% 50%;
    transform-style: preserve-3d;
  }
  .mode-content {
    position: relative;
    z-index: 1;
    display: grid;
    justify-items: center;
    gap: 4px;
  }
  .mode svg { width: 34px; height: 34px; }
  .mode-name {
    max-width: 88%;
    font-size: clamp(.7rem, 3.1vw, .8rem);
    font-weight: 650;
    line-height: 1;
    letter-spacing: -.02em;
    text-align: center;
  }
  .flower[data-open="true"] .mode {
    opacity: 1;
    pointer-events: auto;
  }
  /* Exact alternating ring-1 seats from sphere-ux ?dock=center:
     NW (q=0,r=-1), E (q=1,r=0), SW (q=-1,r=1). */
  .flower[data-open="true"] .mode-infinite {
    transform: translate(calc(var(--diag-x) * -1), calc(var(--diag-y) * -1)) scale(1) rotateY(0);
  }
  .flower[data-open="true"] .mode-bounded {
    transform: translate(var(--dx), 0) scale(1) rotateY(0);
  }
  .flower[data-open="true"] .mode-sphere {
    transform: translate(calc(var(--diag-x) * -1), var(--diag-y)) scale(1) rotateY(0);
  }

  @media (prefers-reduced-motion: no-preference) {
    .seed { animation: arrive 420ms cubic-bezier(.22, 1, .3, 1) backwards; }
    .flower[data-open="true"] .mode-infinite { transition-delay: 50ms; }
    .flower[data-open="true"] .mode-bounded { transition-delay: 110ms; }
    .flower[data-open="true"] .mode-sphere { transition-delay: 170ms; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: .01ms !important;
      animation-duration: .01ms !important;
    }
  }
  @media (forced-colors: active) {
    body { background: Canvas; }
    .hex { background: ButtonText; color: ButtonText; filter: none; }
    .hex::before { background: Canvas; }
    .hex:focus-visible { outline: 3px solid Highlight; outline-offset: 3px; }
  }
  @keyframes arrive {
    from { opacity: 0; transform: scale(.5) rotateY(-70deg); }
  }
</style>
</head>
<body>
<main>
  <nav class="flower" id="game-menu" aria-label="Choose a game" data-open="false">
    <a class="hex mode mode-infinite" href="games/infinite.html" tabindex="-1" aria-hidden="true" inert>
      <span class="mode-content">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M24 4 36 11v14l-12 7-12-7V11Z"/>
            <path d="m10 27 12 7v10H10L2 39V27Z"/>
            <path d="m38 27 8 5v12H26V34Z"/>
          </g>
          <text x="24" y="23" text-anchor="middle" font-family="var(--font-ui)" font-size="10" font-weight="650" fill="currentColor">2</text>
        </svg>
        <span class="mode-name">Infinite</span>
      </span>
    </a>

    <a class="hex mode mode-bounded" href="games/bounded.html" tabindex="-1" aria-hidden="true" inert>
      <span class="mode-content">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <rect x="5" y="5" width="38" height="38" rx="3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 3"/>
          <path d="m24 9 11 6v12l-11 6-11-6V15Z" fill="none" stroke="currentColor" stroke-width="1.5"/>
        </svg>
        <span class="mode-name">Bounded</span>
      </span>
    </a>

    <a class="hex mode mode-sphere" href="games/sphere.html" tabindex="-1" aria-hidden="true" inert>
      <span class="mode-content">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="24" r="18" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M24 6v36M9 15l30 18M39 15 9 33M6 24h36" fill="none" stroke="currentColor" stroke-width="1" opacity=".7"/>
        </svg>
        <span class="mode-name">Sphere</span>
      </span>
    </a>

    <button class="hex seed" id="menu-toggle" type="button" aria-expanded="false" aria-controls="game-menu" aria-label="Choose a game">
      <img class="logo" src="assets/hexsweeper-logo.png" alt="" aria-hidden="true">
      <span class="close" aria-hidden="true">×</span>
    </button>
  </nav>
</main>

<script>
(function () {
  "use strict";
  var flower = document.getElementById("game-menu");
  var toggle = document.getElementById("menu-toggle");
  var modes = Array.prototype.slice.call(flower.querySelectorAll(".mode"));
  var focusTimer = null;

  function setMenu(open, moveFocus) {
    clearTimeout(focusTimer);
    flower.dataset.open = open ? "true" : "false";
    toggle.setAttribute("aria-expanded", open ? "true" : "false");
    toggle.setAttribute("aria-label", open ? "Close game menu" : "Choose a game");
    modes.forEach(function (mode) {
      mode.tabIndex = open ? 0 : -1;
      mode.setAttribute("aria-hidden", open ? "false" : "true");
      mode.inert = !open;
    });
    if (moveFocus) {
      if (open) {
        focusTimer = setTimeout(function () { modes[0].focus(); },
          matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 380);
      } else {
        toggle.focus();
      }
    }
  }

  toggle.addEventListener("click", function (event) {
    setMenu(flower.dataset.open !== "true", event.detail === 0);
  });
  flower.addEventListener("click", function (event) {
    if (event.target === flower && flower.dataset.open === "true") setMenu(false, false);
  });
  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape" && flower.dataset.open === "true") {
      event.preventDefault();
      setMenu(false, true);
    }
  });

  var saved = null;
  try { saved = localStorage.getItem("hexsweeper-appearance-v1"); } catch (_) {}
  document.documentElement.dataset.appearance =
    saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
})();
</script>
</body>
</html>
