<!DOCTYPE html>
<!--
  File Purpose: Native app launcher staged as one authentic Hexsweeper opening.
  Primary Functions/Classes: deterministic mine field, neighbor counts, zero-cell
    flood reveal, resumable-run routing, and a connected launcher-theme flower.
  Inputs: viewport, saved runs/appearance, session reveal state. Outputs: game links.
  A11y: native button/links, visible focus, 50px+ targets, live status, keyboard
    reveal bypass, reduced motion, forced colors, and no timing-dependent action.
  Author: Luke Steuber <luke@lukesteuber.com>
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hexsweeper</title>
<meta name="description" content="Choose Infinite, Classic, or Sphere Hexsweeper from one safe opening.">
{{FONTS}}
<style>
  :root {
    --font-ui: "IBM Plex Sans", system-ui, sans-serif;
    --font-count: "IBM Plex Mono", ui-monospace, monospace;
    --field: #e8eef5;
    --field-glow: #f8fafc;
    --tile: #f7f9fc;
    --tile-edge: #aebdce;
    --tile-shadow: #c8d4e1;
    --well: #8f9db0;
    --well-ink: #172231;
    --well-edge: #738397;
    --well-shadow: #657386;
    --ink: #263240;
    --muted: #68798c;
    --focus: #246da0;
    --infinite-accent: #246da0;
    --classic-accent: #16794f;
    --sphere-accent: #724ab5;
    --theme-accent: #4e647b;
    --flag: #e33030;
    --ambient-strong: rgba(248, 250, 252, .84);
    --ambient-soft: rgba(248, 250, 252, .28);
    --edge-haze: rgba(200, 212, 225, .24);
    --tile-drop: rgba(200, 212, 225, .76);
    --tile-drop-strong: rgba(200, 212, 225, .94);
    --well-drop: rgba(255, 255, 255, .38);
    --focus-drop: rgba(36, 109, 160, .72);
    --focus-glow: rgba(36, 109, 160, .42);
    --count-shadow: rgba(248, 250, 252, .60);
    --brand-shadow: rgba(232, 238, 245, .72);
    --hint-shadow: rgba(232, 238, 245, .84);
    --dug-ink: #d9dfe7;
    --hex-w: clamp(64px, 21vw, 96px);
    --hex-h: calc(var(--hex-w) * 1.1547);
    --choice-scale: 1.08;
    --board-x: 0px;
    --board-y: 0px;
    color-scheme: light dark;
  }
  :root[data-appearance="dark"] {
    --field: #0c1118;
    --field-glow: #18212d;
    --tile: #171f29;
    --tile-edge: #536174;
    --tile-shadow: #070a0f;
    --well: #d7e0eb;
    --well-ink: #182331;
    --well-edge: #f2f6fb;
    --well-shadow: #ffffff;
    --ink: #edf3fb;
    --muted: #a8b6c7;
    --focus: #78c5f4;
    --infinite-accent: #78c5f4;
    --classic-accent: #20a873;
    --sphere-accent: #aa83e8;
    --theme-accent: #a8b6c7;
    --ambient-strong: rgba(24, 33, 45, .84);
    --ambient-soft: rgba(24, 33, 45, .28);
    --edge-haze: rgba(7, 10, 15, .24);
    --tile-drop: rgba(7, 10, 15, .76);
    --tile-drop-strong: rgba(7, 10, 15, .94);
    --focus-drop: rgba(120, 197, 244, .72);
    --focus-glow: rgba(120, 197, 244, .42);
    --count-shadow: rgba(24, 33, 45, .60);
    --brand-shadow: rgba(12, 17, 24, .72);
    --hint-shadow: rgba(12, 17, 24, .84);
    --dug-ink: #1e252f;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; }
  body {
    margin: 0;
    min-width: 280px;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-text-size-adjust: 100%;
    font-family: var(--font-ui);
    color: var(--ink);
    background: var(--field);
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(82% 62% at 50% 48%, var(--ambient-strong), transparent 72%),
      linear-gradient(180deg, var(--ambient-soft), transparent 24% 76%, var(--edge-haze));
    background:
      radial-gradient(82% 62% at 50% 48%, color-mix(in srgb, var(--field-glow) 84%, transparent), transparent 72%),
      linear-gradient(180deg, color-mix(in srgb, var(--field-glow) 28%, transparent), transparent 24% 76%, color-mix(in srgb, var(--tile-shadow) 24%, transparent));
  }

  main, .board, .field { position: fixed; inset: 0; }
  .board {
    isolation: isolate;
    overflow: hidden;
  }
  .field { z-index: 0; pointer-events: none; }
  .hex {
    position: absolute;
    left: calc(50% + var(--board-x));
    top: calc(50% + var(--board-y));
    width: var(--hex-w);
    height: var(--hex-h);
    margin-left: calc(var(--hex-w) / -2);
    margin-top: calc(var(--hex-h) / -2);
    transform: translate3d(var(--x), var(--y), 0);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
  }
  .cell,
  .starter,
  .mode,
  .resume,
  .theme-control {
    background: var(--tile-edge);
    filter: drop-shadow(0 4px 2px var(--tile-drop));
    filter: drop-shadow(0 4px 2px color-mix(in srgb, var(--tile-shadow) 76%, transparent));
  }
  .cell::before,
  .starter::before,
  .mode::before,
  .resume::before,
  .theme-control::before {
    content: "";
    position: absolute;
    inset: 2px 3px 6px;
    clip-path: inherit;
    background:
      radial-gradient(90% 70% at 47% 28%, var(--field-glow), transparent 78%),
      var(--tile);
    transition: inset 170ms ease, transform 170ms ease, background 170ms ease;
  }

  .cell {
    z-index: 0;
    display: grid;
    place-items: center;
    transition:
      transform 210ms cubic-bezier(.22, 1, .36, 1),
      filter 180ms ease,
      opacity 180ms ease;
  }
  .cell.is-revealed {
    z-index: 1;
    background: var(--well-edge);
    filter: drop-shadow(0 1px 1px var(--well-drop));
    filter: drop-shadow(0 1px 1px color-mix(in srgb, var(--well-shadow) 38%, transparent));
    transform: translate3d(var(--x), calc(var(--y) + 4px), 0) scale(.93);
  }
  .cell.is-revealed::before {
    inset: 5px 6px 7px;
    background: var(--well);
  }
  .count {
    position: relative;
    z-index: 2;
    opacity: 0;
    transform: translateY(-2px) scale(.78);
    color: var(--ink);
    font: 700 clamp(.78rem, 3.7vw, 1.05rem)/1 var(--font-count);
    text-shadow: 0 1px 0 var(--count-shadow);
    text-shadow: 0 1px 0 color-mix(in srgb, var(--field-glow) 60%, transparent);
    transition: opacity 130ms ease 50ms, transform 170ms cubic-bezier(.22, 1, .36, 1) 35ms;
  }
  .cell.is-revealed .count { opacity: 1; transform: none; }
  .cell.count-1 .count { color: #125cc8; }
  .cell.count-2 .count { color: #16794f; }
  .cell.count-3 .count { color: #c43131; }
  .cell.count-4 .count { color: #724ab5; }
  :root[data-appearance="dark"] .cell.count-1 .count { color: #438cff; }
  :root[data-appearance="dark"] .cell.count-2 .count { color: #20a873; }
  :root[data-appearance="dark"] .cell.count-3 .count { color: #e05a5a; }
  :root[data-appearance="dark"] .cell.count-4 .count { color: #aa83e8; }

  .starter,
  .mode,
  .resume,
  .theme-control {
    z-index: 4;
    display: grid;
    place-items: center;
    border: 0;
    padding: 0;
    color: var(--ink);
    text-decoration: none;
    -webkit-user-select: none;
    user-select: none;
    outline: none;
  }
  .starter {
    cursor: pointer;
    touch-action: manipulation;
    transition: transform 180ms cubic-bezier(.22, 1, .36, 1), filter 180ms ease;
  }
  .starter-content,
  .mode-content,
  .resume-content,
  .theme-content {
    position: relative;
    z-index: 2;
    display: grid;
    justify-items: center;
    gap: 1px;
  }
  .starter-icon {
    width: clamp(24px, 7vw, 32px);
    height: clamp(24px, 7vw, 32px);
  }
  .starter-label,
  .mode-name,
  .resume-name,
  .theme-name {
    max-width: 92%;
    font-size: clamp(.7rem, 3.2vw, .84rem);
    font-weight: 700;
    line-height: 1;
    letter-spacing: -.02em;
    text-align: center;
  }
  .starter:focus,
  .mode:focus,
  .resume:focus,
  .theme-control:focus {
    background: var(--control-accent, var(--focus));
    filter:
      drop-shadow(0 5px 2px var(--tile-drop))
      drop-shadow(0 0 5px var(--focus-drop));
    filter:
      drop-shadow(0 5px 2px color-mix(in srgb, var(--tile-shadow) 80%, transparent))
      drop-shadow(0 0 5px color-mix(in srgb, var(--control-accent, var(--focus)) 72%, transparent));
  }
  .starter:focus::before,
  .mode:focus::before,
  .resume:focus::before,
  .theme-control:focus::before { inset: 4px 5px 8px; }
  @media (hover: hover) {
    .starter:hover {
      background: var(--focus);
      filter:
        drop-shadow(0 5px 2px var(--tile-drop))
        drop-shadow(0 0 5px var(--focus-drop));
      filter:
        drop-shadow(0 5px 2px color-mix(in srgb, var(--tile-shadow) 80%, transparent))
        drop-shadow(0 0 5px color-mix(in srgb, var(--focus) 72%, transparent));
    }
    .starter:hover::before,
    .mode.is-available:hover::before,
    .resume.is-available:hover::before,
    .theme-control.is-available:hover::before { inset: 4px 5px 8px; }
  }
  .starter:active {
    transform: translate3d(var(--x), calc(var(--y) + 4px), 0) scale(.94);
  }
  .starter.is-hit {
    pointer-events: none;
    transform: translate3d(var(--x), calc(var(--y) + 5px), 0) scale(.9);
  }
  .starter.is-hit .starter-content { opacity: 0; transform: scale(.72); }
  .starter.is-cleared {
    z-index: 1;
    color: transparent;
    background: var(--well-edge);
    filter: drop-shadow(0 1px 1px var(--well-drop));
    filter: drop-shadow(0 1px 1px color-mix(in srgb, var(--well-shadow) 38%, transparent));
    transform: translate3d(var(--x), calc(var(--y) + 4px), 0) scale(.93);
  }
  .starter.is-cleared::before {
    inset: 5px 6px 7px;
    background: var(--well);
  }
  .starter-content {
    transition: opacity 120ms ease, transform 170ms cubic-bezier(.22, 1, .36, 1);
  }

  .mode {
    cursor: default;
    pointer-events: none;
    transition:
      transform 190ms cubic-bezier(.22, 1, .36, 1),
      filter 180ms ease,
      opacity 180ms ease;
  }
  .mode-content,
  .resume-content,
  .theme-content {
    gap: 2px;
    opacity: 0;
    transform: translateY(5px) scale(.78);
    transition: opacity 170ms ease, transform 230ms cubic-bezier(.22, 1, .36, 1);
  }
  .mode-icon,
  .resume-icon,
  .theme-icon {
    width: clamp(27px, 7.5vw, 36px);
    height: clamp(27px, 7.5vw, 36px);
    overflow: visible;
  }
  .mode-note,
  .resume-note,
  .theme-note {
    max-width: 92%;
    color: currentColor;
    opacity: .58;
    font-size: clamp(.5rem, 2.15vw, .62rem);
    font-weight: 600;
    line-height: 1;
    letter-spacing: .025em;
    text-align: center;
  }
  .mode-infinite,
  .resume[data-mode="infinite"] {
    --mode-accent: var(--infinite-accent);
    --control-accent: var(--infinite-accent);
  }
  .mode-bounded,
  .resume[data-mode="bounded"] {
    --mode-accent: var(--classic-accent);
    --control-accent: var(--classic-accent);
  }
  .mode-sphere,
  .resume[data-mode="sphere"] {
    --mode-accent: var(--sphere-accent);
    --control-accent: var(--sphere-accent);
  }
  .mode.is-available {
    z-index: 6;
    cursor: pointer;
    pointer-events: auto;
    background: var(--mode-accent, var(--focus));
    transform: translate3d(var(--x), var(--y), 0) scale(var(--choice-scale));
    filter:
      drop-shadow(0 7px 3px var(--tile-drop-strong))
      drop-shadow(0 0 12px var(--focus-glow));
    filter:
      drop-shadow(0 7px 3px color-mix(in srgb, var(--tile-shadow) 94%, transparent))
      drop-shadow(0 0 12px color-mix(in srgb, var(--mode-accent, var(--focus)) 42%, transparent));
  }
  .mode.is-available::before { inset: 3px 4px 7px; }
  .mode.is-available .mode-content { opacity: 1; transform: none; }
  .mode.is-available .mode-icon { color: var(--mode-accent, var(--focus)); }
  .mode.is-available:active {
    transform: translate3d(var(--x), calc(var(--y) + 4px), 0) scale(1);
  }
  .mode.is-dug {
    pointer-events: none;
    color: var(--dug-ink);
    color: color-mix(in srgb, var(--ink) 8%, var(--field));
    background: var(--well-edge);
    filter: drop-shadow(0 1px 1px var(--well-drop));
    filter: drop-shadow(0 1px 1px color-mix(in srgb, var(--well-shadow) 38%, transparent));
    transform: translate3d(var(--x), calc(var(--y) + 5px), 0) scale(.9);
  }
  .mode.is-dug::before { inset: 6px 7px 8px; background: var(--well); }
  .mode.is-dug .mode-content { transform: scale(.9); }

  .resume {
    z-index: 7;
    cursor: default;
    pointer-events: none;
    transition:
      transform 190ms cubic-bezier(.22, 1, .36, 1),
      filter 180ms ease,
      opacity 180ms ease;
  }
  .resume[hidden] { display: none; }
  .resume.is-available {
    cursor: pointer;
    pointer-events: auto;
    background: var(--mode-accent, var(--focus));
    transform: translate3d(var(--x), var(--y), 0) scale(var(--choice-scale));
    filter:
      drop-shadow(0 7px 3px color-mix(in srgb, var(--tile-shadow) 94%, transparent))
      drop-shadow(0 0 14px color-mix(in srgb, var(--mode-accent, var(--focus)) 50%, transparent));
  }
  .resume.is-available::before { inset: 3px 4px 7px; }
  .resume.is-available .resume-content { opacity: 1; transform: none; }
  .resume.is-available .resume-icon { color: var(--mode-accent, var(--focus)); }
  .resume.is-available:active {
    transform: translate3d(var(--x), calc(var(--y) + 4px), 0) scale(1);
  }
  .resume.is-dug {
    pointer-events: none;
    background: var(--well-edge);
    filter: drop-shadow(0 1px 1px color-mix(in srgb, var(--well-shadow) 38%, transparent));
    transform: translate3d(var(--x), calc(var(--y) + 5px), 0) scale(.9);
  }
  .resume.is-dug::before { inset: 6px 7px 8px; background: var(--well); }

  .theme-control {
    --control-accent: var(--theme-accent);
    z-index: 3;
    cursor: default;
    pointer-events: none;
    transition:
      transform 210ms cubic-bezier(.22, 1, .36, 1),
      filter 180ms ease,
      opacity 180ms ease,
      background 180ms ease;
  }
  .theme-control:disabled { opacity: 1; }
  .theme-hub.is-available {
    z-index: 6;
    cursor: pointer;
    pointer-events: auto;
    background: var(--theme-accent);
    transform: translate3d(var(--x), var(--y), 0) scale(1.025);
    filter:
      drop-shadow(0 5px 2px color-mix(in srgb, var(--tile-shadow) 88%, transparent))
      drop-shadow(0 0 8px color-mix(in srgb, var(--theme-accent) 28%, transparent));
  }
  .theme-hub.is-available::before { inset: 3px 4px 7px; }
  .theme-hub.is-available .theme-content { opacity: 1; transform: none; }
  .theme-hub.is-expanded {
    background: var(--well-edge);
    color: var(--well-ink);
    transform: translate3d(var(--x), calc(var(--y) + 4px), 0) scale(.95);
    filter: drop-shadow(0 1px 1px color-mix(in srgb, var(--well-shadow) 38%, transparent));
  }
  .theme-hub.is-expanded::before { inset: 5px 6px 7px; background: var(--well); }
  .theme-choice.is-available {
    z-index: 6;
    cursor: pointer;
    pointer-events: auto;
    background: var(--theme-accent);
    transform: translate3d(var(--x), var(--y), 0) scale(1.045);
    filter:
      drop-shadow(0 6px 2px color-mix(in srgb, var(--tile-shadow) 90%, transparent))
      drop-shadow(0 0 9px color-mix(in srgb, var(--theme-accent) 32%, transparent));
    animation: theme-bloom 240ms cubic-bezier(.22, 1, .36, 1) var(--bloom-delay, 0ms) backwards;
  }
  .theme-choice.is-available::before { inset: 3px 4px 7px; }
  .theme-choice.is-available .theme-content { opacity: 1; transform: none; }
  .theme-choice.is-available:active {
    transform: translate3d(var(--x), calc(var(--y) + 4px), 0) scale(.98);
  }
  .theme-choice.is-available[aria-pressed="true"]::after {
    content: "✓";
    position: absolute;
    z-index: 4;
    top: 17%;
    right: 21%;
    display: grid;
    place-items: center;
    width: 15px;
    height: 15px;
    border: 1.5px solid currentColor;
    border-radius: 50%;
    background: var(--tile);
    color: var(--theme-accent);
    font: 700 10px/1 var(--font-ui);
  }
  .theme-choice.is-available[aria-pressed="true"] .theme-icon {
    filter: drop-shadow(0 0 4px color-mix(in srgb, var(--theme-accent) 48%, transparent));
  }

  .board[data-phase="clearing"] .starter { animation: hit 220ms cubic-bezier(.22, 1, .36, 1) both; }
  .board[data-phase="ready"] .mode.is-available { animation: mode-rise 250ms cubic-bezier(.22, 1, .36, 1) backwards; }
  .board[data-phase="ready"] .resume.is-available { animation: mode-rise 250ms cubic-bezier(.22, 1, .36, 1) 105ms backwards; }
  .board[data-phase="ready"] .theme-hub.is-available { animation: utility-rise 230ms cubic-bezier(.22, 1, .36, 1) 125ms backwards; }
  .board[data-phase="ready"] .cell { opacity: .78; }
  .board[data-phase="ready"] .cell.is-revealed { opacity: .88; }
  .board[data-phase="ready"] .starter { opacity: .72; }
  .board[data-phase="ready"] .mode-bounded { animation-delay: 35ms; }
  .board[data-phase="ready"] .mode-sphere { animation-delay: 70ms; }
  .board.is-leaving .mode:not(.is-dug),
  .board.is-leaving .resume:not(.is-dug),
  .board.is-leaving .theme-control,
  .board.is-leaving .cell,
  .board.is-leaving .starter { opacity: .52; }
  .board.is-leaving .mode,
  .board.is-leaving .resume,
  .board.is-leaving .theme-control { pointer-events: none; }

  .masthead {
    position: fixed;
    z-index: 10;
    left: 50%;
    top: max(18px, calc(env(safe-area-inset-top) + 12px));
    transform: translateX(-50%);
    display: grid;
    justify-items: center;
    gap: 2px;
    max-width: calc(100vw - 32px);
    pointer-events: none;
    text-align: center;
    white-space: nowrap;
  }
  .brand {
    margin: 0;
    color: var(--ink);
    font-size: clamp(1.05rem, 5vw, 1.35rem);
    font-weight: 700;
    letter-spacing: .055em;
    line-height: 1;
    text-transform: uppercase;
    text-shadow: 0 2px 10px var(--brand-shadow);
    text-shadow: 0 2px 10px color-mix(in srgb, var(--field) 72%, transparent);
  }
  .hint {
    margin: 0;
    padding: 4px 0 0;
    color: var(--muted);
    font-size: clamp(.75rem, 3.3vw, .88rem);
    font-weight: 600;
    letter-spacing: .02em;
    text-shadow: 0 1px 8px var(--hint-shadow);
    text-shadow: 0 1px 8px color-mix(in srgb, var(--field) 84%, transparent);
    transition: color 180ms ease;
  }

  @media (max-height: 480px) and (orientation: landscape) {
    :root {
      --hex-w: clamp(56px, 16vh, 68px);
      --choice-scale: 1.05;
      --board-y: 28px;
    }
    .masthead {
      left: max(18px, calc(env(safe-area-inset-left) + 12px));
      top: max(12px, calc(env(safe-area-inset-top) + 8px));
      transform: none;
      justify-items: start;
      text-align: left;
    }
    .brand { font-size: 1rem; }
    .hint { font-size: .72rem; }
    .mode-content,
    .resume-content,
    .theme-content { gap: 0; }
    .mode-icon,
    .resume-icon,
    .theme-icon { width: 22px; height: 22px; }
    .mode-name,
    .resume-name,
    .theme-name { font-size: .62rem; }
    .mode-note,
    .resume-note,
    .theme-note { font-size: .45rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      scroll-behavior: auto !important;
      transition-duration: .01ms !important;
      animation-duration: .01ms !important;
      animation-delay: 0ms !important;
    }
  }
  @media (forced-colors: active) {
    body, body::before { background: Canvas; }
    .cell, .starter, .mode, .resume, .theme-control { color: ButtonText; background: ButtonText; filter: none; }
    .cell::before, .starter::before, .mode::before, .resume::before, .theme-control::before { background: Canvas; }
    .cell.is-revealed, .starter.is-cleared, .mode.is-dug, .resume.is-dug, .theme-hub.is-expanded { background: ButtonText; }
    .cell.is-revealed::before, .starter.is-cleared::before, .mode.is-dug::before,
    .resume.is-dug::before, .theme-hub.is-expanded::before { background: Canvas; }
    .count, .cell.count-1 .count, .cell.count-2 .count,
    .cell.count-3 .count, .cell.count-4 .count { color: CanvasText; text-shadow: none; }
    .starter:focus, .mode:focus, .resume:focus, .theme-control:focus { outline: 3px solid Highlight; outline-offset: -5px; }
    .theme-choice.is-available[aria-pressed="true"] { outline: 3px double Highlight; outline-offset: -7px; }
    .theme-choice.is-available[aria-pressed="true"]::after { background: Canvas; color: CanvasText; }
    .brand, .hint { color: CanvasText; text-shadow: none; }
  }
  @keyframes hit {
    45% { transform: translate3d(var(--x), calc(var(--y) + 7px), 0) scale(.86); }
  }
  @keyframes mode-rise {
    from {
      opacity: .35;
      transform: translate3d(var(--x), calc(var(--y) + 10px), 0) scale(.88);
    }
    72% { transform: translate3d(var(--x), calc(var(--y) - 2px), 0) scale(1.1); }
    to { transform: translate3d(var(--x), var(--y), 0) scale(var(--choice-scale)); }
  }
  @keyframes utility-rise {
    from {
      opacity: .45;
      transform: translate3d(var(--x), calc(var(--y) + 7px), 0) scale(.9);
    }
    to { transform: translate3d(var(--x), var(--y), 0) scale(1.025); }
  }
  @keyframes theme-bloom {
    from {
      opacity: .5;
      transform: translate3d(var(--x), calc(var(--y) + 4px), 0) scale(.84);
    }
    74% { transform: translate3d(var(--x), calc(var(--y) - 2px), 0) scale(1.075); }
    to { transform: translate3d(var(--x), var(--y), 0) scale(1.045); }
  }
</style>
</head>
<body>
<main>
  <nav class="board" id="game-menu" data-phase="covered" aria-label="Choose a Hexsweeper board">
    <header class="masthead">
      <h1 class="brand">Hexsweeper</h1>

    <button class="hex starter" id="opening-dig" type="button" data-q="0" data-r="0" aria-describedby="menu-status" aria-label="Dig the opening tile to reveal the game menu">

          <path d="M19.3 20.4c3.4-2.1 6.4-.9 8.2 2.1l-7.3 5.3c-2.5-2.2-2.9-5.1-.9-7.4Z" fill="currentColor"/>

    <a class="hex resume destination" id="resume-game" href="games/infinite.html" data-q="0" data-r="0" data-mode="infinite" aria-describedby="menu-status" aria-label="Resume Infinite Hexsweeper" hidden>
      <span class="resume-content">

          <path d="m21 16 14 8-14 8Z" fill="currentColor"/>

    <a class="hex mode mode-infinite destination" href="games/infinite.html" data-mode="infinite" data-q="0" data-r="-1" aria-label="Play Infinite Hexsweeper, endless board">
      <span class="mode-content">
        <svg class="mode-icon" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M6 24c0-5.4 3.7-9.5 9-9.5 8.3 0 10.6 19 18 19 5.3 0 9-4.1 9-9.5s-3.7-9.5-9-9.5c-7.4 0-9.7 19-18 19-5.3 0-9-4.1-9-9.5Z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="mode-name">Infinite</span>

    <a class="hex mode mode-bounded destination" href="games/bounded.html" data-mode="bounded" data-q="1" data-r="0" aria-label="Play Classic Hexsweeper, fixed board">
      <span class="mode-content">
        <svg class="mode-icon" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M24 5 40 14v20l-16 9-16-9V14Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          <path d="M17 35V14m1 2h14l-3.4 4.3L32 25H18m-4 11h9" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>

    <a class="hex mode mode-sphere destination" href="games/sphere.html" data-mode="sphere" data-q="-1" data-r="1" aria-label="Play Sphere Hexsweeper, 3D globe">
      <span class="mode-content">

          <path d="M24 6c-7 5-9 12-9 18s2 13 9 18M24 6c7 5 9 12 9 18s-2 13-9 18M6 24h36M9 15c9 4 21 4 30 0M9 33c9-4 21-4 30 0" fill="none" stroke="currentColor" stroke-width="1" opacity=".78"/>
        </svg>
        <span class="mode-name">Sphere</span>

    <button class="hex theme-control theme-hub" id="theme-toggle" type="button" data-q="0" data-r="-2" aria-describedby="menu-status" aria-expanded="false" aria-controls="theme-light theme-system theme-dark" aria-label="Choose launcher theme" disabled>
      <span class="theme-content">
        <svg class="theme-icon" viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="24" r="15" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M24 9a15 15 0 0 0 0 30Z" fill="currentColor" opacity=".88"/>
          <circle cx="24" cy="24" r="4" fill="var(--tile)"/>

        <span class="theme-name">Theme</span>

      </span>
    </button>

    <button class="hex theme-control theme-choice" id="theme-light" type="button" data-appearance="light" data-q="0" data-r="-3" style="--bloom-delay:0ms" aria-label="Use light launcher theme" aria-pressed="false" aria-hidden="true" tabindex="-1" disabled>
      <span class="theme-content">
        <svg class="theme-icon" viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="24" r="7" fill="none" stroke="currentColor" stroke-width="2.2"/>
          <path d="M24 7v6m0 22v6M7 24h6m22 0h6M12 12l4 4m16 16 4 4m0-24-4 4M16 32l-4 4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>

      </span>

    <button class="hex theme-control theme-choice" id="theme-system" type="button" data-appearance="system" data-q="1" data-r="-3" style="--bloom-delay:35ms" aria-label="Follow the system launcher theme" aria-pressed="false" aria-hidden="true" tabindex="-1" disabled>
      <span class="theme-content">
        <svg class="theme-icon" viewBox="0 0 48 48" aria-hidden="true">
          <rect x="8" y="10" width="32" height="23" rx="3" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M24 10h13a3 3 0 0 1 3 3v17a3 3 0 0 1-3 3H24Z" fill="currentColor" opacity=".82"/>
          <path d="M18 40h12M24 33v7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="theme-name">System</span>
      </span>

    <button class="hex theme-control theme-choice" id="theme-dark" type="button" data-appearance="dark" data-q="1" data-r="-2" style="--bloom-delay:70ms" aria-label="Use dark launcher theme" aria-pressed="false" aria-hidden="true" tabindex="-1" disabled>
      <span class="theme-content">
        <svg class="theme-icon" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M34 34A16 16 0 0 1 18 8a16 16 0 1 0 16 26Z" fill="currentColor"/>
        </svg>
        <span class="theme-name">Dark</span>
      </span>

</main>

<script>
(function () {
  "use strict";

  var board = document.getElementById("game-menu");
  var field = document.getElementById("menu-field");
  var starter = document.getElementById("opening-dig");
  var resume = document.getElementById("resume-game");
  var resumeModeName = document.getElementById("resume-mode-name");
  var themeToggle = document.getElementById("theme-toggle");
  var themeCurrent = document.getElementById("theme-current");
  var themeChoices = Array.prototype.slice.call(board.querySelectorAll(".theme-choice"));
  var status = document.getElementById("menu-status");
  var modes = Array.prototype.slice.call(board.querySelectorAll(".mode"));
  var positionedControls = [starter, resume, themeToggle].concat(modes, themeChoices);
  var reservedSeats = {
    "0,0": true,
    "0,-1": true,
    "1,0": true,
    "-1,1": true,
    "0,-2": true,
    "0,-3": true,
    "1,-3": true,
    "1,-2": true
  };
  var directions = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
  var cells = new Map();
  var mines = new Set();
  var revealed = new Set();
  var timers = [];
  var resizeTimer = null;
  var phase = "covered";
  var leaving = false;
  var themeOpen = false;
  var activeResume = null;
  var keyboardOpening = false;
  var pointerOpening = false;
  var SESSION_KEY = "hexsweeper-launcher-opening-v1";
  var APPEARANCE_KEY = "hexsweeper-appearance-v1";

  function key(q, r) { return q + "," + r; }
  function distance(q, r) { return Math.max(Math.abs(q), Math.abs(r), Math.abs(q + r)); }
  function reducedMotion() { return matchMedia("(prefers-reduced-motion: reduce)").matches; }

  function hash(q, r) {
    var n = Math.imul(q + 37, 374761393) ^ Math.imul(r - 19, 668265263) ^ 0x5f3759df;
    n = Math.imul(n ^ (n >>> 13), 1274126177);
    return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
  }

  function storageValue(store, storageKey) {
    try { return store.getItem(storageKey); } catch (_) { return null; }
  }

  function parseSave(raw) {
    if (!raw) return null;
    try { return JSON.parse(raw); } catch (_) { return null; }
  }

  function infiniteResumeCandidate() {
    var data = parseSave(storageValue(localStorage, "hexsweeper-endless-plate-v1"));
    if (!data || data.v !== 1 || data.endless !== true) return null;
    if (data.first !== false || data.over !== false || Number(data.cleared) <= 0) return null;
    return {
      mode: "infinite",
      name: "Infinite",
      href: "games/infinite.html",
      savedAt: Number(data.savedAt) || 0
    };
  }

  function sphereResumeCandidate() {
    var stores = [sessionStorage, localStorage];
    var keys = ["hexsweeper-sphere-run-v2", "hexsweeper-sphere-run-v1"];
    var best = null;
    stores.forEach(function (store) {
      keys.forEach(function (storageKey) {
        var data = parseSave(storageValue(store, storageKey));
        if (!data || (data.v !== 1 && data.v !== 2) || data.kind !== "sphere") return;
        if (data.over !== false || typeof data.first !== "boolean") return;
        var flagged = Array.isArray(data.flagged) ? data.flagged.length : Number(data.flags) || 0;
        if (data.first && flagged <= 0) return;
        if (!data.first && (!Array.isArray(data.mines) || data.mines.length === 0)) return;
        var candidate = {
          mode: "sphere",
          name: "Sphere",
          href: "games/sphere.html",
          savedAt: Number(data.savedAt) || 0
        };
        if (!best || candidate.savedAt >= best.savedAt) best = candidate;
      });
    });
    return best;
  }

  // Adapters keep launcher routing honest. Classic joins this list only when
  // its finite board gains a real persistence contract.
  function newestResumeCandidate() {
    return [infiniteResumeCandidate(), sphereResumeCandidate()]
      .filter(Boolean)
      .sort(function (a, b) { return b.savedAt - a.savedAt; })[0] || null;
  }

  function buildMines() {
    mines.clear();
    for (var r = -14; r <= 14; r += 1) {
      for (var q = -14; q <= 14; q += 1) {
        if (distance(q, r) >= 3 && hash(q, r) < .205) mines.add(key(q, r));
      }
    }
    Object.keys(reservedSeats).forEach(function (seat) { mines.delete(seat); });
    // Every ring-two boundary face gets at least one real outward mine, so
    // the zero flood always stops in a readable numbered frontier.
    for (var rr = -2; rr <= 2; rr += 1) {
      for (var qq = -2; qq <= 2; qq += 1) {
        if (distance(qq, rr) !== 2) continue;
        var outward = [];
        directions.forEach(function (dir) {
          var nq = qq + dir[0];
          var nr = rr + dir[1];
          if (distance(nq, nr) === 3 && !reservedSeats[key(nq, nr)]) outward.push([nq, nr]);
        });
        if (!outward.some(function (p) { return mines.has(key(p[0], p[1])); })) {
          outward.sort(function (a, b) { return hash(a[0], a[1]) - hash(b[0], b[1]); });
          if (outward[0]) mines.add(key(outward[0][0], outward[0][1]));
        }
      }
    }
  }

  function countAt(q, r) {
    var count = 0;
    directions.forEach(function (dir) {
      if (mines.has(key(q + dir[0], r + dir[1]))) count += 1;
    });
    return count;
  }

  function place(element, q, r, width, height) {
    var x = width * (q + r / 2);
    var y = height * .75 * r;
    element.style.setProperty("--x", x.toFixed(2) + "px");
    element.style.setProperty("--y", y.toFixed(2) + "px");
  }

  function buildField() {
    field.textContent = "";
    cells.clear();
    var probe = starter.getBoundingClientRect();
    var width = probe.width;
    var height = probe.height;
    var qLimit = Math.ceil(innerWidth / width) + 4;
    var rLimit = Math.ceil(innerHeight / (height * .75) / 2) + 4;
    var fragment = document.createDocumentFragment();

    for (var r = -Math.ceil(rLimit); r <= Math.ceil(rLimit); r += 1) {
      for (var q = -qLimit; q <= qLimit; q += 1) {
        var id = key(q, r);
        if (reservedSeats[id]) continue;
        var x = width * (q + r / 2);
        var y = height * .75 * r;
        if (Math.abs(x) > innerWidth / 2 + width || Math.abs(y) > innerHeight / 2 + height) continue;
        var cell = document.createElement("span");
        var count = countAt(q, r);
        cell.className = "hex cell" + (count ? " count-" + Math.min(4, count) : "");
        cell.dataset.key = id;
        cell.dataset.count = String(count);
        place(cell, q, r, width, height);
        var mark = document.createElement("span");
        mark.className = "count";
        mark.textContent = count ? String(count) : "";
        cell.appendChild(mark);
        if (revealed.has(id)) cell.classList.add("is-revealed");
        cells.set(id, cell);
        fragment.appendChild(cell);
      }
    }
    field.appendChild(fragment);
    positionedControls.forEach(function (control) {
      place(control, Number(control.dataset.q), Number(control.dataset.r), width, height);
    });
  }

  function floodPlan() {
    var queue = [{ q: 0, r: 0, step: 0 }];
    var seen = new Set(["0,0"]);
    var plan = [];
    while (queue.length) {
      var item = queue.shift();
      var id = key(item.q, item.r);
      if (!reservedSeats[id]) {
        plan.push({ key: id, step: item.step, jitter: Math.round(hash(item.q, item.r) * 34) });
      }
      if (countAt(item.q, item.r) !== 0 || distance(item.q, item.r) >= 2) continue;
      directions.forEach(function (dir) {
        var q = item.q + dir[0];
        var r = item.r + dir[1];
        var nextKey = key(q, r);
        if (seen.has(nextKey) || mines.has(nextKey) || reservedSeats[nextKey]) return;
        seen.add(nextKey);
        queue.push({ q: q, r: r, step: item.step + 1 });
      });
    }
    return plan;
  }

  function revealCell(id) {
    revealed.add(id);
    var cell = cells.get(id);
    if (cell) cell.classList.add("is-revealed");
  }

  function clearTimers() {
    timers.forEach(clearTimeout);
    timers.length = 0;
  }

  function rememberReady() {
    try { sessionStorage.setItem(SESSION_KEY, "1"); } catch (_) {}
  }

  function updateReadyStatus() {
    if (phase !== "ready" || leaving) return;
    if (themeOpen) {
      status.textContent = "Choose a launcher theme";
    } else if (activeResume) {
      status.textContent = "Resume " + activeResume.name + ", or choose a board";
    } else {
      status.textContent = "Choose a board";
    }
  }

  function refreshResume() {
    activeResume = newestResumeCandidate();
    resume.classList.remove("is-available", "is-dug");
    if (!activeResume) {
      resume.hidden = true;
      resume.removeAttribute("data-mode");
      updateReadyStatus();
      return;
    }
    resume.hidden = false;
    resume.href = activeResume.href;
    resume.dataset.mode = activeResume.mode;
    resumeModeName.textContent = activeResume.name;
    resume.setAttribute("aria-label", "Resume " + activeResume.name + " Hexsweeper");
    if (phase === "ready") resume.classList.add("is-available");
    updateReadyStatus();
  }

  function syncThemeChoices() {
    themeCurrent.textContent = appearancePreference === "system"
      ? "System"
      : appearancePreference.charAt(0).toUpperCase() + appearancePreference.slice(1);
    themeChoices.forEach(function (choice) {
      choice.setAttribute("aria-pressed", choice.dataset.appearance === appearancePreference ? "true" : "false");
    });
  }

  function openTheme(event) {
    if (phase !== "ready") {
      finishOpening(true);
      return;
    }
    if (themeOpen || leaving) return;
    themeOpen = true;
    board.classList.add("is-theme-open");
    themeToggle.classList.add("is-expanded");
    themeToggle.setAttribute("aria-expanded", "true");
    themeChoices.forEach(function (choice) {
      choice.disabled = false;
      choice.tabIndex = 0;
      choice.setAttribute("aria-hidden", "false");
      choice.classList.add("is-available");
    });
    updateReadyStatus();
    if (event && event.detail === 0) {
      var selected = themeChoices.find(function (choice) {
        return choice.dataset.appearance === appearancePreference;
      });
      if (selected) selected.focus({ preventScroll: true });
    }
  }

  function closeTheme(options) {
    if (!themeOpen) return;
    var opts = options || {};
    themeOpen = false;
    board.classList.remove("is-theme-open");
    themeToggle.classList.remove("is-expanded");
    themeToggle.setAttribute("aria-expanded", "false");
    themeChoices.forEach(function (choice) {
      choice.classList.remove("is-available");
      choice.disabled = true;
      choice.tabIndex = -1;
      choice.setAttribute("aria-hidden", "true");
    });
    updateReadyStatus();
    if (opts.focus) themeToggle.focus({ preventScroll: true });
  }

  function toggleTheme(event) {
    event.preventDefault();
    event.stopPropagation();
    if (themeOpen) closeTheme({ focus: event.detail === 0 });
    else openTheme(event);
  }

  function selectTheme(event) {
    event.preventDefault();
    event.stopPropagation();
    var next = event.currentTarget.dataset.appearance;
    if (next !== "system" && next !== "light" && next !== "dark") return;
    appearancePreference = next;
    try { localStorage.setItem(APPEARANCE_KEY, next); } catch (_) {}
    applyAppearance();
    status.textContent = themeCurrent.textContent + " theme selected";
  }

  function finishOpening(instant) {
    if (phase === "ready") {
      refreshResume();
      return;
    }
    var focusFirstMode = keyboardOpening || (!pointerOpening && document.activeElement === starter);
    clearTimers();
    floodPlan().forEach(function (item) { revealCell(item.key); });
    phase = "ready";
    board.dataset.phase = "ready";
    board.removeAttribute("aria-busy");
    starter.classList.remove("is-hit");
    starter.classList.add("is-cleared");
    starter.disabled = true;
    starter.tabIndex = -1;
    starter.setAttribute("aria-hidden", "true");
    modes.forEach(function (mode) { mode.classList.add("is-available"); });
    themeToggle.disabled = false;
    themeToggle.classList.add("is-available");
    refreshResume();
    updateReadyStatus();
    rememberReady();
    keyboardOpening = false;
    pointerOpening = false;
    if (focusFirstMode) {
      (activeResume ? resume : modes[0]).focus({ preventScroll: true });
    }
  }

  function startOpening(event) {
    if (phase !== "covered") return;
    clearTimers();
    if (event) {
      event.preventDefault();
      event.stopPropagation();
      keyboardOpening = event.detail === 0;
      pointerOpening = event.detail > 0;
    }
    phase = "clearing";
    board.dataset.phase = "clearing";
    board.setAttribute("aria-busy", "true");
    starter.classList.add("is-hit");
    status.textContent = "Revealing the game menu…";
    if (reducedMotion()) {
      finishOpening(true);
      return;
    }
    var plan = floodPlan();
    var latest = 0;
    plan.forEach(function (item) {
      var delay = 55 + item.step * 82 + Math.round(item.jitter * .72);
      latest = Math.max(latest, delay);
      timers.push(setTimeout(function () {
        if (phase === "clearing") revealCell(item.key);
      }, delay));
    });
    timers.push(setTimeout(function () {
      if (phase !== "clearing") return;
      starter.classList.add("is-cleared");
    }, 70));
    timers.push(setTimeout(function () { finishOpening(false); }, latest + 110));
  }

  function chooseDestination(event) {
    var destination = event.currentTarget;
    if (phase !== "ready") {
      event.preventDefault();
      finishOpening(true);
      return;
    }
    if (leaving || event.defaultPrevented) {
      event.preventDefault();
      return;
    }
    if (event.button !== undefined && event.button !== 0) return;
    if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
    event.preventDefault();
    closeTheme();
    leaving = true;
    destination.classList.add("is-dug");
    board.setAttribute("aria-busy", "true");
    board.classList.add("is-leaving");
    var modeName = destination === resume
      ? resumeModeName.textContent
      : destination.querySelector(".mode-name").textContent;
    status.textContent = (destination === resume ? "Resuming " : "Opening ") + modeName;
    var delay = reducedMotion() ? 30 : 230;
    setTimeout(function () { location.href = destination.href; }, delay);
  }

  starter.addEventListener("click", startOpening);
  board.addEventListener("click", function (event) {
    if (themeOpen && !event.target.closest(".theme-control")) {
      closeTheme();
    }
    if (phase === "covered" && !event.target.closest(".destination") && !event.target.closest(".theme-control") && !event.target.closest(".starter")) {
      startOpening(event);
      return;
    }
    if (phase === "clearing" && !event.target.closest(".destination") && !event.target.closest(".theme-control") && !event.target.closest(".starter")) {
      event.preventDefault();
      finishOpening(true);
    }
  });
  modes.forEach(function (mode) {
    mode.addEventListener("focus", function () {
      if (phase !== "ready") finishOpening(true);
    });
    mode.addEventListener("click", chooseDestination);
  });
  resume.addEventListener("click", chooseDestination);
  themeToggle.addEventListener("click", toggleTheme);
  themeChoices.forEach(function (choice) {
    choice.addEventListener("click", selectTheme);
  });

  addEventListener("keydown", function (event) {
    if (event.key === "Escape" && themeOpen) {
      event.preventDefault();
      closeTheme({ focus: true });
    }
  });

  addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      if (phase === "clearing") finishOpening(true);
      buildField();
    }, 80);
  });
  addEventListener("pageshow", function (event) {
    if (!event.persisted) return;
    leaving = false;
    board.classList.remove("is-leaving");
    board.removeAttribute("aria-busy");
    board.querySelectorAll(".destination").forEach(function (destination) {
      destination.classList.remove("is-dug");
    });
    closeTheme();
    refreshResume();
    finishOpening(true);
  });

  var appearancePreference = "system";
  try {
    var storedAppearance = localStorage.getItem(APPEARANCE_KEY);
    if (storedAppearance === "system" || storedAppearance === "light" || storedAppearance === "dark") {
      appearancePreference = storedAppearance;
    }
  } catch (_) {}
  var colorScheme = matchMedia("(prefers-color-scheme: dark)");
  function applyAppearance() {
    document.documentElement.dataset.appearance = appearancePreference === "system"
      ? (colorScheme.matches ? "dark" : "light")
      : appearancePreference;
    document.documentElement.dataset.appearanceChoice = appearancePreference;
    syncThemeChoices();
  }
  applyAppearance();
  if (colorScheme.addEventListener) colorScheme.addEventListener("change", applyAppearance);
  else if (colorScheme.addListener) colorScheme.addListener(applyAppearance);

  buildMines();
  buildField();
  var alreadyOpened = false;
  try { alreadyOpened = sessionStorage.getItem(SESSION_KEY) === "1"; } catch (_) {}
  if (alreadyOpened) finishOpening(true);
  else if (reducedMotion()) startOpening();
  else timers.push(setTimeout(function () { startOpening(); }, 220));
})();
</script>
</body>
</html>
