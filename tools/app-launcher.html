<!DOCTYPE html>
<!--
  File Purpose: Native app launcher staged as one authentic Hexsweeper opening.
  Primary Functions/Classes: deterministic mine field, neighbor counts, zero-cell
    flood reveal, resumable-run routing, and per-board option flowers.
  Inputs: viewport, saved runs/preferences, session reveal state. Outputs: game links.
  A11y: native button/links, visible focus, 50px+ targets, live status, keyboard
    reveal bypass, reduced motion, forced colors, and no timing-dependent action.
  Author: Luke Steuber <luke@lukesteuber.com>
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hexsweeper</title>
<meta name="description" content="Choose Infinite, Classic, or Sphere Hexsweeper from one safe opening.">
{{FONTS}}
<style>
  :root {
    --font-ui: "IBM Plex Sans", system-ui, sans-serif;
    --font-count: "IBM Plex Mono", ui-monospace, monospace;
    --field: #e8eef5;
    --field-glow: #f8fafc;
    --tile: #f7f9fc;
    --tile-edge: #aebdce;
    --tile-shadow: #c8d4e1;
    --well: #8f9db0;
    --well-ink: #172231;
    --well-edge: #738397;
    --well-shadow: #657386;
    --ink: #263240;
    --muted: #68798c;
    --focus: #246da0;
    --infinite-accent: #246da0;
    --classic-accent: #16794f;
    --sphere-accent: #724ab5;
    --theme-accent: #4e647b;
    --settings-accent: #4e647b;
    --flag: #e33030;
    --ambient-strong: rgba(248, 250, 252, .84);
    --ambient-soft: rgba(248, 250, 252, .28);
    --edge-haze: rgba(200, 212, 225, .24);
    --tile-drop: rgba(200, 212, 225, .76);
    --tile-drop-strong: rgba(200, 212, 225, .94);
    --well-drop: rgba(255, 255, 255, .38);
    --focus-drop: rgba(36, 109, 160, .72);
    --focus-glow: rgba(36, 109, 160, .42);
    --count-shadow: rgba(248, 250, 252, .60);
    --brand-shadow: rgba(232, 238, 245, .72);
    --hint-shadow: rgba(232, 238, 245, .84);
    --dug-ink: #d9dfe7;
    --hex-w: clamp(58px, 19vw, 86px);
    --hex-h: calc(var(--hex-w) * 1.1547);
    --choice-scale: 1.08;
    --board-x: 0px;
    --board-y: 0px;
    color-scheme: light dark;
  }
  :root[data-appearance="dark"] {
    --field: #0c1118;
    --field-glow: #18212d;
    --tile: #171f29;
    --tile-edge: #536174;
    --tile-shadow: #070a0f;
    --well: #d7e0eb;
    --well-ink: #182331;
    --well-edge: #f2f6fb;
    --well-shadow: #ffffff;
    --ink: #edf3fb;
    --muted: #a8b6c7;
    --focus: #78c5f4;
    --infinite-accent: #78c5f4;
    --classic-accent: #20a873;
    --sphere-accent: #aa83e8;
    --theme-accent: #a8b6c7;
    --settings-accent: #a8b6c7;
    --ambient-strong: rgba(24, 33, 45, .84);
    --ambient-soft: rgba(24, 33, 45, .28);
    --edge-haze: rgba(7, 10, 15, .24);
    --tile-drop: rgba(7, 10, 15, .76);
    --tile-drop-strong: rgba(7, 10, 15, .94);
    --focus-drop: rgba(120, 197, 244, .72);
    --focus-glow: rgba(120, 197, 244, .42);
    --count-shadow: rgba(24, 33, 45, .60);
    --brand-shadow: rgba(12, 17, 24, .72);
    --hint-shadow: rgba(12, 17, 24, .84);
    --dug-ink: #1e252f;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; }
  body {
    margin: 0;
    min-width: 280px;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-text-size-adjust: 100%;
    font-family: var(--font-ui);
    color: var(--ink);
    background: var(--field);
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(82% 62% at 50% 48%, var(--ambient-strong), transparent 72%),
      linear-gradient(180deg, var(--ambient-soft), transparent 24% 76%, var(--edge-haze));
    background:
      radial-gradient(82% 62% at 50% 48%, color-mix(in srgb, var(--field-glow) 84%, transparent), transparent 72%),
      linear-gradient(180deg, color-mix(in srgb, var(--field-glow) 28%, transparent), transparent 24% 76%, color-mix(in srgb, var(--tile-shadow) 24%, transparent));
  }

  main, .board, .field { position: fixed; inset: 0; }
  .board {
    isolation: isolate;
    overflow: hidden;
  }
  .field {
    z-index: 0;
    pointer-events: none;
    transition: opacity 180ms ease;
  }
  .hex {
    position: absolute;
    left: calc(50% + var(--board-x));
    top: calc(50% + var(--board-y));
    width: var(--hex-w);
    height: var(--hex-h);
    margin-left: calc(var(--hex-w) / -2);
    margin-top: calc(var(--hex-h) / -2);
    transform: translate3d(var(--x), var(--y), 0);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
  }
  .cell,
  .starter,
  .mode,
  .resume,
  .theme-control {
    background: var(--tile-edge);
    filter: drop-shadow(0 4px 2px var(--tile-drop));
    filter: drop-shadow(0 4px 2px color-mix(in srgb, var(--tile-shadow) 76%, transparent));
  }
  .cell::before,
  .starter::before,
  .mode::before,
  .resume::before,
  .theme-control::before {
    content: "";
    position: absolute;
    inset: 2px 3px 6px;
    clip-path: inherit;
    background:
      radial-gradient(90% 70% at 47% 28%, var(--field-glow), transparent 78%),
      var(--tile);
    transition: inset 170ms ease, transform 170ms ease, background 170ms ease;
  }

  .cell {
    z-index: 0;
    display: grid;
    place-items: center;
    transition:
      transform 210ms cubic-bezier(.22, 1, .36, 1),
      filter 180ms ease,
      opacity 180ms ease;
  }
  .cell.is-revealed {
    z-index: 1;
    background: var(--well-edge);
    filter: drop-shadow(0 1px 1px var(--well-drop));
    filter: drop-shadow(0 1px 1px color-mix(in srgb, var(--well-shadow) 38%, transparent));
    transform: translate3d(var(--x), calc(var(--y) + 4px), 0) scale(.93);
  }
  .cell.is-revealed::before {
    inset: 5px 6px 7px;
    background: var(--well);
  }
  .count {
    position: relative;
    z-index: 2;
    opacity: 0;
    transform: translateY(-2px) scale(.78);
    color: var(--ink);
    font: 700 clamp(.78rem, 3.7vw, 1.05rem)/1 var(--font-count);
    text-shadow: 0 1px 0 var(--count-shadow);
    text-shadow: 0 1px 0 color-mix(in srgb, var(--field-glow) 60%, transparent);
    transition: opacity 130ms ease 50ms, transform 170ms cubic-bezier(.22, 1, .36, 1) 35ms;
  }
  .cell.is-revealed .count { opacity: 1; transform: none; }
  .cell.count-1 .count { color: #125cc8; }
  .cell.count-2 .count { color: #16794f; }
  .cell.count-3 .count { color: #c43131; }
  .cell.count-4 .count { color: #724ab5; }
  :root[data-appearance="dark"] .cell.count-1 .count { color: #438cff; }
  :root[data-appearance="dark"] .cell.count-2 .count { color: #20a873; }
  :root[data-appearance="dark"] .cell.count-3 .count { color: #e05a5a; }
  :root[data-appearance="dark"] .cell.count-4 .count { color: #aa83e8; }

  .starter,
  .mode,
  .resume,
  .theme-control {
    z-index: 4;
    display: grid;
    place-items: center;
    border: 0;
    padding: 0;
    color: var(--ink);
    text-decoration: none;
    -webkit-user-select: none;
    user-select: none;
    outline: none;
  }
  .starter {
    cursor: pointer;
    touch-action: manipulation;
    transition: transform 180ms cubic-bezier(.22, 1, .36, 1), filter 180ms ease;
  }
  .starter-content,
  .mode-content,
  .resume-content,
  .theme-content {
    position: relative;
    z-index: 2;
    display: grid;
    justify-items: center;
    gap: 1px;
  }
  .starter-icon {
    width: clamp(24px, 7vw, 32px);
    height: clamp(24px, 7vw, 32px);
  }
  .starter-label,
  .mode-name,
  .resume-name,
  .theme-name {
    max-width: 92%;
    font-size: clamp(.62rem, calc(var(--hex-w) * .145), .84rem);
    font-weight: 700;
    line-height: 1;
    letter-spacing: -.02em;
    text-align: center;
  }
  .starter:focus,
  .mode:focus,
  .resume:focus,
  .theme-control:focus {
    background: var(--control-accent, var(--focus));
    filter:
      drop-shadow(0 5px 2px var(--tile-drop))
      drop-shadow(0 0 5px var(--focus-drop));
    filter:
      drop-shadow(0 5px 2px color-mix(in srgb, var(--tile-shadow) 80%, transparent))
      drop-shadow(0 0 5px color-mix(in srgb, var(--control-accent, var(--focus)) 72%, transparent));
  }
  .starter:focus::before,
  .mode:focus::before,
  .resume:focus::before,
  .theme-control:focus::before { inset: 4px 5px 8px; }
  @media (hover: hover) {
    .starter:hover {
      background: var(--focus);
      filter:
        drop-shadow(0 5px 2px var(--tile-drop))
        drop-shadow(0 0 5px var(--focus-drop));
      filter:
        drop-shadow(0 5px 2px color-mix(in srgb, var(--tile-shadow) 80%, transparent))
        drop-shadow(0 0 5px color-mix(in srgb, var(--focus) 72%, transparent));
    }
    .starter:hover::before,
    .mode.is-available:hover::before,
    .resume.is-available:hover::before,
    .theme-control.is-available:hover::before { inset: 4px 5px 8px; }
  }
  .starter:active {
    transform: translate3d(var(--x), calc(var(--y) + 4px), 0) scale(.94);
  }
  .starter.is-hit {
    pointer-events: none;
    transform: translate3d(var(--x), calc(var(--y) + 5px), 0) scale(.9);
  }
  .starter.is-hit .starter-content { opacity: 0; transform: scale(.72); }
  .starter.is-cleared {
    z-index: 1;
    color: transparent;
    background: var(--well-edge);
    filter: drop-shadow(0 1px 1px var(--well-drop));
    filter: drop-shadow(0 1px 1px color-mix(in srgb, var(--well-shadow) 38%, transparent));
    transform: translate3d(var(--x), calc(var(--y) + 4px), 0) scale(.93);
  }
  .starter.is-cleared::before {
    inset: 5px 6px 7px;
    background: var(--well);
  }
  .starter-content {
    transition: opacity 120ms ease, transform 170ms cubic-bezier(.22, 1, .36, 1);
  }

  .mode {
    cursor: default;
    pointer-events: none;
    transition:
      transform 190ms cubic-bezier(.22, 1, .36, 1),
      filter 180ms ease,
      opacity 180ms ease;
  }
  .mode-content,
  .resume-content,
  .theme-content {
    gap: 2px;
    opacity: 0;
    transform: translateY(5px) scale(.78);
    transition: opacity 170ms ease, transform 230ms cubic-bezier(.22, 1, .36, 1);
  }
  .mode-icon,
  .resume-icon,
  .theme-icon {
    width: clamp(22px, calc(var(--hex-w) * .36), 36px);
    height: clamp(22px, calc(var(--hex-w) * .36), 36px);
    overflow: visible;
  }
  .mode-note,
  .resume-note,
  .theme-note {
    max-width: 92%;
    color: currentColor;
    opacity: .58;
    font-size: clamp(.46rem, calc(var(--hex-w) * .105), .62rem);
    font-weight: 600;
    line-height: 1;
    letter-spacing: .025em;
    text-align: center;
  }
  .mode-infinite,
  .resume[data-mode="infinite"] {
    --mode-accent: var(--infinite-accent);
    --control-accent: var(--infinite-accent);
  }
  .mode-bounded,
  .resume[data-mode="bounded"] {
    --mode-accent: var(--classic-accent);
    --control-accent: var(--classic-accent);
  }
  .mode-sphere,
  .resume[data-mode="sphere"] {
    --mode-accent: var(--sphere-accent);
    --control-accent: var(--sphere-accent);
  }
  .mode.is-available {
    z-index: 6;
    cursor: pointer;
    pointer-events: auto;
    background: var(--mode-accent, var(--focus));
    transform: translate3d(var(--x), var(--y), 0) scale(var(--choice-scale));
    filter:
      drop-shadow(0 7px 3px var(--tile-drop-strong))
      drop-shadow(0 0 12px var(--focus-glow));
    filter:
      drop-shadow(0 7px 3px color-mix(in srgb, var(--tile-shadow) 94%, transparent))
      drop-shadow(0 0 12px color-mix(in srgb, var(--mode-accent, var(--focus)) 42%, transparent));
  }
  .mode.is-available::before { inset: 3px 4px 7px; }
  .mode.is-available .mode-content { opacity: 1; transform: none; }
  .mode.is-available .mode-icon { color: var(--mode-accent, var(--focus)); }
  .mode.is-available:active {
    transform: translate3d(var(--x), calc(var(--y) + 4px), 0) scale(1);
  }
  .mode.is-dug {
    pointer-events: none;
    color: var(--dug-ink);
    color: color-mix(in srgb, var(--ink) 8%, var(--field));
    background: var(--well-edge);
    filter: drop-shadow(0 1px 1px var(--well-drop));
    filter: drop-shadow(0 1px 1px color-mix(in srgb, var(--well-shadow) 38%, transparent));
    transform: translate3d(var(--x), calc(var(--y) + 5px), 0) scale(.9);
  }
  .mode.is-dug::before { inset: 6px 7px 8px; background: var(--well); }
  .mode.is-dug .mode-content { transform: scale(.9); }

  .resume {
    z-index: 7;
    cursor: default;
    pointer-events: none;
    transition:
      transform 190ms cubic-bezier(.22, 1, .36, 1),
      filter 180ms ease,
      opacity 180ms ease;
  }
  .resume[hidden] { display: none; }
  .resume.is-available {
    cursor: pointer;
    pointer-events: auto;
    background: var(--mode-accent, var(--focus));
    transform: translate3d(var(--x), var(--y), 0) scale(var(--choice-scale));
    filter:
      drop-shadow(0 7px 3px color-mix(in srgb, var(--tile-shadow) 94%, transparent))
      drop-shadow(0 0 14px color-mix(in srgb, var(--mode-accent, var(--focus)) 50%, transparent));
  }
  .resume.is-available::before { inset: 3px 4px 7px; }
  .resume.is-available .resume-content { opacity: 1; transform: none; }
  .resume.is-available .resume-icon { color: var(--mode-accent, var(--focus)); }
  .resume.is-available:active {
    transform: translate3d(var(--x), calc(var(--y) + 4px), 0) scale(1);
  }
  .resume.is-dug {
    pointer-events: none;
    background: var(--well-edge);
    filter: drop-shadow(0 1px 1px color-mix(in srgb, var(--well-shadow) 38%, transparent));
    transform: translate3d(var(--x), calc(var(--y) + 5px), 0) scale(.9);
  }
  .resume.is-dug::before { inset: 6px 7px 8px; background: var(--well); }

  .theme-control {
    --control-accent: var(--theme-accent);
    z-index: 3;
    cursor: default;
    pointer-events: none;
    transition:
      transform 210ms cubic-bezier(.22, 1, .36, 1),
      filter 180ms ease,
      opacity 180ms ease,
      background 180ms ease;
  }
  .theme-control:disabled { opacity: 1; }
  .theme-hub.is-available {
    z-index: 6;
    cursor: pointer;
    pointer-events: auto;
    background: color-mix(in srgb, var(--control-accent, var(--theme-accent)) 58%, var(--tile-edge));
    transform: translate3d(var(--x), var(--y), 0) scale(.97);
    filter:
      drop-shadow(0 5px 2px color-mix(in srgb, var(--tile-shadow) 88%, transparent))
      drop-shadow(0 0 6px color-mix(in srgb, var(--control-accent, var(--theme-accent)) 20%, transparent));
  }
  .theme-hub.is-available::before { inset: 3px 4px 7px; }
  .theme-hub.is-available .theme-content { opacity: 1; transform: none; }
  .theme-hub.is-expanded {
    background: var(--well-edge);
    color: var(--well-ink);
    transform: translate3d(var(--x), calc(var(--y) + 4px), 0) scale(.95);
    filter: drop-shadow(0 1px 1px color-mix(in srgb, var(--well-shadow) 38%, transparent));
  }
  .theme-hub.is-expanded::before { inset: 5px 6px 7px; background: var(--well); }
  .theme-choice.is-available {
    z-index: 6;
    cursor: pointer;
    pointer-events: auto;
    background: var(--control-accent, var(--theme-accent));
    transform: translate3d(var(--x), var(--y), 0) scale(1.045);
    filter:
      drop-shadow(0 6px 2px color-mix(in srgb, var(--tile-shadow) 90%, transparent))
      drop-shadow(0 0 9px color-mix(in srgb, var(--control-accent, var(--theme-accent)) 32%, transparent));
    animation: theme-bloom 240ms cubic-bezier(.22, 1, .36, 1) var(--bloom-delay, 0ms) backwards;
  }
  .theme-choice.is-available::before { inset: 3px 4px 7px; }
  .theme-choice.is-available .theme-content { opacity: 1; transform: none; }
  .theme-choice.is-available:active {
    transform: translate3d(var(--x), calc(var(--y) + 4px), 0) scale(.98);
  }
  .theme-choice.is-available[aria-current="true"]::after {
    content: "✓";
    position: absolute;
    z-index: 4;
    top: 17%;
    right: 21%;
    display: grid;
    place-items: center;
    width: 15px;
    height: 15px;
    border: 1.5px solid currentColor;
    border-radius: 50%;
    background: var(--tile);
    color: var(--control-accent, var(--theme-accent));
    font: 700 10px/1 var(--font-ui);
  }
  .theme-choice.is-available[aria-current="true"] .theme-icon {
    filter: drop-shadow(0 0 4px color-mix(in srgb, var(--control-accent, var(--theme-accent)) 48%, transparent));
  }
  .size-choice .theme-icon {
    display: grid;
    place-items: center;
    font: 700 clamp(1.15rem, 6vw, 1.55rem)/1 var(--font-count);
  }
  .theme-choice.is-dug {
    pointer-events: none;
    color: var(--dug-ink);
    background: var(--well-edge);
    filter: drop-shadow(0 1px 1px color-mix(in srgb, var(--well-shadow) 38%, transparent));
    transform: translate3d(var(--x), calc(var(--y) + 5px), 0) scale(.9);
  }
  .theme-choice.is-dug::before { inset: 6px 7px 8px; background: var(--well); }
  .theme-choice.is-dug .theme-content { transform: scale(.9); }

  .infinite-hub,
  .infinite-choice { --control-accent: var(--infinite-accent); }
  .size-hub,
  .size-choice { --control-accent: var(--classic-accent); }
  .style-hub,
  .style-choice { --control-accent: var(--sphere-accent); }
  .board[data-open-branch] .field { opacity: .56; }
  .board[data-open-branch] .mode,
  .board[data-open-branch] .resume,
  .board[data-open-branch] .theme-hub {
    opacity: .16;
    pointer-events: none;
  }
  .board[data-open-branch="infinite"] .mode-infinite,
  .board[data-open-branch="infinite"] .infinite-hub,
  .board[data-open-branch="size"] .mode-bounded,
  .board[data-open-branch="size"] .size-hub,
  .board[data-open-branch="style"] .mode-sphere,
  .board[data-open-branch="style"] .style-hub {
    opacity: 1;
    pointer-events: auto;
  }
  .board[data-open-branch] .theme-hub.is-expanded {
    filter: drop-shadow(0 1px 1px color-mix(in srgb, var(--well-shadow) 38%, transparent));
  }

  .board[data-phase="clearing"] .starter { animation: hit 220ms cubic-bezier(.22, 1, .36, 1) both; }
  .board[data-phase="ready"] .mode.is-available { animation: mode-rise 250ms cubic-bezier(.22, 1, .36, 1) backwards; }
  .board[data-phase="ready"] .resume.is-available { animation: mode-rise 250ms cubic-bezier(.22, 1, .36, 1) 105ms backwards; }
  .board[data-phase="ready"] .theme-hub.is-available { animation: utility-rise 230ms cubic-bezier(.22, 1, .36, 1) 125ms backwards; }
  .board[data-phase="ready"] .cell { opacity: .78; }
  .board[data-phase="ready"] .cell.is-revealed { opacity: .88; }
  .board[data-phase="ready"] .starter { opacity: .72; }
  .board[data-phase="ready"] .mode-bounded { animation-delay: 35ms; }
  .board[data-phase="ready"] .mode-sphere { animation-delay: 70ms; }
  .board.is-leaving .mode:not(.is-dug),
  .board.is-leaving .resume:not(.is-dug),
  .board.is-leaving .theme-control,
  .board.is-leaving .cell,
  .board.is-leaving .starter { opacity: .52; }
  .board.is-leaving .mode,
  .board.is-leaving .resume,
  .board.is-leaving .theme-control { pointer-events: none; }

  .masthead {
    position: fixed;
    z-index: 10;
    left: 50%;
    top: max(18px, calc(env(safe-area-inset-top) + 12px));
    transform: translateX(-50%);
    display: grid;
    justify-items: center;
    gap: 2px;
    max-width: calc(100vw - 32px);
    pointer-events: none;
    text-align: center;
    width: min(30rem, calc(100vw - 32px));
  }
  .brand {
    margin: 0;
    color: var(--ink);
    font-size: clamp(1.05rem, 5vw, 1.35rem);
    font-weight: 700;
    letter-spacing: .055em;
    line-height: 1;
    text-transform: uppercase;
    text-shadow: 0 2px 10px var(--brand-shadow);
    text-shadow: 0 2px 10px color-mix(in srgb, var(--field) 72%, transparent);
  }
  .hint {
    margin: 0;
    padding: 4px 0 0;
    color: var(--muted);
    font-size: clamp(.75rem, 3.3vw, .88rem);
    font-weight: 600;
    letter-spacing: .02em;
    text-shadow: 0 1px 8px var(--hint-shadow);
    text-shadow: 0 1px 8px color-mix(in srgb, var(--field) 84%, transparent);
    text-wrap: balance;
    transition: color 180ms ease;
  }

  @media (max-height: 480px) and (orientation: landscape) {
    :root {
      --hex-w: clamp(56px, 16vh, 68px);
      --choice-scale: 1.05;
      --board-y: 28px;
    }
    .masthead {
      left: max(18px, calc(env(safe-area-inset-left) + 12px));

<script>
(function () {
  "use strict";

  var board = document.getElementById("game-menu");
  var field = document.getElementById("menu-field");
  var masthead = board.querySelector(".masthead");
  var starter = document.getElementById("opening-dig");
  var resume = document.getElementById("resume-game");
  var resumeModeName = document.getElementById("resume-mode-name");
  var infiniteGame = document.getElementById("infinite-game");
  var classicGame = document.getElementById("classic-game");
  var status = document.getElementById("menu-status");
  var modes = Array.prototype.slice.call(board.querySelectorAll(".mode"));
  var branchHubs = Array.prototype.slice.call(board.querySelectorAll(".theme-hub[data-branch]"));
  var branchChoices = Array.prototype.slice.call(board.querySelectorAll(".theme-choice[data-branch]"));
  var settingChoices = branchChoices.filter(function (choice) { return !!choice.dataset.setting; });
  var destinations = Array.prototype.slice.call(board.querySelectorAll(".destination"));
  var branches = {};
  branchHubs.forEach(function (hub) {
    branches[hub.dataset.branch] = {
      hub: hub,
      choices: branchChoices.filter(function (choice) {
        return choice.dataset.branch === hub.dataset.branch;
      })
    };
  });
  var directions = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
  layoutBranchChoices();
  var positionedControls = [starter, resume].concat(modes, branchHubs, branchChoices);
  var reservedSeats = {};
  positionedControls.forEach(function (control) {
    reservedSeats[key(Number(control.dataset.q), Number(control.dataset.r))] = true;
  });
  var cells = new Map();
  var mines = new Set();
  var revealed = new Set();
  var timers = [];
  var resizeTimer = null;
  var phase = "covered";
  var leaving = false;
  var activeBranch = null;
  var activeResume = null;
  var keyboardOpening = false;
  var pointerOpening = false;
  var SESSION_KEY = "hexsweeper-launcher-opening-v1";
  var APPEARANCE_KEY = "hexsweeper-appearance-v1";
  var EFFECTS_KEY = "hexsweeper-effects-v1";
  var INVERT_KEY = "hexsweeper-sphere-invert-v1";
  var INFINITE_THEME_KEY = "hexsweeper-mode-v3";
  var CLASSIC_SIZE_KEY = "hexsweeper-classic-size-v1";
  var SPHERE_THEME_KEY = "hexsweeper-sphere-theme-v6";
  var appearancePreference = "system";
  var effectsPreference = "auto";
  var invertPreference = { x: false, y: false };
  var infiniteThemePreference = "light";
  var classicSizePreference = "medium";
  var sphereThemePreference = "light";
  var colorScheme = matchMedia("(prefers-color-scheme: dark)");
  var INVERT_OPTIONS = [
    { x: false, y: false, label: "Natural" },
    { x: true, y: false, label: "Invert X" },
    { x: false, y: true, label: "Invert Y" },
    { x: true, y: true, label: "Invert both" }
  ];
  var SPHERE_THEME_NAMES = {
    light: "Light",
    shell: "Shell",
    dark: "Dark",
    ink: "Ink",
    float: "Float",
    card: "Card",
    glow: "Glow"
  };
  var CLASSIC_SIZE_NAMES = { easy: "Small", medium: "Medium", hard: "Large" };

  function key(q, r) { return q + "," + r; }
  function distance(q, r) { return Math.max(Math.abs(q), Math.abs(r), Math.abs(q + r)); }

  function axialPoint(q, r) {
    return { x: q + r / 2, y: .8660254 * r };
  }

  function layoutBranchChoices() {
    var fixedSeats = {};
    [starter, resume].concat(modes, branchHubs).forEach(function (control) {
      fixedSeats[key(Number(control.dataset.q), Number(control.dataset.r))] = true;
    });
    Object.keys(branches).forEach(function (branchName) {
      var branch = branches[branchName];
      var hubQ = Number(branch.hub.dataset.q);
      var hubR = Number(branch.hub.dataset.r);
      var outward = axialPoint(Number(branch.hub.dataset.outQ), Number(branch.hub.dataset.outR));
      var candidates = [];
      for (var radius = 1; radius <= 6; radius += 1) {
        for (var relR = -radius; relR <= radius; relR += 1) {
          for (var relQ = -radius; relQ <= radius; relQ += 1) {
            if (distance(relQ, relR) !== radius) continue;
            var q = hubQ + relQ;
            var r = hubR + relR;
            if (fixedSeats[key(q, r)]) continue;
            var point = axialPoint(relQ, relR);
            candidates.push({
              q: q,
              r: r,
              radius: radius,
              forward: point.x * outward.x + point.y * outward.y,
              cross: Math.abs(point.x * outward.y - point.y * outward.x)
            });
          }
        }
      }
      candidates.sort(function (a, b) {
        return a.radius - b.radius || b.forward - a.forward || a.cross - b.cross || a.r - b.r || a.q - b.q;
      });
      branch.choices.forEach(function (choice, index) {
        var seat = candidates[index];
        if (!seat) return;
        choice.dataset.q = String(seat.q);
        choice.dataset.r = String(seat.r);
        choice.dataset.layoutIndex = String(index);
      });
    });
  }

  function layoutControls() {
    if (activeBranch && branches[activeBranch]) {
      var branch = branches[activeBranch];
      var owner = modes.find(function (mode) {
        return mode.dataset.mode === branch.hub.dataset.ownerMode;
      });
      return [owner, branch.hub].concat(branch.choices).filter(Boolean);
    }
    if (phase === "covered" || phase === "clearing") return [starter];
    return [starter]
      .concat(resume.hidden ? [] : [resume])
      .concat(modes, branchHubs);
  }

  function fitLayout() {
    var viewportWidth = Math.max(280, document.documentElement.clientWidth || innerWidth);
    var viewportHeight = Math.max(320, document.documentElement.clientHeight || innerHeight);
    var controls = layoutControls();
    var minX = Infinity;
    var maxX = -Infinity;
    var minY = Infinity;
    var maxY = -Infinity;
    controls.forEach(function (control) {
      var point = axialPoint(Number(control.dataset.q), Number(control.dataset.r));
      minX = Math.min(minX, point.x - .6);
      maxX = Math.max(maxX, point.x + .6);
      minY = Math.min(minY, point.y - .68);
      maxY = Math.max(maxY, point.y + .68);
    });
    if (!Number.isFinite(minX)) return;
    var top = Math.max(76, masthead.getBoundingClientRect().bottom + 16);
    var bottom = viewportHeight - 20;
    var availableWidth = Math.max(240, viewportWidth - 28);
    var availableHeight = Math.max(200, bottom - top);
    var maxHexWidth = Math.min(86, viewportWidth * .19);
    var width = Math.min(
      maxHexWidth,
      availableWidth / Math.max(1, maxX - minX),
      availableHeight / Math.max(1, maxY - minY)
    );
    width = Math.max(44, width);
    var unitsCenterX = (minX + maxX) / 2;
    var unitsCenterY = (minY + maxY) / 2;
    var targetCenterY = top + availableHeight / 2;
    board.style.setProperty("--hex-w", width.toFixed(2) + "px");
    board.style.setProperty("--board-x", (-unitsCenterX * width).toFixed(2) + "px");
    board.style.setProperty("--board-y", (targetCenterY - viewportHeight / 2 - unitsCenterY * width).toFixed(2) + "px");
    buildField();
  }

  function effectsReduced() {
    if (effectsPreference === "reduced") return true;
    if (effectsPreference === "full") return false;
    return matchMedia("(prefers-reduced-motion: reduce)").matches;
  }

  function reducedMotion() { return effectsReduced(); }

  function applyEffectsAttribute() {
    document.documentElement.dataset.effects = effectsReduced() ? "reduced" : "full";
  }

  function hash(q, r) {
    var n = Math.imul(q + 37, 374761393) ^ Math.imul(r - 19, 668265263) ^ 0x5f3759df;
    n = Math.imul(n ^ (n >>> 13), 1274126177);
    return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
  }

  function storageValue(store, storageKey) {
    try { return store.getItem(storageKey); } catch (_) { return null; }
  }

  function parseSave(raw) {
    if (!raw) return null;
    try { return JSON.parse(raw); } catch (_) { return null; }
  }

  function writePreference(storageKey, value) {
    try { localStorage.setItem(storageKey, value); } catch (_) {}
  }

  function loadPreferences() {
    var storedAppearance = storageValue(localStorage, APPEARANCE_KEY);
    if (["system", "light", "dark"].indexOf(storedAppearance) >= 0) {
      appearancePreference = storedAppearance;
    }
    var storedEffects = storageValue(localStorage, EFFECTS_KEY);
    if (["auto", "full", "reduced"].indexOf(storedEffects) >= 0) {
      effectsPreference = storedEffects;
    }
    var storedSize = storageValue(localStorage, CLASSIC_SIZE_KEY);
    if (["easy", "medium", "hard"].indexOf(storedSize) >= 0) {
      classicSizePreference = storedSize;
    }
    var storedInfiniteTheme = storageValue(localStorage, INFINITE_THEME_KEY);
    if (["light", "dark"].indexOf(storedInfiniteTheme) >= 0) {
      infiniteThemePreference = storedInfiniteTheme;
    }
    var storedTheme = storageValue(localStorage, SPHERE_THEME_KEY);
    if (SPHERE_THEME_NAMES[storedTheme]) sphereThemePreference = storedTheme;
    try {
      var storedInvert = JSON.parse(storageValue(localStorage, INVERT_KEY) || "null");
      if (storedInvert && typeof storedInvert === "object") {
        invertPreference = { x: !!storedInvert.x, y: !!storedInvert.y };
      }
    } catch (_) {}
  }

  function infiniteResumeCandidate() {
    var data = parseSave(storageValue(localStorage, "hexsweeper-endless-plate-v1"));
    if (!data || data.v !== 1 || data.endless !== true) return null;
    if (data.first !== false || data.over !== false || Number(data.cleared) <= 0) return null;
    return {
      mode: "infinite",
      name: "Infinite",
      href: "{{INFINITE_HREF}}",
      savedAt: Number(data.savedAt) || 0
    };
  }

  function sphereResumeCandidate() {
    var stores = [sessionStorage, localStorage];
    var keys = ["hexsweeper-sphere-run-v2", "hexsweeper-sphere-run-v1"];
    var best = null;
    stores.forEach(function (store) {
      keys.forEach(function (storageKey) {
        var data = parseSave(storageValue(store, storageKey));
        if (!data || (data.v !== 1 && data.v !== 2) || data.kind !== "sphere") return;
        if (data.over !== false || typeof data.first !== "boolean") return;
        var flagged = Array.isArray(data.flagged) ? data.flagged.length : Number(data.flags) || 0;
        if (data.first && flagged <= 0) return;
        if (!data.first && (!Array.isArray(data.mines) || data.mines.length === 0)) return;
        var candidate = {
          mode: "sphere",
          name: "Sphere",
          href: "{{SPHERE_HREF}}",
          savedAt: Number(data.savedAt) || 0
        };
        if (!best || candidate.savedAt >= best.savedAt) best = candidate;
      });
    });
    return best;
  }

  // Adapters keep launcher routing honest. Classic joins this list only when
  // its finite board gains a real persistence contract.
  function newestResumeCandidate() {
    return [infiniteResumeCandidate(), sphereResumeCandidate()]
      .filter(Boolean)
      .sort(function (a, b) { return b.savedAt - a.savedAt; })[0] || null;
  }

  function buildMines() {
    mines.clear();
    for (var r = -14; r <= 14; r += 1) {
      for (var q = -14; q <= 14; q += 1) {
        if (distance(q, r) >= 3 && hash(q, r) < .205) mines.add(key(q, r));
      }
    }
    Object.keys(reservedSeats).forEach(function (seat) { mines.delete(seat); });
    // Every ring-two boundary face gets at least one real outward mine, so
    // the zero flood always stops in a readable numbered frontier.
    for (var rr = -2; rr <= 2; rr += 1) {
      for (var qq = -2; qq <= 2; qq += 1) {
        if (distance(qq, rr) !== 2) continue;
        var outward = [];
        directions.forEach(function (dir) {
          var nq = qq + dir[0];
          var nr = rr + dir[1];
          if (distance(nq, nr) === 3 && !reservedSeats[key(nq, nr)]) outward.push([nq, nr]);
        });
        if (!outward.some(function (p) { return mines.has(key(p[0], p[1])); })) {
          outward.sort(function (a, b) { return hash(a[0], a[1]) - hash(b[0], b[1]); });
          if (outward[0]) mines.add(key(outward[0][0], outward[0][1]));
        }
      }
    }
  }

  function countAt(q, r) {
    var count = 0;
    directions.forEach(function (dir) {
      if (mines.has(key(q + dir[0], r + dir[1]))) count += 1;
    });
    return count;
  }

  function place(element, q, r, width, height) {
    var x = width * (q + r / 2);
    var y = height * .75 * r;
    element.style.setProperty("--x", x.toFixed(2) + "px");
    element.style.setProperty("--y", y.toFixed(2) + "px");
  }

  function buildField() {
    field.textContent = "";
    cells.clear();
    var probe = starter.getBoundingClientRect();
    var width = probe.width;
    var height = probe.height;
    var viewportWidth = document.documentElement.clientWidth || innerWidth;
    var viewportHeight = document.documentElement.clientHeight || innerHeight;
    var boardStyles = getComputedStyle(board);
    var boardShiftX = Math.abs(parseFloat(boardStyles.getPropertyValue("--board-x")) || 0);
    var boardShiftY = Math.abs(parseFloat(boardStyles.getPropertyValue("--board-y")) || 0);
    var qLimit = Math.ceil((viewportWidth + boardShiftX * 2) / width) + 4;
    var rLimit = Math.ceil((viewportHeight + boardShiftY * 2) / (height * .75) / 2) + 4;
    var fragment = document.createDocumentFragment();

    for (var r = -Math.ceil(rLimit); r <= Math.ceil(rLimit); r += 1) {
      for (var q = -qLimit; q <= qLimit; q += 1) {
        var id = key(q, r);
        if (reservedSeats[id]) continue;
        var x = width * (q + r / 2);
        var y = height * .75 * r;
        if (Math.abs(x) > viewportWidth / 2 + boardShiftX + width || Math.abs(y) > viewportHeight / 2 + boardShiftY + height) continue;
        var cell = document.createElement("span");
        var count = countAt(q, r);
        cell.className = "hex cell" + (count ? " count-" + Math.min(4, count) : "");
        cell.dataset.key = id;
        cell.dataset.count = String(count);
        place(cell, q, r, width, height);
        var mark = document.createElement("span");
        mark.className = "count";
        mark.textContent = count ? String(count) : "";
        cell.appendChild(mark);
        if (revealed.has(id)) cell.classList.add("is-revealed");
        cells.set(id, cell);
        fragment.appendChild(cell);
      }
    }
    field.appendChild(fragment);
    positionedControls.forEach(function (control) {
      place(control, Number(control.dataset.q), Number(control.dataset.r), width, height);
    });
  }

  function floodPlan() {
    var queue = [{ q: 0, r: 0, step: 0 }];
    var seen = new Set(["0,0"]);
    var plan = [];
    while (queue.length) {
      var item = queue.shift();
      var id = key(item.q, item.r);
      if (!reservedSeats[id]) {
        plan.push({ key: id, step: item.step, jitter: Math.round(hash(item.q, item.r) * 34) });
      }
      if (countAt(item.q, item.r) !== 0 || distance(item.q, item.r) >= 2) continue;
      directions.forEach(function (dir) {
        var q = item.q + dir[0];
        var r = item.r + dir[1];
        var nextKey = key(q, r);
        // Reserved controls are guaranteed safe. Traverse through them so the
        // complete seven-face launcher flower cannot wall off the opening flood.
        if (seen.has(nextKey) || mines.has(nextKey)) return;
        seen.add(nextKey);
        queue.push({ q: q, r: r, step: item.step + 1 });
      });
    }
    return plan;
  }

  function revealCell(id) {
    revealed.add(id);
    var cell = cells.get(id);
    if (cell) cell.classList.add("is-revealed");
  }

  function clearTimers() {
    timers.forEach(clearTimeout);
    timers.length = 0;
  }

  function rememberReady() {
    try { sessionStorage.setItem(SESSION_KEY, "1"); } catch (_) {}
  }

  function updateReadyStatus() {
    if (phase !== "ready" || leaving) return;
    if (activeBranch === "infinite") {
      status.textContent = "Choose Infinite settings";
    } else if (activeBranch === "size") {
      status.textContent = "Choose a Classic board size";
    } else if (activeBranch === "style") {
      status.textContent = "Choose a Sphere style";
    } else if (activeResume) {
      status.textContent = "Resume " + activeResume.name + ", or choose a board";
    } else {
      status.textContent = "Choose a board";
    }
  }

  function refreshResume() {
    activeResume = newestResumeCandidate();
    resume.classList.remove("is-available", "is-dug");
    if (!activeResume) {
      resume.hidden = true;
      resume.removeAttribute("data-mode");
      updateReadyStatus();
      return;
    }
    resume.hidden = false;
    resume.href = activeResume.href;
    resume.dataset.mode = activeResume.mode;
    resumeModeName.textContent = activeResume.name;
    resume.setAttribute("aria-label", "Resume " + activeResume.name + " Hexsweeper");
    if (phase === "ready") resume.classList.add("is-available");
    updateReadyStatus();
  }

  function invertLabel() {
    var current = INVERT_OPTIONS.find(function (option) {
      return option.x === invertPreference.x && option.y === invertPreference.y;
    });
    return current ? current.label : "Natural";
  }

  function titleCase(value) {
    return value.charAt(0).toUpperCase() + value.slice(1);
  }

  function setCurrent(choice, current) {
    if (current) choice.setAttribute("aria-current", "true");
    else choice.removeAttribute("aria-current");
  }

  function syncPreferences() {
    var effectsName = titleCase(effectsPreference);
    var inversionName = invertLabel();
    document.getElementById("effects-current").textContent = effectsName;
    document.getElementById("invert-current").textContent = inversionName;
    document.getElementById("infinite-current").textContent = titleCase(infiniteThemePreference);
    document.getElementById("size-current").textContent = CLASSIC_SIZE_NAMES[classicSizePreference];
    document.getElementById("style-current").textContent = SPHERE_THEME_NAMES[sphereThemePreference];
    document.getElementById("infinite-effects").setAttribute("aria-label", "Effects: " + effectsName + ". Activate to cycle.");
    document.getElementById("style-invert").setAttribute("aria-label", "Sphere drag: " + inversionName + ". Activate to cycle.");
    infiniteGame.href = infiniteGame.dataset.baseHref + "?mode=" + infiniteThemePreference;
    classicGame.href = classicGame.dataset.baseHref + "?size=" + classicSizePreference;
    board.querySelectorAll("[data-infinite-theme]").forEach(function (choice) {
      setCurrent(choice, choice.dataset.infiniteTheme === infiniteThemePreference);
    });
    board.querySelectorAll("[data-classic-size]").forEach(function (choice) {
      setCurrent(choice, choice.dataset.classicSize === classicSizePreference);
    });
    board.querySelectorAll("[data-sphere-theme]").forEach(function (choice) {
      setCurrent(choice, choice.dataset.sphereTheme === sphereThemePreference);
    });
  }

  function applyAppearance() {
    document.documentElement.dataset.appearance = appearancePreference === "system"
      ? (colorScheme.matches ? "dark" : "light")
      : appearancePreference;
    document.documentElement.dataset.appearanceChoice = appearancePreference;
    syncPreferences();
  }

  function selectedBranchChoice(branchName) {
    var branch = branches[branchName];
    if (!branch) return null;
    return branch.choices.find(function (choice) {
      return choice.getAttribute("aria-current") === "true";
    }) || branch.choices[0] || null;
  }

  function openBranch(branchName, event) {
    if (phase !== "ready") finishOpening(true);
    if (leaving || activeBranch === branchName || !branches[branchName]) return;
    if (activeBranch) closeBranch();
    var branch = branches[branchName];
    activeBranch = branchName;
    board.dataset.openBranch = branchName;
    branch.hub.classList.add("is-expanded");
    branch.hub.setAttribute("aria-expanded", "true");
    branch.choices.forEach(function (choice) {
      if (choice.tagName === "BUTTON") choice.disabled = false;
      choice.tabIndex = 0;
      choice.setAttribute("aria-hidden", "false");
      choice.classList.add("is-available");
    });
    updateReadyStatus();
    fitLayout();
    if (event && event.detail === 0) {
      var target = selectedBranchChoice(branchName);
      if (target) target.focus({ preventScroll: true });
    }
  }

  function closeBranch(options) {
    if (!activeBranch) return;
    var opts = options || {};
    var branch = branches[activeBranch];
    activeBranch = null;
    delete board.dataset.openBranch;
    branch.hub.classList.remove("is-expanded");
    branch.hub.setAttribute("aria-expanded", "false");
    branch.choices.forEach(function (choice) {
      choice.classList.remove("is-available");
      if (choice.tagName === "BUTTON") choice.disabled = true;
      choice.tabIndex = -1;
      choice.setAttribute("aria-hidden", "true");
    });
    updateReadyStatus();
    fitLayout();
    if (opts.focus) branch.hub.focus({ preventScroll: true });
  }

  function toggleBranch(event) {
    event.preventDefault();
    event.stopPropagation();
    var branchName = event.currentTarget.dataset.branch;
    if (activeBranch === branchName) closeBranch({ focus: event.detail === 0 });
    else openBranch(branchName, event);
  }

  function cycleSetting(event) {
    event.preventDefault();
    event.stopPropagation();
    var setting = event.currentTarget.dataset.setting;
    if (setting === "appearance") {
      var appearances = ["system", "light", "dark"];
      appearancePreference = appearances[(appearances.indexOf(appearancePreference) + 1) % appearances.length];
      writePreference(APPEARANCE_KEY, appearancePreference);
      applyAppearance();
      status.textContent = "Appearance: " + titleCase(appearancePreference);
    } else if (setting === "effects") {
      var effects = ["auto", "full", "reduced"];
      effectsPreference = effects[(effects.indexOf(effectsPreference) + 1) % effects.length];
      writePreference(EFFECTS_KEY, effectsPreference);
      applyEffectsAttribute();
      syncPreferences();
      status.textContent = "Effects: " + titleCase(effectsPreference);
    } else if (setting === "invert") {
      var currentIndex = INVERT_OPTIONS.findIndex(function (option) {
        return option.x === invertPreference.x && option.y === invertPreference.y;
      });
      var next = INVERT_OPTIONS[(Math.max(0, currentIndex) + 1) % INVERT_OPTIONS.length];
      invertPreference = { x: next.x, y: next.y };
      writePreference(INVERT_KEY, JSON.stringify(invertPreference));
      syncPreferences();
      status.textContent = "Sphere drag: " + next.label;
    }
  }

  function finishOpening(instant) {
    if (phase === "ready") {
      refreshResume();
      return;
    }
    var focusFirstMode = keyboardOpening || (!pointerOpening && document.activeElement === starter);
    clearTimers();
    floodPlan().forEach(function (item) { revealCell(item.key); });
    phase = "ready";
    board.dataset.phase = "ready";
    board.removeAttribute("aria-busy");
    starter.classList.remove("is-hit");
    starter.classList.add("is-cleared");
    starter.disabled = true;
    starter.tabIndex = -1;
    starter.setAttribute("aria-hidden", "true");
    modes.forEach(function (mode) { mode.classList.add("is-available"); });
    branchHubs.forEach(function (hub) {
      hub.disabled = false;
      hub.classList.add("is-available");
    });
    refreshResume();
    updateReadyStatus();
    fitLayout();
    rememberReady();
    keyboardOpening = false;
    pointerOpening = false;
    if (focusFirstMode) {
      (activeResume ? resume : modes[0]).focus({ preventScroll: true });
    }
  }

  function startOpening(event) {
    if (phase !== "covered") return;
    clearTimers();
    if (event) {
      event.preventDefault();
      event.stopPropagation();
      keyboardOpening = event.detail === 0;
      pointerOpening = event.detail > 0;
    }
    phase = "clearing";
    board.dataset.phase = "clearing";
    board.setAttribute("aria-busy", "true");
    starter.classList.add("is-hit");
    status.textContent = "Revealing the game menu…";
    if (reducedMotion()) {
      finishOpening(true);
      return;
    }
    var plan = floodPlan();
    var latest = 0;
    plan.forEach(function (item) {
      var delay = 55 + item.step * 82 + Math.round(item.jitter * .72);
      latest = Math.max(latest, delay);
      timers.push(setTimeout(function () {
        if (phase === "clearing") revealCell(item.key);
      }, delay));
    });
    timers.push(setTimeout(function () {
      if (phase !== "clearing") return;
      starter.classList.add("is-cleared");
    }, 70));
    timers.push(setTimeout(function () { finishOpening(false); }, latest + 110));
  }

  function chooseDestination(event) {
    var destination = event.currentTarget;
    if (phase !== "ready") {
      event.preventDefault();
      finishOpening(true);
      return;
    }
    if (leaving || event.defaultPrevented) {
      event.preventDefault();
      return;
    }
    if (event.button !== undefined && event.button !== 0) return;
    if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
    event.preventDefault();
    if (destination.dataset.classicSize) {
      classicSizePreference = destination.dataset.classicSize;
      writePreference(CLASSIC_SIZE_KEY, classicSizePreference);
    }
    if (destination.dataset.infiniteTheme) {
      infiniteThemePreference = destination.dataset.infiniteTheme;
      writePreference(INFINITE_THEME_KEY, infiniteThemePreference);
    }
    if (destination.dataset.sphereTheme) {
      sphereThemePreference = destination.dataset.sphereTheme;
      writePreference(SPHERE_THEME_KEY, sphereThemePreference);
    }
    syncPreferences();
    closeBranch();
    leaving = true;
    destination.classList.add("is-dug");
    board.setAttribute("aria-busy", "true");
    board.classList.add("is-leaving");
    var label = destination.querySelector(".mode-name, .theme-name");
    var modeName = destination === resume
      ? resumeModeName.textContent
      : (destination.dataset.destinationName || (label ? label.textContent : "Hexsweeper"));
    status.textContent = (destination === resume ? "Resuming " : "Opening ") + modeName;
    var delay = reducedMotion() ? 30 : 230;
    setTimeout(function () { location.href = destination.href; }, delay);
  }

  starter.addEventListener("click", startOpening);
  board.addEventListener("click", function (event) {
    if (activeBranch && !event.target.closest(".theme-control")) {
      closeBranch();
    }
    if (phase === "covered" && !event.target.closest(".destination") && !event.target.closest(".theme-control") && !event.target.closest(".starter")) {
      startOpening(event);
      return;
    }
    if (phase === "clearing" && !event.target.closest(".destination") && !event.target.closest(".theme-control") && !event.target.closest(".starter")) {
      event.preventDefault();
      finishOpening(true);
    }
  });
  modes.concat(branchHubs).forEach(function (control) {
    control.addEventListener("focus", function () {
      if (phase !== "ready") finishOpening(true);
    });
  });
  destinations.forEach(function (destination) {
    destination.addEventListener("click", chooseDestination);
  });
  branchHubs.forEach(function (hub) {
    hub.addEventListener("click", toggleBranch);
  });
  settingChoices.forEach(function (choice) {
    choice.addEventListener("click", cycleSetting);
  });

  addEventListener("keydown", function (event) {
    if (event.key === "Escape" && activeBranch) {
      event.preventDefault();
      closeBranch({ focus: true });
      return;
    }
    if (!activeBranch || ["ArrowLeft", "ArrowUp", "ArrowRight", "ArrowDown"].indexOf(event.key) < 0) return;
    var choices = branches[activeBranch].choices;
    var currentIndex = choices.indexOf(document.activeElement);
    if (currentIndex < 0) return;
    event.preventDefault();
    var delta = (event.key === "ArrowRight" || event.key === "ArrowDown") ? 1 : -1;
    choices[(currentIndex + delta + choices.length) % choices.length].focus({ preventScroll: true });
  });

  addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      if (phase === "clearing") finishOpening(true);
      fitLayout();
    }, 80);
  });
  addEventListener("pageshow", function (event) {
    if (!event.persisted) return;
    leaving = false;
    board.classList.remove("is-leaving");
    board.removeAttribute("aria-busy");
    board.querySelectorAll(".destination").forEach(function (destination) {
      destination.classList.remove("is-dug");
    });
    closeBranch();
    loadPreferences();
    applyAppearance();
    applyEffectsAttribute();
    syncPreferences();
    refreshResume();
    finishOpening(true);
  });

  loadPreferences();
  applyAppearance();
  applyEffectsAttribute();
  syncPreferences();
  if (colorScheme.addEventListener) colorScheme.addEventListener("change", applyAppearance);
  else if (colorScheme.addListener) colorScheme.addListener(applyAppearance);

  buildMines();
  fitLayout();
  var alreadyOpened = false;
  try { alreadyOpened = sessionStorage.getItem(SESSION_KEY) === "1"; } catch (_) {}
  if (alreadyOpened) finishOpening(true);
  else if (reducedMotion()) startOpening();
  else timers.push(setTimeout(function () { startOpening(); }, 220));
})();
</script>
