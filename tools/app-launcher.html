<!DOCTYPE html>
<!--
  File Purpose: Shared web/native launcher built on the real Hexsweeper engine.
  Primary Functions/Classes: endless playable board, protected preset cells,
    drag/pinch exploration, mode-triggered option reveals, and saved-run routing.
  Inputs: pointer/keyboard play, viewport, saved runs/preferences. Outputs: game links.
  A11y: native preset controls, focusable board cursor, visible focus, live status,
    non-drag camera controls, reduced motion, forced colors, and reversible reset.
  Author: Luke Steuber <luke@lukesteuber.com>
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hexsweeper</title>
<meta name="description" content="Play a live Hexsweeper field and dig out Infinite, Classic, or Sphere options.">
{{FONTS}}
<style>
  :root {
    --font-ui: "IBM Plex Sans", system-ui, sans-serif;
    --font-count: "IBM Plex Mono", ui-monospace, monospace;
    --field: #e8eef5;
    --field-glow: #f8fafc;
    --tile: #f7f9fc;
    --tile-edge: #aebdce;
    --well: #8f9db0;
    --ink: #263240;
    --muted: #68798c;
    --focus: #246da0;
    --infinite-accent: #246da0;
    --classic-accent: #16794f;
    --sphere-accent: #724ab5;
    --flag: #e33030;
    --glass: rgba(248, 250, 252, .82);
    --glass-edge: rgba(115, 131, 151, .42);
    --shadow: rgba(77, 94, 114, .24);
    --cell-size: 34px;
    color-scheme: light dark;
  }
  :root[data-appearance="dark"] {
    --field: #0c1118;
    --field-glow: #18212d;
    --tile: #171f29;
    --tile-edge: #536174;
    --well: #d7e0eb;
    --ink: #edf3fb;
    --muted: #a8b6c7;
    --focus: #78c5f4;
    --infinite-accent: #78c5f4;
    --classic-accent: #20a873;
    --sphere-accent: #aa83e8;
    --glass: rgba(17, 24, 33, .82);
    --glass-edge: rgba(168, 182, 199, .32);
    --shadow: rgba(0, 0, 0, .42);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body, main, .launcher { width: 100%; height: 100%; }
  body {
    margin: 0;
    min-width: 280px;
    overflow: hidden;
    overscroll-behavior: none;
    font-family: var(--font-ui);
    color: var(--ink);
    background: var(--field);
    -webkit-text-size-adjust: 100%;
  }
  .launcher {
    position: fixed;
    inset: 0;
    isolation: isolate;
    overflow: hidden;
    background:
      radial-gradient(72% 58% at 50% 47%, color-mix(in srgb, var(--field-glow) 34%, transparent), transparent 78%),
      var(--field);
  }
  #launcher-canvas {
    position: absolute;
    z-index: 0;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    outline: none;
  }
  #launcher-canvas:focus-visible + .board-cursor { opacity: 1; }
  /* Board stays fully playable; this scrim only drops its contrast under the
     bloom so the menu never competes with revealed/covered mottling. Sits
     above the canvas (z 0) and below the preset layer (z 4); never hit-tests. */
  /* Masthead band: keeps the title and status line legible wherever the board
     happens to be light or dark under them. Same layer as the bloom scrim. */
  .launcher::before {
    content: "";
    position: absolute;
    z-index: 1;
    inset: 0 0 auto;
    height: max(148px, calc(env(safe-area-inset-top) + 132px));
    pointer-events: none;
    background: linear-gradient(
      to bottom,
      var(--field) 0%,
      color-mix(in srgb, var(--field) 72%, transparent) 46%,
      transparent 100%);
  }
  .launcher::after {
    content: "";
    position: absolute;
    z-index: 1;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(
      62% 44% at 50% 50%,
      var(--field) 0%,
      color-mix(in srgb, var(--field) 88%, transparent) 34%,
      color-mix(in srgb, var(--field) 52%, transparent) 58%,
      transparent 76%);
  }

  .masthead {
    position: fixed;
    z-index: 10;
    left: 50%;
    top: max(15px, calc(env(safe-area-inset-top) + 9px));
    width: min(32rem, calc(100vw - 104px));
    transform: translateX(-50%);
    display: grid;
    justify-items: center;
    gap: 3px;
    pointer-events: none;
    text-align: center;
  }
  .brand {
    margin: 0;
    font-size: clamp(1.05rem, 4.7vw, 1.38rem);
    font-weight: 700;
    letter-spacing: .065em;
    line-height: 1;
    text-transform: uppercase;
    text-shadow: 0 2px 12px var(--field), 0 2px 18px var(--field);
  }
  .hint {
    margin: 0;
    max-width: 100%;
    min-width: 0;
    color: var(--muted);
    font-size: clamp(.72rem, 3vw, .86rem);
    font-weight: 600;
    line-height: 1.25;
    letter-spacing: .015em;
    overflow-wrap: anywhere;
    text-wrap: balance;
    text-shadow: 0 1px 10px var(--field), 0 1px 14px var(--field);
  }

  .preset-layer {
    position: absolute;
    z-index: 4;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .preset,
  .board-cursor {
    position: absolute;
    left: var(--screen-x, 50%);
    top: var(--screen-y, 50%);
    width: calc(var(--cell-size) * 1.73205);
    height: calc(var(--cell-size) * 2);
    transform: translate(-50%, -50%) scale(var(--preset-scale, 1));
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
  }
  /* Flat high-contrast tiles. A hexagon is clip-path'd, so a real `border`
     can't follow the shape: the element background IS the edge and ::before,
     inset by --preset-edge, is the fill. Solid fill => field-coloured ink;
     hollow fill (unselected choices) => accent ink. No bevels, no glows. */
  .preset {
    --accent: var(--focus);
    --preset-edge: 2px;
    z-index: 2;
    display: grid;
    place-items: center;
    border: 0;
    padding: 0;
    color: var(--field);
    background: var(--accent);
    text-decoration: none;
    pointer-events: none;
    -webkit-user-select: none;
    user-select: none;
    outline: none;
    transition: opacity 140ms ease, transform 140ms ease;
  }
  .preset::before {
    content: "";
    position: absolute;
    inset: var(--preset-edge);
    z-index: 0;
    clip-path: inherit;
    background: var(--accent);
  }
  /* Hollow variant: the edge shows through as a crisp accent ring. Used for
     unselected choices so pressed vs unpressed is legible without a glow.
     Swatches opt out — they carry their own two-tone theme paint. */
  .preset.choice:not([aria-pressed="true"]):not(.is-swatch) { color: var(--accent); }
  .preset.choice:not([aria-pressed="true"]):not(.is-swatch)::before { background: var(--field); }

  /* Theme swatch: the tile itself is the preview. Edge = the theme's field,
     fill = its shell, label = an ink chosen to sit on that shell. Selection is
     shown by the edge thickening, so the paint is never overridden. */
  .preset.choice.is-swatch {
    color: var(--sw-ink);
    background: var(--sw-field);
  }
  .preset.choice.is-swatch::before { background: var(--sw-shell); }
  .preset.choice.is-swatch[aria-pressed="true"] { --preset-edge: 5px; }
  .preset.choice.is-swatch[aria-pressed="true"]::after {
    background: var(--sw-ink);
    color: var(--sw-shell);
  }
  .preset.choice.is-swatch:focus-visible::before { outline-color: var(--sw-ink); }
  /* No icon row, so the name gets the whole band and can run larger. */
  .preset.choice.is-swatch .preset-name {
    font-size: clamp(.58rem, calc(var(--cell-size) * .3), .82rem);
  }
  .preset:focus-visible {
    --preset-scale: 1.06;
    --preset-edge: 5px;
  }
  .preset:focus-visible::before {
    outline: 2px solid var(--field);
    outline-offset: -2px;
  }
  /* On a hollow tile the fill IS --field, so a --field ring would vanish. */
  .preset.choice:not([aria-pressed="true"]):focus-visible::before {
    outline-color: var(--accent);
  }
  /* A pointy-top hexagon is only full width between 25% and 75% of its height.
     Content is capped to that 50% band and never wraps, so a note can no longer
     spill into the tapering point (the "Dig / settings" break). */
  .preset-content {
    position: relative;
    z-index: 1;
    display: grid;
    justify-items: center;
    align-content: center;
    gap: calc(var(--cell-size) * .015);
    width: 96%;
    max-height: 50%;
    overflow: hidden;
    text-align: center;
  }
  .preset-icon {
    width: calc(var(--cell-size) * .34);
    height: calc(var(--cell-size) * .34);
    max-width: 18px;
    max-height: 18px;
    overflow: visible;
    color: currentColor;
  }
  .preset-name,
  .preset-note {
    max-width: 100%;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .preset-name {
    font-size: clamp(.62rem, calc(var(--cell-size) * .34), .95rem);
    font-weight: 700;
    line-height: 1;
    letter-spacing: -.02em;
  }
  .preset-note {
    color: currentColor;
    opacity: .78;
    font-size: clamp(.46rem, calc(var(--cell-size) * .23), .66rem);
    font-weight: 600;
    line-height: 1;
    letter-spacing: .01em;
  }
  .mode-infinite,
  .infinite-choice,
  .resume[data-mode="infinite"] { --accent: var(--infinite-accent); }
  .mode-classic,
  .classic-choice,
  .resume[data-mode="bounded"] { --accent: var(--classic-accent); }
  .mode-sphere,
  .sphere-choice,
  .resume[data-mode="sphere"] { --accent: var(--sphere-accent); }
  /* Mode tiles read as solid buttons from first paint. "Dug" and "open" are
     shown by a thickening field-coloured ring (--preset-edge), not by a bloom. */
  .mode { z-index: 3; }
  .mode.is-dug { --preset-edge: 3px; }
  .mode.is-dug .preset-content { transform: scale(.96); }
  .mode[aria-expanded="true"] { --preset-edge: 6px; }
  .resume[hidden] { display: none; }
  .resume { z-index: 5; }
  .settings-hub,
  .choice {
    z-index: 4;
    visibility: hidden;
    opacity: 0;
    transform: translate(-50%, -50%) scale(.74);
  }
  .settings-hub.is-available,
  .choice.is-available {
    visibility: visible;
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
    animation: option-rise 260ms cubic-bezier(.22, 1, .36, 1) var(--reveal-delay, 0ms) backwards;
  }
  .settings-hub[aria-expanded="true"] { --preset-edge: 6px; }
  /* Badge inverts against the now-solid accent fill. */
  .choice[aria-pressed="true"]::after {
    content: "✓";
    position: absolute;
    z-index: 3;
    top: 20%;
    right: 21%;
    display: grid;
    place-items: center;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: var(--field);
    color: var(--accent);
    font: 700 9px/1 var(--font-ui);
  }
  .size-icon {
    display: grid;
    place-items: center;
    font: 700 calc(var(--cell-size) * .62)/1 var(--font-count);
  }
  .is-launching { opacity: .42 !important; }

  .board-cursor {
    z-index: 7;
    opacity: 0;
    pointer-events: none;
    background: color-mix(in srgb, var(--focus) 18%, transparent);
    filter: drop-shadow(0 0 6px var(--focus));
    transition: opacity 120ms ease, left 110ms ease, top 110ms ease;
  }
  .board-cursor::after {
    content: "";
    position: absolute;
    inset: 4px;
    clip-path: inherit;
    outline: 3px solid var(--focus);
    outline-offset: -4px;
  }

  .board-tools {
    position: fixed;
    z-index: 12;
    right: max(10px, calc(env(safe-area-inset-right) + 8px));
    bottom: max(10px, calc(env(safe-area-inset-bottom) + 8px));
    display: flex;
    gap: 5px;
    padding: 5px;
    border: 1px solid var(--glass-edge);
    border-radius: 999px;
    background: var(--glass);
    box-shadow: 0 7px 22px var(--shadow);
    backdrop-filter: blur(12px) saturate(1.15);
  }
  .tool {
    min-width: 42px;
    min-height: 42px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 999px;
    padding: 0 10px;
    color: var(--ink);
    background: transparent;
    font: 700 .72rem/1 var(--font-ui);
    cursor: pointer;
  }
  .tool:hover { background: color-mix(in srgb, var(--focus) 10%, transparent); }
  .tool:focus-visible { outline: 3px solid var(--focus); outline-offset: -2px; }
  .tool[aria-pressed="true"] { color: var(--field); background: var(--flag); }
  .tool-symbol { font: 700 1.05rem/1 var(--font-count); }
  .sr-only {
    position: absolute !important;
    width: 1px !important;
    height: 1px !important;
    padding: 0 !important;
    margin: -1px !important;
    overflow: hidden !important;
    clip: rect(0, 0, 0, 0) !important;
    white-space: nowrap !important;
    border: 0 !important;
  }

  @media (max-width: 420px) {
    .masthead { width: calc(100vw - 82px); }
    .board-tools { gap: 2px; padding: 4px; }
    .tool { min-width: 39px; min-height: 39px; padding: 0 8px; }
  }
  @media (max-height: 480px) and (orientation: landscape) {
    .masthead {
      left: max(14px, calc(env(safe-area-inset-left) + 9px));
      top: max(10px, calc(env(safe-area-inset-top) + 7px));
      width: min(17rem, 42vw);
      transform: none;
      justify-items: start;
      text-align: left;
    }
    .brand { font-size: .98rem; }
    .hint { font-size: .68rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      scroll-behavior: auto !important;
      transition-duration: .01ms !important;
      animation-duration: .01ms !important;
      animation-delay: 0ms !important;
    }
  }
  @media (forced-colors: active) {
    .launcher { background: Canvas; }
    .preset { color: ButtonText; background: transparent; }
    .preset::before { background: Canvas; outline: 2px solid ButtonText; outline-offset: -4px; }
    .preset:focus-visible::before { outline: 4px solid Highlight; }
    .settings-hub.is-available::before, .choice.is-available::before, .mode[aria-expanded="true"]::before { outline-color: Highlight; }
    .preset-icon, .brand, .hint { color: CanvasText; text-shadow: none; }
    .board-tools { background: Canvas; border-color: ButtonText; backdrop-filter: none; }
    .tool { color: ButtonText; }
    .tool:focus-visible { outline-color: Highlight; }
  }
  @keyframes option-rise {
    from { opacity: .15; transform: translate(-50%, -45%) scale(.72); }
    70% { transform: translate(-50%, -52%) scale(1.05); }
    to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
</style>
{{PLATFORM_HEAD}}</head>
<body>
<main>
  <section class="launcher" id="launcher" aria-labelledby="launcher-title">
    <canvas id="launcher-canvas" tabindex="0" role="application" aria-roledescription="playable Hexsweeper board" aria-describedby="launcher-status" aria-label="Playable Hexsweeper menu. Drag to explore. Use arrow keys to move the keyboard cursor, Enter to dig, and F to flag."></canvas>
    <div class="board-cursor" id="board-cursor" aria-hidden="true"></div>

    <header class="masthead">
      <h1 class="brand" id="launcher-title">Hexsweeper</h1>
      <p class="hint" id="launcher-status" role="status" aria-live="polite">Dig a mode · drag to explore · hold to flag</p>
    </header>

    <nav class="preset-layer" id="preset-layer" aria-label="Game modes and revealed options">
      <a class="preset resume destination" id="resume-game" href="{{INFINITE_HREF}}" data-q="0" data-r="0" data-mode="infinite" aria-label="Resume Infinite Hexsweeper" hidden>
        <span class="preset-content">
          <svg class="preset-icon" viewBox="0 0 48 48" aria-hidden="true"><path d="M13 17H6v-7M7 17a18 18 0 1 1-1 15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="m21 16 14 8-14 8Z" fill="currentColor"/></svg>
          <span class="preset-name">Resume</span>
          <span class="preset-note" id="resume-mode-name">Infinite</span>
        </span>
      </a>

      <button class="preset mode mode-infinite" id="infinite-game" type="button" data-mode="infinite" data-branch="infinite" data-out-q="0" data-out-r="-1" data-q="0" data-r="-1" aria-expanded="false" aria-controls="infinite-settings" aria-label="Dig Infinite to reveal its settings">
        <span class="preset-content">
          <svg class="preset-icon" viewBox="0 0 48 48" aria-hidden="true"><path d="M6 24c0-5.4 3.7-9.5 9-9.5 8.3 0 10.6 19 18 19 5.3 0 9-4.1 9-9.5s-3.7-9.5-9-9.5c-7.4 0-9.7 19-18 19-5.3 0-9-4.1-9-9.5Z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="preset-name">Infinite</span>
          <span class="preset-note" id="infinite-mode-current">Settings</span>
        </span>
      </button>

      <button class="preset mode mode-classic" id="classic-game" type="button" data-mode="bounded" data-branch="classic" data-out-q="1" data-out-r="0" data-q="1" data-r="0" aria-expanded="false" aria-controls="classic-settings" aria-label="Dig Classic to reveal its settings">
        <span class="preset-content">
          <svg class="preset-icon" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 5 40 14v20l-16 9-16-9V14Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M17 35V14m1 2h14l-3.4 4.3L32 25H18m-4 11h9" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="preset-name">Classic</span>
          <span class="preset-note" id="classic-mode-current">Settings</span>
        </span>
      </button>

      <button class="preset mode mode-sphere" id="sphere-game" type="button" data-mode="sphere" data-branch="sphere" data-out-q="-1" data-out-r="1" data-q="-1" data-r="1" aria-expanded="false" aria-controls="sphere-settings" aria-label="Dig Sphere to reveal its settings">
        <span class="preset-content">
          <svg class="preset-icon" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="18" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M24 6c-7 5-9 12-9 18s2 13 9 18M24 6c7 5 9 12 9 18s-2 13-9 18M6 24h36M9 15c9 4 21 4 30 0M9 33c9-4 21-4 30 0" fill="none" stroke="currentColor" stroke-width="1" opacity=".78"/></svg>
          <span class="preset-name">Sphere</span>
          <span class="preset-note" id="sphere-mode-current">Settings</span>
        </span>
      </button>

      <button class="preset settings-hub infinite-choice" id="infinite-settings" type="button" data-branch="infinite" data-q="0" data-r="-2" aria-expanded="false" aria-controls="infinite-light infinite-dark infinite-effects" aria-label="Infinite settings, Light. Activate to open." aria-hidden="true" tabindex="-1" disabled>
        <span class="preset-content"><svg class="preset-icon" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 9v5m0 20v5M9 24h5m20 0h5M13.4 13.4l3.5 3.5m14.2 14.2 3.5 3.5m0-21.2-3.5 3.5m-14.2 14.2-3.5 3.5" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/><circle cx="24" cy="24" r="7" fill="none" stroke="currentColor" stroke-width="2.3"/></svg><span class="preset-name">Style</span><span class="preset-note" id="infinite-settings-current">Light</span></span>
      </button>
      <button class="preset settings-hub classic-choice" id="classic-settings" type="button" data-branch="classic" data-q="2" data-r="0" aria-expanded="false" aria-controls="classic-small classic-medium classic-large" aria-label="Classic board settings, Medium. Activate to open." aria-hidden="true" tabindex="-1" disabled>
        <span class="preset-content"><svg class="preset-icon" viewBox="0 0 48 48" aria-hidden="true"><path d="M11 15h26M11 24h26M11 33h26" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/><circle cx="19" cy="15" r="3" fill="var(--field)" stroke="currentColor" stroke-width="2"/><circle cx="30" cy="24" r="3" fill="var(--field)" stroke="currentColor" stroke-width="2"/><circle cx="22" cy="33" r="3" fill="var(--field)" stroke="currentColor" stroke-width="2"/></svg><span class="preset-name">Board</span><span class="preset-note" id="classic-settings-current">Medium</span></span>
      </button>
      <button class="preset settings-hub sphere-choice" id="sphere-settings" type="button" data-branch="sphere" data-q="-2" data-r="2" aria-expanded="false" aria-controls="sphere-light sphere-shell sphere-dark sphere-ink sphere-float sphere-card sphere-glow sphere-earth sphere-moon sphere-take-kimi sphere-take-claude sphere-take-muse sphere-invert" aria-label="Sphere theme settings, Light. Activate to open." aria-hidden="true" tabindex="-1" disabled>
        <span class="preset-content"><svg class="preset-icon" viewBox="0 0 48 48" aria-hidden="true"><path d="M12 31c6-15 18-21 25-15 6 6-2 21-15 21-5 0-8-2-10-6Z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="22" cy="27" r="2.7" fill="currentColor"/><circle cx="28" cy="21" r="2.7" fill="currentColor"/><circle cx="34" cy="20" r="2.7" fill="currentColor"/></svg><span class="preset-name">Theme</span><span class="preset-note" id="sphere-settings-current">Light</span></span>
      </button>

      <button class="preset choice infinite-choice" id="infinite-light" type="button" data-branch="infinite" data-infinite-theme="light" aria-label="Set Infinite style to Light" aria-pressed="false" aria-hidden="true" tabindex="-1" disabled>
        <span class="preset-content"><svg class="preset-icon" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="13" fill="none" stroke="currentColor" stroke-width="2"/><path d="M24 7v5m0 24v5M7 24h5m24 0h5M12 12l3.5 3.5m17 17L36 36m0-24-3.5 3.5m-17 17L12 36" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span class="preset-name">Light</span><span class="preset-note">Porcelain</span></span>
      </button>
      <button class="preset choice infinite-choice" id="infinite-dark" type="button" data-branch="infinite" data-infinite-theme="dark" aria-label="Set Infinite style to Dark" aria-pressed="false" aria-hidden="true" tabindex="-1" disabled>

      <button class="tool" id="center-tool" type="button" aria-keyshortcuts="Escape" aria-label="Recenter the board"><span class="tool-symbol" aria-hidden="true">⌾</span></button>

<script>
{{CORE_JS}}
</script>
<script>
(function () {
  "use strict";

  var SQRT3 = Math.sqrt(3);
  var launcher = document.getElementById("launcher");
  var canvas = document.getElementById("launcher-canvas");
  var presetLayer = document.getElementById("preset-layer");
  var cursor = document.getElementById("board-cursor");
  var status = document.getElementById("launcher-status");
  var resume = document.getElementById("resume-game");
  var resumeModeName = document.getElementById("resume-mode-name");
  var flagTool = document.getElementById("flag-tool");
  var zoomOutTool = document.getElementById("zoom-out-tool");
  var zoomInTool = document.getElementById("zoom-in-tool");
  var centerTool = document.getElementById("center-tool");
  var newTool = document.getElementById("new-tool");
  var modes = Array.prototype.slice.call(presetLayer.querySelectorAll(".mode[data-branch]"));
  var hubs = Array.prototype.slice.call(presetLayer.querySelectorAll(".settings-hub[data-branch]"));
  var choices = Array.prototype.slice.call(presetLayer.querySelectorAll(".choice[data-branch]"));
  // Native app builds drop the globe-map themes, mirroring the THEMES filter in
  // sphere/sphere.js — their daymaps are the only assets fetched over the
  // network, so offering them offline would launch into a silent fallback.
  // Removed before seats are assigned so the fan closes up rather than gapping.
  if (window.HEXSWEEPER_SPHERE_APP) {
    choices = choices.filter(function (choice) {
      if (!choice.dataset.sphereGlobe) return true;
      choice.remove();
      return false;
    });
  }
  var branches = {};
  var protectedKeys = new Set(["0,0"]);
  var modeByKey = new Map();
  var hubByKey = new Map();
  var choiceByKey = new Map();
  var exposedBranches = new Set();
  var activeBranch = null;
  var revealTimers = [];
  var resetTimer = 0;
  var api = null;
  var geometrySignature = "";
  var selectedKey = "0,0";
  var leaving = false;
  var keyboardRevealFocus = null;
  var activeResume = null;
  var statusLockUntil = 0;

  var APPEARANCE_KEY = "hexsweeper-appearance-v1";
  var EFFECTS_KEY = "hexsweeper-effects-v1";
  var INVERT_KEY = "hexsweeper-sphere-invert-v1";
  var INFINITE_THEME_KEY = "hexsweeper-mode-v3";
  var CLASSIC_SIZE_KEY = "hexsweeper-classic-size-v1";
  var SPHERE_THEME_KEY = "hexsweeper-sphere-theme-v6";
  var LAUNCHER_ZOOM_KEY = "hexsweeper-launcher-zoom-v1";
  var LAUNCHER_MIN_ZOOM = 1.28;
  var LAUNCHER_MAX_ZOOM = 2.1;
  var appearancePreference = "system";
  var effectsPreference = "auto";
  var invertPreference = { x: false, y: false };
  var infiniteThemePreference = "light";
  var classicSizePreference = "medium";
  var sphereThemePreference = "light";
  var colorScheme = matchMedia("(prefers-color-scheme: dark)");
  var INVERT_OPTIONS = [
    { x: false, y: false, label: "Natural" },
    { x: true, y: false, label: "Invert X" },
    { x: false, y: true, label: "Invert Y" },
    { x: true, y: true, label: "Invert both" }
  ];

  function key(q, r) { return q + "," + r; }
  function distance(q, r) { return Math.max(Math.abs(q), Math.abs(r), Math.abs(q + r)); }
  function storageValue(store, storageKey) {
    try { return store.getItem(storageKey); } catch (_) { return null; }
  }
  function writePreference(storageKey, value) {
    try { localStorage.setItem(storageKey, value); } catch (_) {}
  }
  function parseSave(raw) {
    if (!raw) return null;
    try { return JSON.parse(raw); } catch (_) { return null; }
  }
  function titleCase(value) { return value.charAt(0).toUpperCase() + value.slice(1); }
  function reducedMotion() { return Hexsweeper.effectsReduced(); }

  function initialLauncherZoom() {
    var stored = parseFloat(storageValue(localStorage, LAUNCHER_ZOOM_KEY) || "");
    if (Number.isFinite(stored)) {
      var readable = Math.max(LAUNCHER_MIN_ZOOM, Math.min(LAUNCHER_MAX_ZOOM, stored));
      if (readable !== stored) writePreference(LAUNCHER_ZOOM_KEY, String(readable));
      return readable;
    }
    return innerWidth < 500 ? 1.46 : 1.32;
  }

  modes.forEach(function (mode) {
    branches[mode.dataset.branch] = {
      mode: mode,
      hub: hubs.find(function (hub) { return hub.dataset.branch === mode.dataset.branch; }),
      choices: choices.filter(function (choice) { return choice.dataset.branch === mode.dataset.branch; })
    };
  });

  function axialPoint(q, r) {
    return { x: q + r / 2, y: .8660254038 * r };
  }

  // Branch records own only their semantic direction. Seats are assigned from
  // the data at boot, globally, so another future material extends the field
  // without a platform-specific breakpoint or a second overlay menu.
  function layoutChoiceSeats() {
    var occupied = new Set(["0,0"]);
    modes.forEach(function (mode) {
      occupied.add(key(Number(mode.dataset.q), Number(mode.dataset.r)));
    });
    hubs.forEach(function (hub) {
      occupied.add(key(Number(hub.dataset.q), Number(hub.dataset.r)));
    });
    Object.keys(branches).forEach(function (branchName) {
      var branch = branches[branchName];
      var hubQ = Number(branch.hub.dataset.q);
      var hubR = Number(branch.hub.dataset.r);
      var outward = axialPoint(Number(branch.mode.dataset.outQ), Number(branch.mode.dataset.outR));
      var candidates = [];
      for (var radius = 1; radius <= 7; radius += 1) {
        for (var relR = -radius; relR <= radius; relR += 1) {
          for (var relQ = -radius; relQ <= radius; relQ += 1) {
            if (distance(relQ, relR) !== radius) continue;
            var q = hubQ + relQ;
            var r = hubR + relR;
            var id = key(q, r);
            if (occupied.has(id)) continue;
            var point = axialPoint(relQ, relR);
            candidates.push({
              q: q,
              r: r,
              id: id,
              radius: radius,
              forward: point.x * outward.x + point.y * outward.y,
              cross: Math.abs(point.x * outward.y - point.y * outward.x)
            });
          }
        }
      }
      candidates.sort(function (a, b) {
        return a.radius - b.radius || b.forward - a.forward || a.cross - b.cross || a.r - b.r || a.q - b.q;
      });
      branch.choices.forEach(function (choice, index) {
        var seatIndex = candidates.findIndex(function (candidate) { return !occupied.has(candidate.id); });
        var seat = seatIndex >= 0 ? candidates.splice(seatIndex, 1)[0] : null;
        if (!seat) return;
        choice.dataset.q = String(seat.q);
        choice.dataset.r = String(seat.r);
        choice.dataset.layoutIndex = String(index);
        choice.style.setProperty("--reveal-delay", (index * 24) + "ms");
        occupied.add(seat.id);
      });
    });
  }

  function indexPresetSeats() {
    protectedKeys = new Set(["0,0"]);
    modeByKey.clear();
    hubByKey.clear();
    choiceByKey.clear();
    modes.forEach(function (mode) {
      var id = key(Number(mode.dataset.q), Number(mode.dataset.r));
      protectedKeys.add(id);
      modeByKey.set(id, mode);
    });
    hubs.forEach(function (hub) {
      var id = key(Number(hub.dataset.q), Number(hub.dataset.r));
      protectedKeys.add(id);
      hubByKey.set(id, hub);
    });
    choices.forEach(function (choice) {
      var id = key(Number(choice.dataset.q), Number(choice.dataset.r));
      protectedKeys.add(id);
      choiceByKey.set(id, choice);
    });
  }

  function loadPreferences() {
    var appearance = storageValue(localStorage, APPEARANCE_KEY);
    if (["system", "light", "dark"].indexOf(appearance) >= 0) appearancePreference = appearance;
    var effects = storageValue(localStorage, EFFECTS_KEY);
    if (["auto", "full", "reduced"].indexOf(effects) >= 0) effectsPreference = effects;
    var infinite = storageValue(localStorage, INFINITE_THEME_KEY);
    if (["light", "dark"].indexOf(infinite) >= 0) infiniteThemePreference = infinite;
    var size = storageValue(localStorage, CLASSIC_SIZE_KEY);
    if (["easy", "medium", "hard"].indexOf(size) >= 0) classicSizePreference = size;
    var sphere = storageValue(localStorage, SPHERE_THEME_KEY);
    if (sphere) sphereThemePreference = sphere;
    try {
      var invert = JSON.parse(storageValue(localStorage, INVERT_KEY) || "null");
      if (invert && typeof invert === "object") invertPreference = { x: !!invert.x, y: !!invert.y };
    } catch (_) {}
  }

  function currentInvertLabel() {
    var current = INVERT_OPTIONS.find(function (option) {
      return option.x === invertPreference.x && option.y === invertPreference.y;
    });
    return current ? current.label : "Natural";
  }

  function setCurrent(choice, current) {
    choice.setAttribute("aria-pressed", current ? "true" : "false");
  }

  function classicSizeLabel(size) {
    return size === "easy" ? "Small" : size === "hard" ? "Large" : "Medium";
  }

  // Take ids are slugs ("kimi-moon-ink-orrery"), so titleCase would surface
  // them raw. Anything absent falls back to titleCase, which covers the plain
  // single-word theme ids without needing an entry each.
  var SPHERE_THEME_LABELS = {
    "kimi-moon-ink-orrery": "Moon Ink",
    "claude-amber-codex": "Amber",
    "muse-constellation-void": "Void"
  };

  function sphereThemeTile(id) {
    return presetLayer.querySelector('[data-sphere-theme="' + id + '"]');
  }

  function sphereThemeLabel() {
    return SPHERE_THEME_LABELS[sphereThemePreference] || titleCase(sphereThemePreference);
  }

  // Takes are a separate axis in sphere.js (SPHERE_TAKES / ?take=) from the
  // THEMES roster (?theme=), so the tile carries which query it launches with.
  function sphereLaunchQuery() {
    var tile = sphereThemeTile(sphereThemePreference);
    var param = tile && tile.dataset.sphereKind === "take" ? "take" : "theme";
    return param + "=" + encodeURIComponent(sphereThemePreference);
  }

  function syncPreferences() {
    var infiniteLabel = titleCase(infiniteThemePreference);
    var classicLabel = classicSizeLabel(classicSizePreference);
    var sphereLabel = sphereThemeLabel();
    document.getElementById("effects-current").textContent = titleCase(effectsPreference);
    document.getElementById("invert-current").textContent = currentInvertLabel();
    document.getElementById("infinite-settings-current").textContent = infiniteLabel;
    document.getElementById("classic-settings-current").textContent = classicLabel;
    document.getElementById("sphere-settings-current").textContent = sphereLabel;
    document.getElementById("infinite-mode-current").textContent = branches.infinite.hub.classList.contains("is-available") ? infiniteLabel : "Settings";
    document.getElementById("classic-mode-current").textContent = branches.classic.hub.classList.contains("is-available") ? classicLabel : "Settings";
    document.getElementById("sphere-mode-current").textContent = branches.sphere.hub.classList.contains("is-available") ? sphereLabel : "Settings";
    document.getElementById("infinite-effects").setAttribute("aria-label", "Effects: " + titleCase(effectsPreference) + ". Activate to cycle.");
    document.getElementById("sphere-invert").setAttribute("aria-label", "Sphere drag: " + currentInvertLabel() + ". Activate to cycle.");
    document.getElementById("infinite-settings").setAttribute("aria-label", "Infinite settings, " + infiniteLabel + ". Activate to " + (activeBranch === "infinite" ? "close." : "open."));
    document.getElementById("classic-settings").setAttribute("aria-label", "Classic board settings, " + classicLabel + ". Activate to " + (activeBranch === "classic" ? "close." : "open."));
    document.getElementById("sphere-settings").setAttribute("aria-label", "Sphere theme settings, " + sphereLabel + ". Activate to " + (activeBranch === "sphere" ? "close." : "open."));
    document.getElementById("infinite-game").setAttribute("aria-label", branches.infinite.hub.classList.contains("is-available") ? "Play Infinite, " + infiniteLabel + " style" : "Dig Infinite to reveal its settings");
    document.getElementById("classic-game").setAttribute("aria-label", branches.classic.hub.classList.contains("is-available") ? "Play Classic, " + classicLabel + " board" : "Dig Classic to reveal its settings");
    document.getElementById("sphere-game").setAttribute("aria-label", branches.sphere.hub.classList.contains("is-available") ? "Play Sphere, " + sphereLabel + " theme" : "Dig Sphere to reveal its settings");
    presetLayer.querySelectorAll("[data-infinite-theme]").forEach(function (choice) {
      setCurrent(choice, choice.dataset.infiniteTheme === infiniteThemePreference);
    });
    presetLayer.querySelectorAll("[data-classic-size]").forEach(function (choice) {
      setCurrent(choice, choice.dataset.classicSize === classicSizePreference);
    });
    presetLayer.querySelectorAll("[data-sphere-theme]").forEach(function (choice) {
      setCurrent(choice, choice.dataset.sphereTheme === sphereThemePreference);
    });
  }

  function isDark() {
    return appearancePreference === "dark" || (appearancePreference === "system" && colorScheme.matches);
  }

  function engineTheme() {
    if (isDark()) {
      return {
        background: "#0c1118", covered: "#171f29", revealed: "#d7e0eb",
        shadowLight: "#536174", shadowDark: "#070a0f",
        pressedLight: "#ffffff", pressedDark: "#9aa8b9", flag: "#ef4444",
        text: { 1: "#2563eb", 2: "#0f855c", 3: "#c43131", 4: "#724ab5", 5: "#b45309", 6: "#be185d", mine: "#172231" }
      };
    }
    return {
      background: "#e8eef5", covered: "#f7f9fc", revealed: "#8f9db0",
      shadowLight: "#ffffff", shadowDark: "#aebdce",
      pressedLight: "#dbe4ee", pressedDark: "#657386", flag: "#e33030",
      text: { 1: "#125cc8", 2: "#16794f", 3: "#c43131", 4: "#724ab5", 5: "#9a5b05", 6: "#ad1c5d", mine: "#172231" }
    };
  }

  function applyAppearance() {
    document.documentElement.dataset.appearance = isDark() ? "dark" : "light";
    if (api) Object.assign(api.state.theme, engineTheme());
  }

  function infiniteResumeCandidate() {
    var data = parseSave(storageValue(localStorage, "hexsweeper-endless-plate-v1"));
    if (!data || data.v !== 1 || data.endless !== true) return null;
    if (data.first !== false || data.over !== false || Number(data.cleared) <= 0) return null;
    return { mode: "infinite", name: "Infinite", href: "{{INFINITE_HREF}}", savedAt: Number(data.savedAt) || 0 };
  }

  function classicResumeCandidate() {
    var data = parseSave(storageValue(localStorage, "hexsweeper-classic-run-v1"));
    if (!data || data.v !== 1 || data.kind !== "classic" || data.endless !== false) return null;
    if (data.first !== false || data.over !== false) return null;
    if (["easy", "medium", "hard"].indexOf(data.difficulty) < 0) return null;
    if (!Array.isArray(data.mines) || !data.mines.length || !Array.isArray(data.revealed) || !data.revealed.length || !Array.isArray(data.flagged)) return null;
    return { mode: "bounded", name: "Classic", href: "{{BOUNDED_HREF}}?resume=1", savedAt: Number(data.savedAt) || 0 };
  }

  function sphereResumeCandidate() {
    var stores = [sessionStorage, localStorage];
    var keys = ["hexsweeper-sphere-run-v2", "hexsweeper-sphere-run-v1"];
    var best = null;
    stores.forEach(function (store) {
      keys.forEach(function (storageKey) {
        var data = parseSave(storageValue(store, storageKey));
        if (!data || (data.v !== 1 && data.v !== 2) || data.kind !== "sphere") return;
        if (data.over !== false || typeof data.first !== "boolean") return;
        var flagged = Array.isArray(data.flagged) ? data.flagged.length : Number(data.flags) || 0;
        if (data.first && flagged <= 0) return;
        if (!data.first && (!Array.isArray(data.mines) || data.mines.length === 0)) return;
        var candidate = { mode: "sphere", name: "Sphere", href: "{{SPHERE_HREF}}", savedAt: Number(data.savedAt) || 0 };
        if (!best || candidate.savedAt >= best.savedAt) best = candidate;
      });
    });
    return best;
  }

  function refreshResume() {
    activeResume = [infiniteResumeCandidate(), classicResumeCandidate(), sphereResumeCandidate()]
      .filter(Boolean)
      .sort(function (a, b) { return b.savedAt - a.savedAt; })[0] || null;
    if (!activeResume) {
      resume.hidden = true;
      return;
    }
    resume.hidden = false;
    resume.href = activeResume.href;
    resume.dataset.mode = activeResume.mode;
    resumeModeName.textContent = activeResume.name;
    resume.setAttribute("aria-label", "Resume " + activeResume.name + " Hexsweeper");
  }

  function screenPoint(q, r, state) {
    return {
      x: state.canvas.width / 2 - state.camX + state.cellSize * SQRT3 * (q + r / 2),
      y: state.canvas.height / 2 - state.camY + state.cellSize * 1.5 * r
    };
  }

  function syncPresetGeometry(gameApi) {
    var state = gameApi.state;
    var signature = [state.canvas.width, state.canvas.height, state.cellSize.toFixed(3), state.camX.toFixed(2), state.camY.toFixed(2), state.map.size].join(":");
    if (signature === geometrySignature) return;
    geometrySignature = signature;
    var originX = state.canvas.width / 2 - state.camX;
    var originY = state.canvas.height / 2 - state.camY;
    state.map.forEach(function (cell) { cell.calcGeometry(originX, originY, state.cellSize); });
    document.documentElement.style.setProperty("--cell-size", state.cellSize.toFixed(2) + "px");
    [resume].concat(modes, hubs, choices).forEach(function (control) {
      var point = screenPoint(Number(control.dataset.q), Number(control.dataset.r), state);
      control.style.setProperty("--screen-x", point.x.toFixed(2) + "px");
      control.style.setProperty("--screen-y", point.y.toFixed(2) + "px");
    });
    updateCursor();
  }

  function updateCursor() {
    if (!api) return;
    var cell = api.state.map.get(selectedKey);
    if (!cell) return;
    var point = screenPoint(cell.q, cell.r, api.state);
    cursor.style.setProperty("--screen-x", point.x.toFixed(2) + "px");
    cursor.style.setProperty("--screen-y", point.y.toFixed(2) + "px");
    var stateName = cell.flagged ? "flagged" : cell.revealed ? (cell.neighborMines ? "revealed, " + cell.neighborMines + " nearby" : "revealed, clear") : "covered";
    canvas.setAttribute("aria-label", "Playable Hexsweeper menu. Selected tile is " + stateName + ". Arrow keys move, Enter digs, F flags, Escape recenters.");
  }

  function revealChoice(choice) {
    if (choice.classList.contains("is-available")) return;
    choice.classList.add("is-available");
    choice.setAttribute("aria-hidden", "false");
    choice.tabIndex = 0;
    if (choice.tagName === "BUTTON") choice.disabled = false;
  }

  function revealHub(hub) {
    if (!hub || !exposedBranches.has(hub.dataset.branch)) return;
    hub.classList.add("is-available");
    hub.setAttribute("aria-hidden", "false");
    hub.tabIndex = 0;
    hub.disabled = false;
    var branch = branches[hub.dataset.branch];
    branch.mode.classList.add("is-dug");
    branch.mode.setAttribute("aria-expanded", "true");
    syncPreferences();
    if (keyboardRevealFocus === hub.dataset.branch + ":hub") {
      keyboardRevealFocus = null;
      hub.focus({ preventScroll: true });
    }
  }

  function branchLabel(branchName) {
    return branchName === "classic" ? "Classic board" : branchName === "sphere" ? "Sphere theme" : "Infinite style";
  }

  function closeBloom(branchName, restoreFocus) {
    var branch = branches[branchName];
    if (!branch) return;
    branch.choices.forEach(function (choice) {
      choice.classList.remove("is-available");
      choice.setAttribute("aria-hidden", "true");
      choice.tabIndex = -1;
      choice.disabled = true;
    });
    branch.hub.setAttribute("aria-expanded", "false");
    if (activeBranch === branchName) activeBranch = null;
    syncPreferences();
    if (restoreFocus) branch.hub.focus({ preventScroll: true });
  }

  function finishBloomReveal(branchName) {
    var branch = branches[branchName];
    if (!branch || activeBranch !== branchName) return;
    branch.choices.forEach(function (choice) {
      var cell = api.state.map.get(key(Number(choice.dataset.q), Number(choice.dataset.r)));
      if (cell && cell.revealed) revealChoice(choice);
    });
    status.textContent = branchLabel(branchName) + " · choose a tile · tap " + branch.hub.querySelector(".preset-name").textContent + " to close";
    if (keyboardRevealFocus === branchName + ":choice") {
      keyboardRevealFocus = null;
      var target = branch.choices.find(function (choice) { return choice.classList.contains("is-available"); });
      if (target) target.focus({ preventScroll: true });
    }
  }

  function openBloom(branchName, focusChoice) {
    var branch = branches[branchName];
    if (!branch || leaving || !branch.hub.classList.contains("is-available")) return;
    if (activeBranch === branchName) {
      closeBloom(branchName, focusChoice);
      status.textContent = branchLabel(branchName) + " settings closed";
      return;
    }
    if (activeBranch) closeBloom(activeBranch, false);
    activeBranch = branchName;
    branch.hub.setAttribute("aria-expanded", "true");
    if (focusChoice) keyboardRevealFocus = branchName + ":choice";
    var hubCell = api.state.map.get(key(Number(branch.hub.dataset.q), Number(branch.hub.dataset.r)));
    if (hubCell) {
      api.focusOnCell(hubCell, reducedMotion());
      geometrySignature = "";
    }
    syncPreferences();
    statusLockUntil = performance.now() + (reducedMotion() ? 120 : 1800);
    status.textContent = "Blooming " + branchLabel(branchName).toLowerCase() + " settings…";
    var lastDelay = 0;
    branch.choices.forEach(function (choice, index) {
      var delay = reducedMotion() ? 0 : 75 + index * 105;
      lastDelay = Math.max(lastDelay, delay);
      revealTimers.push(setTimeout(function () {
        if (activeBranch !== branchName || leaving) return;
        var id = key(Number(choice.dataset.q), Number(choice.dataset.r));
        var cell = api.state.map.get(id);
        if (cell && !cell.revealed && !cell._pendingReveal) api.dig(cell);
        if (cell && cell.revealed) revealChoice(choice);
      }, delay));
    });
    revealTimers.push(setTimeout(function () { finishBloomReveal(branchName); }, lastDelay + (reducedMotion() ? 20 : 190)));
  }

  function exposeSettingsHub(branchName, focusHub) {
    var branch = branches[branchName];
    if (!branch || leaving) return;
    exposedBranches.add(branchName);
    branch.mode.classList.add("is-dug");
    if (focusHub) keyboardRevealFocus = branchName + ":hub";
    if (branch.hub.classList.contains("is-available")) {
      if (focusHub) branch.hub.focus({ preventScroll: true });
      return;
    }
    statusLockUntil = performance.now() + (reducedMotion() ? 120 : 900);
    status.textContent = "Digging out " + branchLabel(branchName).toLowerCase() + " settings…";
    revealTimers.push(setTimeout(function () {
      if (leaving) return;
      var id = key(Number(branch.hub.dataset.q), Number(branch.hub.dataset.r));
      var cell = api.state.map.get(id);
      if (cell && !cell.revealed && !cell._pendingReveal) api.dig(cell);
      if (cell && cell.revealed) revealHub(branch.hub);
      status.textContent = branch.mode.querySelector(".preset-name").textContent + " ready · tap to play or adjust " + branch.hub.querySelector(".preset-name").textContent;
    }, reducedMotion() ? 0 : 105));
  }

  function selectMode(mode, focusHub) {
    if (!api || leaving) return;
    var id = key(Number(mode.dataset.q), Number(mode.dataset.r));
    var cell = api.state.map.get(id);
    if (!cell) return;
    if (!cell.revealed) {
      if (focusHub) keyboardRevealFocus = mode.dataset.branch + ":hub";
      api.dig(cell);
      return;
    }
    var branch = branches[mode.dataset.branch];
    if (!branch.hub.classList.contains("is-available")) {
      exposeSettingsHub(mode.dataset.branch, focusHub);
      return;
    }
    launchMode(mode.dataset.branch);
  }

  function cycleSetting(choice) {
    if (choice.dataset.setting === "effects") {
      var effects = ["auto", "full", "reduced"];
      effectsPreference = effects[(effects.indexOf(effectsPreference) + 1) % effects.length];
      writePreference(EFFECTS_KEY, effectsPreference);
      Hexsweeper.applyEffectsAttribute();
      syncPreferences();
      status.textContent = "Effects: " + titleCase(effectsPreference);
      return;
    }
    if (choice.dataset.setting === "invert") {
      var currentIndex = INVERT_OPTIONS.findIndex(function (option) {
        return option.x === invertPreference.x && option.y === invertPreference.y;
      });
      var next = INVERT_OPTIONS[(Math.max(0, currentIndex) + 1) % INVERT_OPTIONS.length];
      invertPreference = { x: next.x, y: next.y };
      writePreference(INVERT_KEY, JSON.stringify(invertPreference));
      syncPreferences();
      status.textContent = "Sphere drag: " + next.label;
    }
  }

  function applyChoice(choice) {
    if (choice.dataset.setting) {
      cycleSetting(choice);
      return;
    }
    if (choice.dataset.classicSize) {
      classicSizePreference = choice.dataset.classicSize;
      writePreference(CLASSIC_SIZE_KEY, classicSizePreference);
      status.textContent = classicSizeLabel(classicSizePreference) + " set · tap Classic to play";
    }
    if (choice.dataset.infiniteTheme) {
      infiniteThemePreference = choice.dataset.infiniteTheme;
      writePreference(INFINITE_THEME_KEY, infiniteThemePreference);
      status.textContent = titleCase(infiniteThemePreference) + " set · tap Infinite to play";
    }
    if (choice.dataset.sphereTheme) {
      sphereThemePreference = choice.dataset.sphereTheme;
      writePreference(SPHERE_THEME_KEY, sphereThemePreference);
      status.textContent = sphereThemeLabel() + " set · tap Sphere to play";
    }
    syncPreferences();
  }

  function beginLaunch(control, name, href, verb) {
    if (leaving) return;
    leaving = true;
    launcher.classList.add("is-launching");
    control.classList.add("is-launching");
    status.textContent = verb + " " + name;
    setTimeout(function () { location.href = href; }, reducedMotion() ? 20 : 190);
  }

  function launchMode(branchName) {
    var branch = branches[branchName];
    if (!branch) return;
    if (branchName === "infinite") {
      beginLaunch(branch.mode, "Infinite · " + titleCase(infiniteThemePreference), "{{INFINITE_HREF}}?mode=" + encodeURIComponent(infiniteThemePreference) + "&fresh=1", "Opening");
      return;
    }
    if (branchName === "classic") {
      beginLaunch(branch.mode, "Classic · " + classicSizeLabel(classicSizePreference), "{{BOUNDED_HREF}}?size=" + encodeURIComponent(classicSizePreference) + "&new=1", "Opening");
      return;
    }
    beginLaunch(branch.mode, "Sphere · " + sphereThemeLabel(), "{{SPHERE_HREF}}?" + sphereLaunchQuery() + "&fresh=1", "Opening");
  }

  function chooseDestination(destination) {
    beginLaunch(destination, resumeModeName.textContent, destination.href, "Resuming");
  }

  function resetBloomControls() {
    activeBranch = null;
    exposedBranches.clear();
    keyboardRevealFocus = null;
    revealTimers.forEach(clearTimeout);
    revealTimers.length = 0;
    choices.forEach(function (choice) {
      choice.classList.remove("is-available", "is-launching");
      choice.setAttribute("aria-hidden", "true");
      choice.tabIndex = -1;
      choice.disabled = true;
    });
    hubs.forEach(function (hub) {
      hub.classList.remove("is-available", "is-launching");
      hub.setAttribute("aria-hidden", "true");
      hub.setAttribute("aria-expanded", "false");
      hub.tabIndex = -1;
      hub.disabled = true;
    });
    modes.forEach(function (mode) {
      mode.classList.remove("is-dug");
      mode.setAttribute("aria-expanded", "false");
    });
    syncPreferences();
  }

  function newField(announce) {
    clearTimeout(resetTimer);
    resetBloomControls();
    leaving = false;
    launcher.classList.remove("is-launching");
    api.restart({ clearPersist: false });
    api.setCamera(0, 0);
    selectedKey = "0,0";
    geometrySignature = "";
    flagTool.setAttribute("aria-pressed", "false");
    if (announce !== false) status.textContent = "New field · dig a mode or any safe-looking tile";
    canvas.focus({ preventScroll: true });
  }

  function activateCellByKey(id, focusChoice) {
    if (!api) return;
    if (!resume.hidden && id === "0,0") {
      chooseDestination(resume);
      return;
    }
    var choice = choiceByKey.get(id);
    if (choice && choice.classList.contains("is-available")) {
      applyChoice(choice);
      return;
    }
    var hub = hubByKey.get(id);
    if (hub && hub.classList.contains("is-available")) {
      openBloom(hub.dataset.branch, focusChoice);
      return;
    }
    var mode = modeByKey.get(id);
    if (mode) {
      selectMode(mode, focusChoice);
      return;
    }
    var cell = api.state.map.get(id);
    if (cell && !cell.revealed && !cell.flagged) api.dig(cell);
  }

  layoutChoiceSeats();
  indexPresetSeats();
  loadPreferences();
  applyAppearance();
  syncPreferences();
  refreshResume();

  var config = {
    easy: { radius: 7, mines: 28, cellSize: 30 },
    medium: { radius: 8, mines: 46, cellSize: 32 },
    hard: { radius: 10, mines: 80, cellSize: 34 }
  };

  /**
   * Launcher count language mirrors Sphere: nested inset hexes get denser as
   * danger rises. Exact counts remain in the board's spoken status, while the
   * visual field stays quieter than a screen full of competing digits.
   */
  function drawDangerRings(ctx, cell, size, count, color) {
    var n = Math.max(0, Math.min(6, count | 0));
    if (!cell.revealed || cell.isMine || n < 1) return;
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.globalAlpha = .64;
    ctx.lineWidth = Math.max(1.05, Math.min(1.7, size * .038));
    for (var index = 0; index < n; index += 1) {
      var scale = n === 1
        ? .34
        : .52 - index * (.36 / Math.max(1, n - 1));
      ctx.stroke(cell.hexPath(size, scale));
    }
    ctx.restore();
  }

  api = Hexsweeper.boot({
    canvasId: "launcher-canvas",
    difficulty: "medium",
    endless: true,
    mineDensity: .17,
    maxRadius: 54,
    initialZoom: initialLauncherZoom(),
    minZoom: LAUNCHER_MIN_ZOOM,
    maxZoom: LAUNCHER_MAX_ZOOM,
    zoomStorageKey: LAUNCHER_ZOOM_KEY,
    config: config,
    theme: engineTheme(),
    hooks: {
      usePathHitTest: true,
      layout: function (gameApi) {
        gameApi.state.canvas.width = Math.max(320, Math.round(innerWidth));
        gameApi.state.canvas.height = Math.max(320, Math.round(innerHeight));
      },
      isProtectedCell: function (cell) {
        return protectedKeys.has(key(cell.q, cell.r));
      },
      beforeFrame: function (_ctx, gameApi) {
        syncPresetGeometry(gameApi);
      },
      drawCell: function (_ctx, cell, size, gameApi) {
        var count = cell.neighborMines;
        var protectedCell = protectedKeys.has(key(cell.q, cell.r));
        cell.neighborMines = 0;
        gameApi.drawDefaultCell(cell, size);
        cell.neighborMines = count;
        if (!protectedCell && count > 0) {
          drawDangerRings(_ctx, cell, size, count, gameApi.state.theme.text[count] || "#263240");
        }
      },
      onCellAction: function (cell, gameApi) {
        var id = key(cell.q, cell.r);
        if (!resume.hidden && id === "0,0") {
          chooseDestination(resume);
          return true;
        }
        var choice = choiceByKey.get(id);
        if (choice && choice.classList.contains("is-available")) {
          applyChoice(choice);
          return true;
        }
        var hub = hubByKey.get(id);
        if (hub && hub.classList.contains("is-available")) {
          openBloom(hub.dataset.branch, false);
          return true;
        }
        var mode = modeByKey.get(id);
        if (mode && (cell.revealed || gameApi.state.flagMode)) {
          selectMode(mode, false);
          return true;
        }
        return false;
      },
      onReveal: function (cell, _gameApi, meta) {
        var id = key(cell.q, cell.r);
        var mode = modeByKey.get(id);
        if (mode) {
          mode.classList.add("is-dug");
          if (meta && meta.source === "dig") exposeSettingsHub(mode.dataset.branch, keyboardRevealFocus === mode.dataset.branch + ":hub");
        }
        var hub = hubByKey.get(id);
        if (hub && exposedBranches.has(hub.dataset.branch)) revealHub(hub);
        var choice = choiceByKey.get(id);
        if (choice && activeBranch === choice.dataset.branch) revealChoice(choice);
        if (!mode && !hub && !choice && !leaving && performance.now() > statusLockUntil) {
          status.textContent = cell.neighborMines ? "Safe · " + cell.neighborMines + " nearby" : "Clear · the opening is spreading";
        }
        updateCursor();
      },
      onFlag: function (cell) {
        status.textContent = cell.flagged ? "Flag placed" : "Flag removed";
        updateCursor();
      },
      onProtectedFlag: function () {
        status.textContent = "Preset cells stay safe · dig them to reveal their purpose";
      },
      onFlagMode: function (on) {
        flagTool.setAttribute("aria-pressed", on ? "true" : "false");
        status.textContent = on ? "Flag mode on · tap a covered tile" : "Dig mode on";
      },
      onGameOver: function () {
        status.textContent = "Mine · the launcher will grow a fresh field";
        clearTimeout(resetTimer);
        resetTimer = setTimeout(function () { newField(false); status.textContent = "Fresh field · modes are still safe"; }, reducedMotion() ? 120 : 1350);
      },
      onReset: function () { geometrySignature = ""; },
      onExpand: function () { geometrySignature = ""; },
      onRelayout: function () { geometrySignature = ""; }
    }
  });
  geometrySignature = "";

  modes.forEach(function (mode) {
    mode.addEventListener("click", function (event) {
      event.preventDefault();
      selectMode(mode, true);
    });
  });
  hubs.forEach(function (hub) {
    hub.addEventListener("click", function (event) {
      event.preventDefault();
      if (!hub.classList.contains("is-available")) return;
      openBloom(hub.dataset.branch, true);
    });
  });
  choices.forEach(function (choice) {
    choice.addEventListener("click", function (event) {
      event.preventDefault();
      if (!choice.classList.contains("is-available")) return;
      applyChoice(choice);
    });
  });
  resume.addEventListener("click", function (event) {
    event.preventDefault();
    chooseDestination(resume);
  });

  flagTool.addEventListener("click", function () { api.toggleFlagMode(); });
  function zoomBoard(factor) {
    var zoom = api.adjustZoom(factor, {
      x: api.state.canvas.width / 2,
      y: api.state.canvas.height / 2
    });
    geometrySignature = "";
    status.textContent = "Board zoom: " + Math.round(zoom * 100) + "%";
    canvas.focus({ preventScroll: true });
  }
  zoomOutTool.addEventListener("click", function () { zoomBoard(1 / 1.12); });
  zoomInTool.addEventListener("click", function () { zoomBoard(1.12); });
  centerTool.addEventListener("click", function () {
    api.setCamera(0, 0);
    selectedKey = "0,0";
    geometrySignature = "";
    status.textContent = "Board centered";
    canvas.focus({ preventScroll: true });
  });
  newTool.addEventListener("click", function () { newField(true); });

  addEventListener("keydown", function (event) {
    if (event.key !== "Escape" || !activeBranch || event.target === canvas) return;
    event.preventDefault();
    var closingBranch = activeBranch;
    closeBloom(closingBranch, true);
    status.textContent = branchLabel(closingBranch) + " settings closed";
  });

  canvas.addEventListener("focus", updateCursor);
  canvas.addEventListener("keydown", function (event) {
    var directions = {
      ArrowRight: [1, 0], ArrowLeft: [-1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1]
    };
    if (directions[event.key]) {
      event.preventDefault();
      event.stopPropagation();
      var current = selectedKey.split(",").map(Number);
      var nextQ = current[0] + directions[event.key][0];
      var nextR = current[1] + directions[event.key][1];
      var next = api.state.map.get(key(nextQ, nextR));
      if (!next) return;
      selectedKey = key(nextQ, nextR);
      var point = screenPoint(nextQ, nextR, api.state);
      var margin = api.state.cellSize * 2.4;
      if (point.x < margin || point.x > api.state.canvas.width - margin || point.y < margin || point.y > api.state.canvas.height - margin) {
        api.focusOnCell(next, false);
      }
      geometrySignature = "";
      updateCursor();
      return;
    }
    if (event.key === "Enter" || event.code === "Space") {
      event.preventDefault();
      event.stopPropagation();
      activateCellByKey(selectedKey, true);
      return;
    }
    if (event.key === "f" || event.key === "F") {
      event.preventDefault();
      event.stopPropagation();
      var selected = api.state.map.get(selectedKey);
      if (selected && !protectedKeys.has(selectedKey)) api.toggleFlag(selected);
      return;
    }
    if (event.key === "Escape") {
      event.preventDefault();
      event.stopPropagation();
      if (activeBranch) {
        var closingBranch = activeBranch;
        closeBloom(closingBranch, true);
        status.textContent = branchLabel(closingBranch) + " settings closed";
        return;
      }
      api.setCamera(0, 0);
      geometrySignature = "";
      status.textContent = "Board centered";
      return;
    }
    if ((event.key === "r" || event.key === "R") && !event.metaKey && !event.ctrlKey) {
      event.preventDefault();
      event.stopPropagation();
      newField(true);
    }
  });

  addEventListener("pageshow", function (event) {
    if (!event.persisted) return;
    leaving = false;
    launcher.classList.remove("is-launching");
    [resume].concat(modes, hubs).forEach(function (control) { control.classList.remove("is-launching"); });
    loadPreferences();
    applyAppearance();
    syncPreferences();
    refreshResume();
    geometrySignature = "";
  });
  if (colorScheme.addEventListener) colorScheme.addEventListener("change", applyAppearance);
  else if (colorScheme.addListener) colorScheme.addListener(applyAppearance);

  status.textContent = activeResume
    ? "Resume in the center · dig a mode · drag to explore"
    : "Dig a mode · drag to explore · hold to flag";
})();
</script>
