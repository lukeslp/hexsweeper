<!DOCTYPE html>
<!--
  File Purpose: Template for the native app's mode picker (build/app/index.html).
  Primary Functions/Classes: static markup; the FONTS placeholder below is
    replaced with inlined IBM Plex woff2 by tools/export-collection.py
    (export_app_launcher). Do not repeat that token anywhere but the tag itself.
  Inputs: none at runtime. Outputs: links into games/*.html.
  Notes: The picker offers the three STRUCTURAL choices — infinite, bounded,
    sphere. Everything else (theme, board size, counts) is a setting inside the
    game, not a peer of it. Rendered as a dug Hexsweeper triad: three revealed
    wells, each showing its own material. No network, no images; previews are
    inline SVG so they cannot go stale or 404.
  A11y: one <nav> of links, 44pt+ targets, visible focus, reduced-motion honoured.
  Author: Luke Steuber <luke@lukesteuber.com>
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hexsweeper</title>
<meta name="description" content="Three ways to sweep a honeycomb.">
{{FONTS}}
<style>
  :root {
    --font-ui: "IBM Plex Sans", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, monospace;

    /* Porcelain chalk desk — the Light plate's surface. */
    --field: #d4dce8;
    --field-hi: #eef2f8;
    --field-lo: #b9c4d4;
    --well: #c6cfdd;
    --ink: #26303f;
    --ink-soft: #5f6c80;
    --seam: rgba(38, 48, 63, 0.13);
    --raise-hi: rgba(255, 255, 255, 0.92);
    --raise-lo: rgba(38, 48, 63, 0.20);
    --pill: rgba(255, 255, 255, 0.72);
    --pill-edge: rgba(38, 48, 63, 0.12);
    --focus: #2f6f9f;
  }
  :root[data-appearance="dark"] {
    /* Night iron — the Dark plate's surface. */
    --field: #10151d;
    --field-hi: #1c2430;
    --field-lo: #080b11;
    --well: #0a0e15;
    --ink: #dde5f0;
    --ink-soft: #8794a8;
    --seam: rgba(221, 229, 240, 0.11);
    --raise-hi: rgba(255, 255, 255, 0.07);
    --raise-lo: rgba(0, 0, 0, 0.72);
    --pill: rgba(255, 255, 255, 0.07);
    --pill-edge: rgba(255, 255, 255, 0.14);
    --focus: #7fc4f2;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; }
  body {
    margin: 0;
    /* Kills double-tap-to-zoom, which fires on a mis-hit between two hexes and
       leaves the picker zoomed with no obvious way back. "manipulation" rather
       than "none" on purpose: panning and pinch-zoom still work, so this stays
       usable for anyone who needs to magnify. The games set their own
       touch-action, since they implement pan and pinch themselves. */
    touch-action: manipulation;
    -webkit-text-size-adjust: 100%;
    font-family: var(--font-ui);
    color: var(--ink);
    background: var(--field);
    /* The unbroken field: light pooling the way the plate paints when zoomed out. */
    background-image:
      radial-gradient(120% 85% at 50% 6%, var(--field-hi) 0%, transparent 60%),
      radial-gradient(140% 100% at 50% 106%, var(--field-lo) 0%, transparent 56%);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: background-color .4s ease, color .4s ease;
    padding:
      max(18px, env(safe-area-inset-top))
      max(16px, env(safe-area-inset-right))
      max(18px, env(safe-area-inset-bottom))
      max(16px, env(safe-area-inset-left));
  }

  header { flex: none; padding: 4px 6px 0; }
  h1 {
    margin: 0;
    font-size: clamp(1.6rem, 7.4vw, 2.3rem);
    font-weight: 600;
    letter-spacing: -0.023em;
  }
  .lede {
    margin: 5px 0 0;
    font-family: var(--font-mono);
    font-size: .715rem;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  /* A honeycomb triad: two cells over one, the way three hexes actually pack. */
  nav {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    align-content: center;
    justify-items: center;
    column-gap: clamp(6px, 2vw, 12px);
    row-gap: 0;
    /* Side padding is not decoration: the cells' drop-shadow paints outside
       their box, and without this gutter it clips at the viewport edge. */
    padding: 1vh clamp(10px, 3vw, 16px);
  }
  .cell {
    width: 100%;
    max-width: 168px;
    min-width: 0;
    text-decoration: none;
    color: inherit;
    display: block;
    /* drop-shadow, not box-shadow: it follows the clipped hex silhouette. */
    filter:
      drop-shadow(-2px -2px 3px var(--raise-hi))
      drop-shadow(3px 4px 7px var(--raise-lo));
    transition: transform .22s cubic-bezier(.2,.7,.3,1), filter .22s ease;
  }
  /* Third cell drops into the notch between the first two — true hex packing. */
  .cell:nth-child(3) {
    grid-column: 1 / -1;
    justify-self: center;
    margin-top: calc(-1 * clamp(24px, 8vw, 46px));
  }
  .cell:active { transform: scale(.985) translateY(2px); filter: drop-shadow(0 1px 2px var(--raise-lo)); }
  .cell:focus-visible { outline: none; }
  .cell:focus-visible .face { box-shadow: inset 0 0 0 3px var(--focus); }

  /* The revealed well: inset, the way a dug cell reads on the plate. */
  .face {
    position: relative;
    aspect-ratio: 1 / 1.1547;             /* pointy-top hex */
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    background: var(--well);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding: 15% 12% 13%;
    overflow: hidden;
  }
  .face::after {
    /* The lip of the well catching light. */
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(160deg, rgba(0,0,0,.16), transparent 42%, rgba(255,255,255,.10));
    pointer-events: none;
  }

  .art { width: 58%; max-width: 88px; display: block; margin-bottom: 5px; }
  .name {
    font-size: clamp(.85rem, 3.6vw, 1rem);
    font-weight: 600;
    letter-spacing: -.01em;
    text-align: center;
    line-height: 1.15;
  }
  .meta {
    font-family: var(--font-mono);
    font-size: clamp(.55rem, 2.3vw, .65rem);
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--ink-soft);
    text-align: center;
  }

  /* Chrome row — same glass pills the games wear, same corner. */
  footer {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 2px 4px 0;
  }

  /* Effects stepper: one row, the Customize panel's vocabulary in miniature. */
  .effects {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    border: 1px solid var(--pill-edge);
    border-radius: 999px;
    background: var(--pill);
    -webkit-backdrop-filter: blur(9px);
    backdrop-filter: blur(9px);
    padding: 0 4px;
  }
  .effects button {
    min-width: 44px; height: 44px;
    display: grid; place-items: center;
    border: 0; background: none; color: var(--ink);
    font: 600 .74rem var(--font-mono); letter-spacing: .05em;
    cursor: pointer; border-radius: 999px; padding: 0 6px;
  }
  .effects button:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }
  .effects .value {
    min-width: 74px;
    font-family: var(--font-mono);
    font-size: .68rem;
    letter-spacing: .07em;
    text-transform: uppercase;
    text-align: center;
    color: var(--ink);
  }
  .effects .label {
    font-family: var(--font-mono);
    font-size: .55rem;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--ink-soft);
    padding-left: 8px;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px;
    padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  #appearance {
    width: 46px; height: 46px;
    display: grid; place-items: center;
    border: 1px solid var(--pill-edge);
    border-radius: 999px;
    background: var(--pill);
    color: var(--ink);
    cursor: pointer;
    -webkit-backdrop-filter: blur(9px);
    backdrop-filter: blur(9px);
  }
  #appearance:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  #appearance svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.7; }
  :root[data-appearance="dark"] .i-sun,
  :root:not([data-appearance="dark"]) .i-moon { display: none; }

  /* Entrance: the flood-reveal ring stagger the games already use. */
  @media (prefers-reduced-motion: no-preference) {
    .cell { animation: dig .5s cubic-bezier(.2,.75,.3,1) backwards; }
    .cell:nth-child(1) { animation-delay: .03s; }
    .cell:nth-child(2) { animation-delay: .12s; }
    .cell:nth-child(3) { animation-delay: .21s; }
    header, footer { animation: rise .45s ease backwards .04s; }
  }
  @keyframes dig { from { opacity: 0; transform: scale(.9) translateY(6px); } }
  @keyframes rise { from { opacity: 0; transform: translateY(-5px); } }

  /* Landscape / tablet: the triad opens into a row. */
  @media (min-width: 620px), (orientation: landscape) and (max-height: 520px) {
    nav { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .cell:nth-child(3) { grid-column: auto; margin-top: 0; }
    .cell:nth-child(even) { transform: translateY(clamp(18px, 4vw, 40px)); }
    .cell:nth-child(even):active { transform: translateY(calc(clamp(18px,4vw,40px) + 2px)) scale(.985); }
  }
</style>
</head>
<body>

<header>
  <h1>Hexsweeper</h1>
  <p class="lede">Three ways to sweep a honeycomb</p>
</header>

<nav aria-label="Choose a board">

  <a class="cell" href="games/infinite.html">
    <span class="face">
      <svg class="art" viewBox="0 0 64 64" aria-hidden="true">
        <g stroke="var(--seam)" stroke-width="1.1">
          <polygon points="32,4 47,13 47,30 32,39 17,30 17,13" fill="var(--field-hi)"/>
          <polygon points="15,34 30,43 30,60 15,60 0,51 0,34" fill="var(--field-lo)" opacity=".5"/>
          <polygon points="49,34 64,43 64,60 49,60 34,51 34,34" fill="var(--field-hi)" opacity=".72"/>
          <polygon points="49,0 64,9 64,26 49,26 34,17 34,0" fill="var(--field-lo)" opacity=".3"/>
          <polygon points="15,0 30,9 30,26 15,26 0,17 0,0" fill="var(--field-hi)" opacity=".45"/>
        </g>
        <text x="32" y="27" text-anchor="middle" font-family="var(--font-mono)"
              font-size="14" font-weight="600" fill="#3b7fc4">2</text>
      </svg>
      <span class="name">Infinite</span>
      <span class="meta">Grows as you dig</span>
    </span>
  </a>

  <a class="cell" href="games/bounded.html">
    <span class="face">
      <svg class="art" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="neu" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="var(--field-hi)"/><stop offset="1" stop-color="var(--field-lo)"/>
          </linearGradient>
        </defs>
        <g fill="url(#neu)" stroke="var(--seam)" stroke-width="1">
          <polygon points="32,6 46,14 46,30 32,38 18,30 18,14"/>
          <polygon points="17,33 31,41 31,57 17,57 3,49 3,33"/>
          <polygon points="47,33 61,41 61,57 47,57 33,49 33,33"/>
        </g>
        <rect x="1" y="1" width="62" height="62" rx="3" fill="none"
              stroke="var(--ink-soft)" stroke-width="1.2" stroke-dasharray="4 3" opacity=".5"/>
      </svg>
      <span class="name">Bounded</span>
      <span class="meta">Fixed board</span>
    </span>
  </a>

  <a class="cell" href="games/sphere.html">
    <span class="face">
      <svg class="art" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <radialGradient id="sph" cx="38%" cy="30%">
            <stop offset="0" stop-color="#4fc3e8"/><stop offset=".55" stop-color="#1a6f92"/>
            <stop offset="1" stop-color="#08131c"/>
          </radialGradient>
        </defs>
        <circle cx="32" cy="32" r="27" fill="url(#sph)"/>
        <g fill="none" stroke="#9fe4ff" stroke-width="1" opacity=".6">
          <path d="M32 5v54M11 18l42 28M53 18L11 46"/>
          <ellipse cx="32" cy="32" rx="27" ry="11"/><ellipse cx="32" cy="32" rx="12" ry="27"/>
        </g>
        <circle cx="32" cy="32" r="27" fill="none" stroke="#bdefff" stroke-width="1.4" opacity=".85"/>
      </svg>
      <span class="name">Sphere</span>
      <span class="meta">Closed · 3D</span>
    </span>
  </a>

</nav>

<footer>
  <div class="effects" role="group" aria-label="Effects">
    <span class="label" aria-hidden="true">FX</span>
    <button id="fx-prev" type="button" aria-label="Previous effects setting">&lsaquo;</button>
    <span class="value" id="fx-value">Auto</span>
    <button id="fx-next" type="button" aria-label="Next effects setting">&rsaquo;</button>
  </div>
  <p class="sr-only" id="fx-live" role="status" aria-live="polite"></p>

  <button id="appearance" type="button" aria-label="Switch appearance">
    <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="4.2"/>
      <path d="M12 2v2.6M12 19.4V22M2 12h2.6M19.4 12H22M4.9 4.9l1.9 1.9M17.2 17.2l1.9 1.9M19.1 4.9l-1.9 1.9M6.8 17.2l-1.9 1.9"/>
    </svg>
    <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20 13.4A8.2 8.2 0 1 1 10.6 4a6.6 6.6 0 0 0 9.4 9.4z"/>
    </svg>
  </button>
</footer>

<script>
(function () {
  "use strict";
  var KEY = "hexsweeper-appearance-v1";
  var root = document.documentElement;
  var btn = document.getElementById("appearance");
  function apply(mode) {
    root.dataset.appearance = mode;
    btn.setAttribute("aria-label", mode === "dark" ? "Switch to light" : "Switch to dark");
  }
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  apply(saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
  btn.addEventListener("click", function () {
    var next = root.dataset.appearance === "dark" ? "light" : "dark";
    apply(next);
    try { localStorage.setItem(KEY, next); } catch (e) {}
  });

  /* Effects preference. MIRROR of the helper in core.js and sphere/sphere.js —
     the launcher loads neither. Change all three together. Every game reads
     this key at boot, and entering one is a fresh page load, so a change here
     is always in force by the time you are playing. */
  var FX_KEY = "hexsweeper-effects-v1";
  var FX = [
    ["auto", "Auto", "following the system setting"],
    ["full", "Full", "all particles and motion"],
    ["reduced", "Reduced", "particles and motion off"]
  ];
  var value = document.getElementById("fx-value");
  var live = document.getElementById("fx-live");

  function read() {
    var v = null;
    try { v = localStorage.getItem(FX_KEY); } catch (e) {}
    for (var i = 0; i < FX.length; i++) if (FX[i][0] === v) return i;
    return 0;
  }
  function paint(i, announce) {
    value.textContent = FX[i][1];
    root.setAttribute("data-effects-pref", FX[i][0]);
    if (announce) live.textContent = "Effects " + FX[i][1] + ", " + FX[i][2];
  }
  function step(delta) {
    var i = (read() + delta + FX.length) % FX.length;
    try { localStorage.setItem(FX_KEY, FX[i][0]); } catch (e) {}
    paint(i, true);
  }
  paint(read(), false);
  document.getElementById("fx-prev").addEventListener("click", function () { step(-1); });
  document.getElementById("fx-next").addEventListener("click", function () { step(1); });
})();
</script>

</body>
</html>
