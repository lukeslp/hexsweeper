<!DOCTYPE html>
<!--
  File Purpose: shareable entry point for one sphere-ux optical-illusion
    experiment. Exists only because the experiments are query-string variants
    of a single document, and static hosting serves the same file — and so the
    same Open Graph tags — for every query. A crawler asked for
    `?dock=chamber` cannot be told these three apart.

    So each experiment gets a real URL of its own carrying its own card, which
    then hands the visitor straight to the live page. This is not a copy of the
    experiment: it holds no game code and cannot drift from it.
  Author: Luke Steuber <luke@lukesteuber.com>
-->
