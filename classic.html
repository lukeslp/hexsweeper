<!DOCTYPE html>
<!--
  File Purpose: Lab baseline neumorph Hexsweeper skin over core.js.
  Primary Functions/Classes: Hexsweeper.boot with default theme; lab nav chrome.
  Inputs: core.js, skin-chrome.css, optional ?size=easy|medium|hard. Outputs: Standalone classic board (not production).
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Classic Neumorph — Hexsweeper Lab</title>
<link rel="stylesheet" href="skin-chrome.css">
<style>

:root {
  --bg-color: #e0e5ec;
  --text-main: #4a5568;
  --text-sub: #a0aec0;
  --nav-bg: #e0e5ec;
  --nav-ink: #4a5568;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg-color);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100vh; margin: 0; overflow: hidden; user-select: none; touch-action: none;
  color: var(--text-main);
}

</style>
</head>
<body>
<div class="fx-layer" id="fx" aria-hidden="true"></div>
<nav class="skin-nav" aria-label="Skin navigation">
  <a href="lab.html">Lab</a>
  <a href="skins/caustic-lens.html" title="Previous skin (←)">←</a>
  <a href="skins/particle-bloom.html" title="Next skin (→)">→</a>
  <span class="meta"><span class="tag">baseline</span> · Classic Neumorph</span>
</nav>

<div class="canvas-container">
  <canvas id="gameCanvas"></canvas>
</div>

<div class="hud-actions" role="toolbar" aria-label="Game controls">
  <button type="button" id="reset-btn" class="hud-btn" aria-label="Reset" title="Reset">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="23 4 23 10 17 10"></polyline>
      <polyline points="1 20 1 14 7 14"></polyline>
      <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
    </svg>
  </button>
  <button type="button" id="menu-btn" class="hud-btn" aria-label="Menu" title="Menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="5" y1="7" x2="19" y2="7"></line>
      <line x1="5" y1="12" x2="15" y2="12"></line>
      <line x1="5" y1="17" x2="19" y2="17"></line>
    </svg>
  </button>
</div>

<div id="modal-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="menu-title">
  <div class="modal-content">
    <button id="close-modal-btn" class="close-btn" type="button" aria-label="Close">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
    <h2 id="menu-title" class="menu-title">Menu</h2>
    <div class="modal-row" id="run-row">
      <div class="modal-section-label">Run</div>
      <div class="menu-stats" aria-label="Score">
        <div id="stats-mines" class="stat-item visible" data-label="mines" title="Mines remaining">00</div>
        <div id="stats-time" class="stat-item visible" data-label="cleared" title="Safe cells cleared">000</div>
      </div>
    </div>
    <div class="modal-row">
      <div class="icon-label" title="Board size">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="9" height="9"></rect><rect x="13" y="2" width="9" height="9"></rect><rect x="2" y="13" width="9" height="9"></rect></svg>
      </div>
      <div class="diff-selector" id="diff-selector" role="group" aria-label="Board size">
        <button type="button" class="diff-option" data-val="easy" aria-pressed="false" title="Small · 10 mines">S</button>
        <button type="button" class="diff-option active" data-val="medium" aria-pressed="true" title="Medium · 35 mines">M</button>
        <button type="button" class="diff-option" data-val="hard" aria-pressed="false" title="Large · 80 mines">L</button>
      </div>
    </div>
    <div class="instructions-text">Tap to reveal · flag: right-click, Ctrl-click, or long-hold<br>Menu holds scores · Reset on the board · ← → skins</div>
    <nav class="menu-links" aria-label="Elsewhere">
      <a href="https://lukesteuber.com" target="_blank" rel="noopener noreferrer">Luke Steuber</a>
      <span class="menu-links-sep" aria-hidden="true">·</span>
      <a href="https://datapoems.io" target="_blank" rel="noopener noreferrer">Data Poems</a>
    </nav>
  </div>
</div>

<script src="core.js?v=20260820a"></script>
<script>
// keyboard prev/next
(function(){
  const prev="skins/caustic-lens.html", next="skins/particle-bloom.html";
  window.addEventListener("keydown", (e) => {
    if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
    if (e.key === "ArrowLeft") location.href = prev;
    if (e.key === "ArrowRight") location.href = next;
  });
})();

const CLASSIC_SIZE_KEY = "hexsweeper-classic-size-v1";
const CLASSIC_RUN_KEY = "hexsweeper-classic-run-v1";
const CLASSIC_SIZES = ["easy", "medium", "hard"];
const classicParams = new URLSearchParams(location.search);
let classicSize = "medium";
try {
  const requested = classicParams.get("size");
  const stored = localStorage.getItem(CLASSIC_SIZE_KEY);
  classicSize = CLASSIC_SIZES.includes(requested)
    ? requested
    : (CLASSIC_SIZES.includes(stored) ? stored : "medium");
  localStorage.setItem(CLASSIC_SIZE_KEY, classicSize);
} catch (_) {}

let classicGame = null;
let classicSaveTimer = 0;

function clearClassicRun() {
  clearTimeout(classicSaveTimer);
  classicSaveTimer = 0;
  try { localStorage.removeItem(CLASSIC_RUN_KEY); } catch (_) {}
}

function classicSnapshot() {
  if (!classicGame || classicGame.state.endless || classicGame.state.isFirstClick || classicGame.state.isGameOver) {
    return null;
  }
  const snapshot = classicGame.exportRunState();
  if (!snapshot || !Array.isArray(snapshot.mines) || !snapshot.mines.length || !Array.isArray(snapshot.revealed) || !snapshot.revealed.length) {
    return null;
  }
  snapshot.kind = "classic";
  snapshot.savedAt = Date.now();
  return snapshot;
}

function flushClassicRun() {
  clearTimeout(classicSaveTimer);
  classicSaveTimer = 0;
  const snapshot = classicSnapshot();
  if (!snapshot) {
    if (classicGame && (classicGame.state.isFirstClick || classicGame.state.isGameOver)) clearClassicRun();
    return;
  }
  try { localStorage.setItem(CLASSIC_RUN_KEY, JSON.stringify(snapshot)); } catch (_) {}
}

function scheduleClassicSave() {
  clearTimeout(classicSaveTimer);
  classicSaveTimer = setTimeout(flushClassicRun, 140);
}

function readClassicRun() {
  let snapshot = null;
  try { snapshot = JSON.parse(localStorage.getItem(CLASSIC_RUN_KEY) || "null"); } catch (_) {}
  const valid = snapshot &&
    snapshot.v === 1 &&
    snapshot.kind === "classic" &&
    snapshot.endless === false &&
    snapshot.first === false &&
    snapshot.over === false &&
    CLASSIC_SIZES.includes(snapshot.difficulty) &&
    Array.isArray(snapshot.mines) && snapshot.mines.length > 0 &&
    Array.isArray(snapshot.revealed) && snapshot.revealed.length > 0 &&
    Array.isArray(snapshot.flagged);
  if (!valid) {
    clearClassicRun();
    return null;
  }
  return snapshot;
}

classicGame = Hexsweeper.boot({
  difficulty: classicSize,
  theme: {
    bg: "#e0e5ec", shadowLight: "#ffffff", shadowDark: "#a3b1c6",
    covered: "#e0e5ec", revealed: "#e0e5ec", flag: "#ef4444",
    text: {1:"#3b82f6",2:"#10b981",3:"#ef4444",4:"#8b5cf6",5:"#f59e0b",6:"#ec4899",mine:"#333"}
  },
  hooks: {
    onReveal: scheduleClassicSave,
    onFlag: scheduleClassicSave,
    onPersistTick: scheduleClassicSave,
    onGameOver: clearClassicRun,
    onClearPersist: clearClassicRun
  }
});

if (classicParams.get("resume") === "1") {
  const savedClassicRun = readClassicRun();
  if (!savedClassicRun || !classicGame.applyRunState(savedClassicRun)) clearClassicRun();
} else {
  clearClassicRun();
}

document.addEventListener("click", (event) => {
  if (event.target.closest(".app-back")) flushClassicRun();
}, true);
addEventListener("pagehide", flushClassicRun);
addEventListener("beforeunload", flushClassicRun);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") flushClassicRun();
});

document.getElementById("diff-selector").addEventListener("click", (event) => {
  const option = event.target.closest("[data-val]");
  if (!option || !CLASSIC_SIZES.includes(option.dataset.val)) return;
  try { localStorage.setItem(CLASSIC_SIZE_KEY, option.dataset.val); } catch (_) {}
});

</script>
<script data-goatcounter="https://stats.dr.eamer.dev/count"
        async src="https://stats.dr.eamer.dev/count.js"></script>
</body>
</html>
