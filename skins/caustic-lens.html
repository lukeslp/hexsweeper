<script src="../core.js"></script>
<script>
// keyboard prev/next
(function(){
  const prev="mycelium.html", next="../classic.html";
  window.addEventListener("keydown", (e) => {
    if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
    if (e.key === "ArrowLeft") location.href = prev;
    if (e.key === "ArrowRight") location.href = next;
  });
})();

// underwater caustics + hover refraction bulge
function caustic(ctx, w, h, t, cx, cy) {
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (let i = 0; i < 6; i++) {
    const phase = t * (0.4 + i * 0.07) + i * 1.7;
    const g = ctx.createRadialGradient(
      cx + Math.sin(phase)*w*0.15, cy + Math.cos(phase*0.8)*h*0.12, 10,
      cx, cy, w*0.45
    );
    g.addColorStop(0, `rgba(120,220,255,${0.04 + (i%2)*0.02})`);
    g.addColorStop(0.4, `rgba(40,160,200,${0.03})`);
    g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    // wavy band
    for (let x = 0; x <= w; x += 12) {
      const y = cy + Math.sin(x*0.02 + phase + i)*18 + Math.cos(x*0.01 - phase)*10 + (i-2.5)*22;
      if (x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.lineTo(w,h); ctx.lineTo(0,h); ctx.closePath();
    ctx.globalAlpha = 0.35;
    ctx.fill();
  }
  ctx.restore();
}

Hexsweeper.boot({
  theme: {
    bg:"#071820", shadowLight:"rgba(160,230,255,0.4)", shadowDark:"rgba(0,20,30,0.7)",
    covered:"#0e3040", revealed:"#0a202c", flag:"#7ee0ff",
    pressedDark:"rgba(0,20,30,0.6)", pressedLight:"rgba(160,230,255,0.35)",
    text:{1:"#7dd3fc",2:"#5eead4",3:"#f9a8d4",4:"#a5b4fc",5:"#fde68a",6:"#67e8f9",mine:"#e0f7ff"}
  },
  hooks: {
    beforeFrame(ctx, api) {
      const s = api.state;
      caustic(ctx, s.canvas.width, s.canvas.height, s.now*0.001, s.centerX, s.centerY);
    },
    drawCell(ctx, cell, size, api) {
      const s = api.state;
      const T = s.theme;
      // refraction bulge on hover: shift vertices toward pointer slightly
      let bx = 0, by = 0, bulge = 0;
      if (s.pointer.active) {
        const dx = cell.x - s.pointer.x, dy = cell.y - s.pointer.y;
        const dist = Math.hypot(dx, dy) || 1;
        const R = size * 4.5;
        if (dist < R) {
          bulge = (1 - dist/R) * 0.12;
          bx = (dx/dist) * bulge * size * 2;
          by = (dy/dist) * bulge * size * 2;
        }
      }
      const scale = 0.92 + cell.animHover * 0.05 + bulge;
      const ox = cell.x, oy = cell.y;
      cell.x += bx; cell.y += by;
      const path = cell.hexPath(size, scale);

      // caustic highlight on cell face
      const t = s.now * 0.001;
      const shimmer = 0.5 + 0.5*Math.sin(cell.q*1.3 + cell.r*1.7 + t*2);
      ctx.fillStyle = cell.revealed
        ? `rgba(20,50,65,${0.85})`
        : `rgba(${14+shimmer*20|0},${48+shimmer*30|0},${64+shimmer*40|0},0.95)`;
      ctx.fill(path);

      // specular ridge
      ctx.save();
      ctx.strokeStyle = `rgba(180,240,255,${0.15 + shimmer*0.25 + cell.animHover*0.2})`;
      ctx.lineWidth = 1.5;
      ctx.stroke(path);
      const g = ctx.createLinearGradient(cell.x-size, cell.y-size, cell.x+size, cell.y+size);
      g.addColorStop(0, `rgba(200,250,255,${0.15+bulge})`);
      g.addColorStop(0.5, "rgba(200,250,255,0)");
      g.addColorStop(1, "rgba(0,40,60,0.2)");
      ctx.fillStyle = g;
      ctx.fill(path);
      ctx.restore();

      if (cell.animReveal > 0.1) {
        ctx.globalAlpha = cell.animReveal;
        if (cell.isMine) {
          ctx.fillStyle = T.text.mine;
          ctx.beginPath(); ctx.arc(cell.x, cell.y, size*0.35, 0, Math.PI*2); ctx.fill();
        } else if (cell.neighborMines > 0) {
          ctx.fillStyle = T.text[cell.neighborMines];
          ctx.font = `700 ${size}px system-ui,sans-serif`;
          ctx.textAlign="center"; ctx.textBaseline="middle";
          ctx.fillText(cell.neighborMines, cell.x, cell.y+size*0.05);
        }
        ctx.globalAlpha = 1;
      }
      if (cell.flagged && !cell.revealed) {
        ctx.fillStyle = T.flag;
        ctx.font = `bold ${size}px sans-serif`;
        ctx.textAlign="center"; ctx.textBaseline="middle";
        ctx.fillText("!", cell.x, cell.y+size*0.1);
      }
      cell.x = ox; cell.y = oy;
    }
  }
});

</script>
<script data-goatcounter="https://stats.dr.eamer.dev/count"
        async src="https://stats.dr.eamer.dev/count.js"></script>
