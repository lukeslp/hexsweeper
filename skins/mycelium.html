<script src="../core.js"></script>
<script>
// keyboard prev/next
(function(){
  const prev="comet-void.html", next="caustic-lens.html";
  window.addEventListener("keydown", (e) => {
    if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
    if (e.key === "ArrowLeft") location.href = prev;
    if (e.key === "ArrowRight") location.href = next;
  });
})();

// motifs/mycelium-network — hyphal links + nutrient particles
const nutrients = [];
function nutrientAlong(a, b) {
  nutrients.push({
    a, b, t: Math.random(), speed: 0.004 + Math.random()*0.008,
    r: 1.2 + Math.random()*1.5
  });
}

Hexsweeper.boot({
  theme: {
    bg:"#0d1410", shadowLight:"rgba(180,230,150,0.35)", shadowDark:"rgba(0,0,0,0.6)",
    covered:"#1a2a1c", revealed:"#101810", flag:"#e8c547",
    pressedDark:"rgba(0,0,0,0.5)", pressedLight:"rgba(160,220,140,0.3)",
    text:{1:"#86efac",2:"#4ade80",3:"#fbbf24",4:"#a3e635",5:"#fde047",6:"#34d399",mine:"#ecfccb"}
  },
  hooks: {
    onReveal(cell, api) {
      // grow hyphae to revealed neighbors
      for (const n of api.getNeighbors(cell.q, cell.r)) {
        if (n.revealed || n === cell) {
          nutrientAlong(cell, n);
        }
      }
    },
    beforeFrame(ctx, api) {
      const s = api.state;
      // draw hyphal web between revealed cells
      ctx.save();
      ctx.lineCap = "round";
      const revealed = [];
      s.map.forEach(c => { if (c.revealed && !c.isMine) revealed.push(c); });
      for (const c of revealed) {
        for (const n of api.getNeighbors(c.q, c.r)) {
          if (!n.revealed || n.isMine) continue;
          // draw each undirected edge once
          if (n.q < c.q || (n.q === c.q && n.r < c.r)) continue;
          const maturity = Math.min(c.animReveal, n.animReveal);
          if (maturity < 0.05) continue;
          ctx.globalAlpha = 0.15 + maturity * 0.35;
          ctx.strokeStyle = "#6ee7a0";
          ctx.lineWidth = 1 + maturity * 1.5;
          ctx.beginPath();
          ctx.moveTo(c.x, c.y);
          // slight organic curve
          const mx = (c.x+n.x)/2 + Math.sin((c.q+n.r)*1.7)*4;
          const my = (c.y+n.y)/2 + Math.cos((c.r+n.q)*1.3)*4;
          ctx.quadraticCurveTo(mx, my, n.x, n.y);
          ctx.stroke();
        }
      }
      ctx.restore();
    },
    afterFrame(ctx, api) {
      // nutrient flow
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      for (const p of nutrients) {
        if (!p.a.revealed && !p.b.revealed) continue;
        p.t += p.speed;
        if (p.t > 1) p.t = 0;
        const t = p.t;
        const mx = (p.a.x+p.b.x)/2 + Math.sin((p.a.q+p.b.r)*1.7)*4;
        const my = (p.a.y+p.b.y)/2 + Math.cos((p.a.r+p.b.q)*1.3)*4;
        // quadratic bezier point
        const u = 1-t;
        const x = u*u*p.a.x + 2*u*t*mx + t*t*p.b.x;
        const y = u*u*p.a.y + 2*u*t*my + t*t*p.b.y;
        ctx.globalAlpha = 0.7;
        ctx.fillStyle = "#b8f0c8";
        ctx.beginPath(); ctx.arc(x,y,p.r,0,Math.PI*2); ctx.fill();
      }
      // cap nutrient list
      if (nutrients.length > 200) nutrients.splice(0, nutrients.length - 200);
      ctx.restore();
    },
    decorateCell(ctx, cell, size) {
      if (cell.revealed && !cell.isMine) {
        ctx.save();
        ctx.globalAlpha = 0.25 * cell.animReveal;
        ctx.fillStyle = "#4ade80";
        ctx.beginPath(); ctx.arc(cell.x, cell.y, size*0.15, 0, Math.PI*2); ctx.fill();
        ctx.restore();
      }
    }
  }
});

</script>
<script data-goatcounter="https://stats.dr.eamer.dev/count"
        async src="https://stats.dr.eamer.dev/count.js"></script>
</body>
