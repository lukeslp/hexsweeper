<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Comet Void — Hexsweeper Lab</title>
<link rel="stylesheet" href="../skin-chrome.css">
<style>

:root {
  --bg-color: #000000;
  --text-main: #f5e0b0;
  --text-sub: rgba(181,156,24,0.55);
  --nav-bg: #1b0a03;
  --nav-ink: #f5e0b0;
}
body {
  font-family: system-ui, sans-serif;
  background: radial-gradient(ellipse 70% 50% at 50% 60%, #401b00 0%, #140600 45%, #000 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100vh; margin: 0; overflow: hidden; user-select: none; touch-action: none;
  color: var(--text-main);
}

<body>
<div class="fx-layer" id="fx" aria-hidden="true"></div>
<nav class="skin-nav" aria-label="Skin navigation">
  <a href="../lab.html">Lab</a>
  <a href="paper-relief.html" title="Previous skin (←)">←</a>
  <a href="mycelium.html" title="Next skin (→)">→</a>
  <span class="meta"><span class="tag">particles</span> · Comet Void</span>
</nav>

<div class="canvas-container">
  <canvas id="gameCanvas"></canvas>
</div>

<div class="hud-actions" role="toolbar" aria-label="Game controls">
  <button type="button" id="reset-btn" class="hud-btn" aria-label="Reset" title="Reset">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="23 4 23 10 17 10"></polyline>
      <polyline points="1 20 1 14 7 14"></polyline>
      <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
    </svg>
  </button>
  <button type="button" id="menu-btn" class="hud-btn" aria-label="Menu" title="Menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="5" y1="7" x2="19" y2="7"></line>
      <line x1="5" y1="12" x2="15" y2="12"></line>
      <line x1="5" y1="17" x2="19" y2="17"></line>
    </svg>
  </button>
</div>

<div id="modal-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="menu-title">
  <div class="modal-content">
    <button id="close-modal-btn" class="close-btn" type="button" aria-label="Close">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
    <h2 id="menu-title" class="menu-title">Menu</h2>
    <div class="modal-row" id="run-row">
      <div class="modal-section-label">Run</div>
      <div class="menu-stats" aria-label="Score">
        <div id="stats-mines" class="stat-item visible" data-label="mines" title="Mines remaining">00</div>
        <div id="stats-time" class="stat-item visible" data-label="cleared" title="Safe cells cleared">000</div>
      </div>
    </div>
    <div class="modal-row">
      <div class="icon-label" title="Board size">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="9" height="9"></rect><rect x="13" y="2" width="9" height="9"></rect><rect x="2" y="13" width="9" height="9"></rect></svg>
      </div>
      <div class="diff-selector" id="diff-selector" role="group" aria-label="Board size">
        <button type="button" class="diff-option" data-val="easy" aria-pressed="false" title="Small · 10 mines">S</button>
        <button type="button" class="diff-option active" data-val="medium" aria-pressed="true" title="Medium · 35 mines">M</button>
        <button type="button" class="diff-option" data-val="hard" aria-pressed="false" title="Large · 80 mines">L</button>
      </div>
    </div>
    <div class="instructions-text">Tap to reveal · flag: right-click, Ctrl-click, or long-hold<br>Menu holds scores · Reset on the board · ← → skins</div>
    <nav class="menu-links" aria-label="Elsewhere">
      <a href="https://lukesteuber.com" target="_blank" rel="noopener noreferrer">Luke Steuber</a>
      <span class="menu-links-sep" aria-hidden="true">·</span>
      <a href="https://datapoems.io" target="_blank" rel="noopener noreferrer">Data Poems</a>
    </nav>
  </div>
</div>

<script src="../core.js"></script>
<script>
// keyboard prev/next
(function(){
  const prev="paper-relief.html", next="mycelium.html";
  window.addEventListener("keydown", (e) => {
    if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
    if (e.key === "ArrowLeft") location.href = prev;
    if (e.key === "ArrowRight") location.href = next;
  });
})();

// materials/shader-comet + motifs/meteor-sky
const sparks = [];
const streaks = [];
function spark(x,y,n=12){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=0.8+Math.random()*3;
    sparks.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,r:1+Math.random()*2});
  }
}
// ambient streaks
for(let i=0;i<8;i++){
  streaks.push({
    x: Math.random(), y: Math.random(),
    len: 40+Math.random()*80, speed: 0.002+Math.random()*0.004,
    ang: -0.6 - Math.random()*0.4, w: 1+Math.random()*1.5
  });
}

Hexsweeper.boot({
  theme: {
    bg:"#000", shadowLight:"#b59c18", shadowDark:"#1b0a03",
    covered:"#510e05", revealed:"#2a0a04", flag:"#b59c18",
    pressedDark:"#140600", pressedLight:"#b59c18",
    text:{1:"#f5d76e",2:"#ff8c42",3:"#ff4d4d",4:"#e8c547",5:"#ffb347",6:"#ff6b6b",mine:"#fff5d6"}
  },
  hooks: {
    onReveal(cell){ spark(cell.x, cell.y, cell.isMine?40:8); },
    beforeFrame(ctx, api){
      const s=api.state, t=s.now*0.001;
      // polar noise-ish void
      const g=ctx.createRadialGradient(s.centerX, s.centerY, 10, s.centerX, s.centerY, s.canvas.width*0.5);
      g.addColorStop(0,"rgba(81,14,5,0.35)");
      g.addColorStop(0.5,"rgba(64,27,0,0.2)");
      g.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle=g; ctx.fillRect(0,0,s.canvas.width,s.canvas.height);
      // meteor streaks
      ctx.save();
      ctx.globalCompositeOperation="lighter";
      for(const st of streaks){
        st.x += Math.cos(st.ang)*st.speed;
        st.y += Math.sin(st.ang)*st.speed;
        if(st.x<-0.2||st.y<-0.2||st.x>1.2||st.y>1.2){
          st.x = Math.random(); st.y = -0.05; 
        }
        const x=st.x*s.canvas.width, y=st.y*s.canvas.height;
        const x2=x+Math.cos(st.ang)*st.len, y2=y+Math.sin(st.ang)*st.len;
        const lg=ctx.createLinearGradient(x,y,x2,y2);
        lg.addColorStop(0,"rgba(255,200,80,0)");
        lg.addColorStop(0.7,"rgba(255,180,60,0.55)");
        lg.addColorStop(1,"rgba(255,240,200,0.9)");
        ctx.strokeStyle=lg; ctx.lineWidth=st.w; ctx.lineCap="round";
        ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x2,y2); ctx.stroke();
      }
      ctx.restore();
    },
    afterFrame(ctx, api){
      ctx.save();
      ctx.globalCompositeOperation="lighter";
      for(let i=sparks.length-1;i>=0;i--){
        const p=sparks[i];
        p.x+=p.vx; p.y+=p.vy; p.vy+=0.03; p.life-=0.02;
        if(p.life<=0){sparks.splice(i,1);continue;}
        ctx.globalAlpha=p.life;
        ctx.fillStyle="#b59c18";
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
        ctx.fillStyle="#fff5d6";
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r*0.4,0,Math.PI*2); ctx.fill();
      }
      ctx.restore();
    },
    decorateCell(ctx, cell, size){
      if(!cell.revealed){
        const scale=0.92+cell.animHover*0.05;
        const p=cell.hexPath(size,scale);
        const g=ctx.createRadialGradient(cell.x,cell.y,1,cell.x,cell.y,size);
        g.addColorStop(0,"rgba(181,156,24,0.25)");
        g.addColorStop(1,"rgba(181,156,24,0)");
        ctx.fillStyle=g; ctx.fill(p);
      }
    }
  }
});

</script>
<script data-goatcounter="https://stats.dr.eamer.dev/count"
        async src="https://stats.dr.eamer.dev/count.js"></script>
</body>
</html>
