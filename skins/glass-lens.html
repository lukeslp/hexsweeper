  --text-sub: rgba(255,255,255,0.55);
  --nav-bg: rgba(17,26,50,0.85);
  --nav-ink: #d7f7ff;
}
body {
  font-family: "Source Sans 3", system-ui, sans-serif;
  background:
    radial-gradient(ellipse 55% 40% at 28% 18%, rgba(94,231,223,0.12), transparent 70%),
    radial-gradient(ellipse 50% 45% at 78% 72%, rgba(180,144,245,0.16), transparent 70%),
    radial-gradient(ellipse 90% 70% at 48% 42%, #111a32 0%, #0b0e1a 52%, #050711 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100vh; margin: 0; overflow: hidden; user-select: none; touch-action: none;
  color: var(--text-main);
}
#lens {
  position: fixed; width: 140px; height: 140px; border-radius: 50%;
  pointer-events: none; z-index: 5;
  border: 1px solid rgba(255,255,255,0.45);
  box-shadow:
    0 0 0 1px rgba(92,217,255,0.25),
    0 12px 40px rgba(0,0,0,0.45),
    inset 0 0 30px rgba(180,144,245,0.18),
    inset 0 0 8px rgba(255,255,255,0.25);
  backdrop-filter: blur(0px) saturate(1.35) brightness(1.15);
  -webkit-backdrop-filter: blur(0px) saturate(1.35) brightness(1.15);
  background:
    radial-gradient(circle at 35% 30%, rgba(255,255,255,0.35), transparent 45%),
    radial-gradient(circle at 50% 50%, rgba(92,217,255,0.08), transparent 70%);
  transform: translate(-50%, -50%) scale(1);
  opacity: 0; transition: opacity 0.2s;
  mix-blend-mode: screen;
}
#lens.on { opacity: 1; }
.canvas-container { filter: none; }

</style>

<script>
// keyboard prev/next
(function(){
  const prev="particle-bloom.html", next="parallax-depth.html";
  window.addEventListener("keydown", (e) => {
    if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
    if (e.key === "ArrowLeft") location.href = prev;
    if (e.key === "ArrowRight") location.href = next;
  });
})();

const lens = document.createElement("div");
lens.id = "lens";
document.body.appendChild(lens);

// canvas magnifier: sample and redraw a zoomed circle each frame via offscreen
const mag = document.createElement("canvas");
const mctx = mag.getContext("2d");

Hexsweeper.boot({
  theme: {
    bg: "#0b0e1a",
    shadowLight: "rgba(255,255,255,0.5)",
    shadowDark: "rgba(11,14,26,0.72)",
    covered: "rgba(255,255,255,0.10)",
    revealed: "rgba(255,255,255,0.04)",
    flag: "#5cd9ff",
    pressedDark: "rgba(0,0,0,0.35)",
    pressedLight: "rgba(255,255,255,0.35)",
    text: {1:"#5cd9ff",2:"#a78bfa",3:"#f472b6",4:"#67e8f9",5:"#fbbf24",6:"#c4b5fd",mine:"#fff"}
  },
  hooks: {
    decorateCell(ctx, cell, size) {
      // glass rim
      const scale = 0.92 + cell.animHover * 0.05;
      const p = cell.hexPath(size, scale);
      ctx.save();
      ctx.strokeStyle = cell.revealed ? "rgba(92,217,255,0.25)" : "rgba(255,255,255,0.22)";
      ctx.lineWidth = 1;
      ctx.stroke(p);
      if (cell.animHover > 0.05) {
        ctx.globalAlpha = cell.animHover * 0.35;
        ctx.fillStyle = "rgba(180,144,245,0.35)";
        ctx.fill(p);
      }
      ctx.restore();
    },
    afterFrame(ctx, api) {
      const s = api.state;
      const px = s.pointer.x, py = s.pointer.y;
      if (!s.pointer.active) { lens.classList.remove("on"); return; }
      lens.classList.add("on");
      // position CSS lens as visual bezel
      const rect = s.canvas.getBoundingClientRect();
      const sx = rect.width / s.canvas.width;
      const sy = rect.height / s.canvas.height;
      lens.style.left = (rect.left + px * sx) + "px";
      lens.style.top = (rect.top + py * sy) + "px";

      // draw magnified snippet into the game canvas on top
      const R = 56, zoom = 1.55;
      const sw = (R * 2) / zoom;
      mag.width = R * 2; mag.height = R * 2;
      mctx.clearRect(0,0,mag.width,mag.height);
      mctx.save();
      mctx.beginPath(); mctx.arc(R,R,R-2,0,Math.PI*2); mctx.clip();
      mctx.drawImage(s.canvas, px - sw/2, py - sw/2, sw, sw, 0, 0, R*2, R*2);
      // chromatic fringe
      mctx.globalCompositeOperation = "screen";
      mctx.globalAlpha = 0.18;
      mctx.drawImage(s.canvas, px - sw/2 + 1.5, py - sw/2, sw, sw, 0, 0, R*2, R*2);
      mctx.restore();

      ctx.save();
      ctx.beginPath(); ctx.arc(px, py, R, 0, Math.PI*2); ctx.clip();
      ctx.drawImage(mag, px - R, py - R);
      ctx.restore();
      ctx.beginPath();
      ctx.arc(px, py, R, 0, Math.PI*2);
      ctx.strokeStyle = "rgba(255,255,255,0.45)";
      ctx.lineWidth = 2;
      ctx.stroke();
      // specular
      const g = ctx.createRadialGradient(px - R*0.3, py - R*0.35, 2, px, py, R);
      g.addColorStop(0, "rgba(255,255,255,0.35)");
      g.addColorStop(0.35, "rgba(255,255,255,0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(px, py, R, 0, Math.PI*2); ctx.fill();
    }
  }
});

</script>
<script data-goatcounter="https://stats.dr.eamer.dev/count"
