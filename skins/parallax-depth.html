<!DOCTYPE html>

<title>Parallax Rings — Hexsweeper Lab</title>
<link rel="stylesheet" href="../skin-chrome.css">
<style>

:root {
  --bg-color: #0c1020;
  --text-main: #e6ebff;
  --text-sub: #8b95b8;
  --nav-bg: #141a30;
  --nav-ink: #e6ebff;
}
body {
  font-family: system-ui, sans-serif;
  background: #070a14;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100vh; margin: 0; overflow: hidden; user-select: none; touch-action: none;
  color: var(--text-main);
}
#fx {
  background:
    radial-gradient(ellipse 50% 40% at 30% 30%, rgba(80,120,255,0.12), transparent 60%),
    radial-gradient(ellipse 45% 35% at 75% 65%, rgba(180,80,255,0.1), transparent 60%),
    linear-gradient(180deg, #0a0e1c, #05070f);
}
#fx::before, #fx::after {
  content: ""; position: absolute; inset: -10%;
  background-image: radial-gradient(1.5px 1.5px at 20% 30%, rgba(255,255,255,0.5), transparent),
    radial-gradient(1px 1px at 70% 60%, rgba(255,255,255,0.4), transparent),
    radial-gradient(1.2px 1.2px at 40% 80%, rgba(255,255,255,0.35), transparent),
    radial-gradient(1px 1px at 85% 20%, rgba(255,255,255,0.45), transparent);
  background-size: 100% 100%;
  animation: drift 40s linear infinite;
  opacity: 0.7;
}
#fx::after { animation-duration: 70s; animation-direction: reverse; opacity: 0.4; transform: scale(1.2); }
@keyframes drift {
  from { transform: translate3d(0,0,0); }
  to { transform: translate3d(-3%, 2%, 0); }
}

</style>
</head>
<body>
<div class="fx-layer" id="fx" aria-hidden="true"></div>
<nav class="skin-nav" aria-label="Skin navigation">
  <a href="../lab.html">Lab</a>
  <a href="../play.html" title="Main playable with themes">Play</a>
  <a href="glass-lens.html" title="Previous skin (←)">←</a>
  <a href="brass-plaque.html" title="Next skin (→)">→</a>
  <span class="meta"><span class="tag">depth</span> · Parallax Rings (lab)</span>
</nav>

<div class="canvas-container">
  <canvas id="gameCanvas"></canvas>
</div>

<div class="hud-actions" role="toolbar" aria-label="Game controls">
  <button type="button" id="reset-btn" class="hud-btn" aria-label="Reset" title="Reset">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="23 4 23 10 17 10"></polyline>
      <polyline points="1 20 1 14 7 14"></polyline>
      <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
    </svg>
  </button>
  <button type="button" id="menu-btn" class="hud-btn" aria-label="Menu" title="Menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="5" y1="7" x2="19" y2="7"></line>
      <line x1="5" y1="12" x2="15" y2="12"></line>
      <line x1="5" y1="17" x2="19" y2="17"></line>
    </svg>

</div>

<div id="modal-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="menu-title">
  <div class="modal-content">
    <button id="close-modal-btn" class="close-btn" type="button" aria-label="Close">

        <div id="stats-time" class="stat-item visible" data-label="cleared" title="Safe cells cleared">000</div>

      </div>

        <button type="button" class="diff-option active" data-val="medium" aria-pressed="true" title="Medium · 35 mines">M</button>

<script src="../core.js"></script>
<script>
// keyboard prev/next
(function(){
  const prev="glass-lens.html", next="brass-plaque.html";
  window.addEventListener("keydown", (e) => {
    if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
    if (e.key === "ArrowLeft") location.href = prev;
    if (e.key === "ArrowRight") location.href = next;
  });
})();

let ox = 0, oy = 0, tx = 0, ty = 0;
const depthOf = (ring, maxR) => (ring / Math.max(1, maxR));

Hexsweeper.boot({
  theme: {
    bg: "#0c1020", shadowLight: "rgba(180,200,255,0.35)", shadowDark: "rgba(0,0,0,0.65)",
    covered: "#1a2240", revealed: "#10162a", flag: "#ff7ab8",
    pressedDark: "rgba(0,0,0,0.5)", pressedLight: "rgba(160,180,255,0.3)",
    text: {1:"#8ab4ff",2:"#5eead4",3:"#fb7185",4:"#c4b5fd",5:"#fbbf24",6:"#f9a8d4",mine:"#fff"}
  },
  hooks: {
    usePathHitTest: true,
    sortCells(a,b) { return a.ring - b.ring || a.y - b.y; },
    beforeFrame(ctx, api) {
      const s = api.state;
      // Ring depth stays; the pointer tilt is motion, so the effects setting
      // (and OS Reduce Motion, which it follows by default) parks it at centre.
      const tilt = Hexsweeper.effectsReduced() ? 0 : 1;
      tx = (s.pointer.nx || 0) * 18 * tilt;
      ty = (s.pointer.ny || 0) * 14 * tilt;
      ox += (tx - ox) * 0.08;
      oy += (ty - oy) * 0.08;
      // reproject cell centers with depth parallax
      const maxR = s.mapRadius;
      s.map.forEach(cell => {
        const d = depthOf(cell.ring, maxR); // 0 center → 1 edge
        const baseX = s.canvas.width/2 + s.cellSize * Math.sqrt(3) * (cell.q + cell.r/2);
        const baseY = s.canvas.height/2 + s.cellSize * 1.5 * cell.r;
        // outer rings move more (foreground)
        const mult = 0.35 + d * 1.1;
        cell.x = baseX + ox * mult;
        cell.y = baseY + oy * mult + d * 6; // slight Y stack
        // scale hint
        cell._depthScale = 0.88 + d * 0.14;
      });
      // ground shadow plate
      ctx.save();
      ctx.translate(ox*0.2, oy*0.2 + 18);
      ctx.fillStyle = "rgba(0,0,0,0.25)";
      ctx.beginPath();
      ctx.ellipse(s.canvas.width/2, s.canvas.height/2 + s.mapRadius*s.cellSize*0.9, s.mapRadius*s.cellSize*1.6, s.mapRadius*s.cellSize*0.55, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    },
    drawCell(ctx, cell, size, api) {
      const s = api.state;
      const T = s.theme;
      const scale = (cell._depthScale || 1) * (0.92 + cell.animHover * 0.06);
      const path = cell.hexPath(size, scale);
      // elevation shadow
      ctx.save();
      ctx.translate(0, 3 + cell.ring * 0.6);
      ctx.globalAlpha = 0.25 + cell.ring * 0.03;
      ctx.fillStyle = "#000";
      ctx.fill(path);
      ctx.restore();

      const d = cell.ring / Math.max(1, s.mapRadius);
      const base = cell.revealed ? 28 : 40;
      const col = `hsl(${230 - d*30} ${40+d*20}% ${base + cell.animHover*8}%)`;
      ctx.fillStyle = col;
      ctx.fill(path);

      ctx.strokeStyle = cell.revealed ? "rgba(120,160,255,0.2)" : "rgba(200,220,255,0.25)";
      ctx.lineWidth = 1.5;
      ctx.stroke(path);

      // top light edge
      ctx.save();
      ctx.globalAlpha = 0.35 * (1 - cell.animReveal);
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      const ds = size * scale;
      for (let i=3;i<=5;i++){
        const ang = Math.PI/180*(30+60*i);
        const vx = cell.x + ds*Math.cos(ang), vy = cell.y + ds*Math.sin(ang);
        if (i===3) ctx.moveTo(vx,vy); else ctx.lineTo(vx,vy);
      }
      ctx.stroke();
      ctx.restore();

      if (cell.animReveal > 0.1) {
        ctx.globalAlpha = cell.animReveal;
        if (cell.isMine) {
          ctx.fillStyle = T.text.mine;
          ctx.beginPath(); ctx.arc(cell.x, cell.y, size*0.35, 0, Math.PI*2); ctx.fill();
        } else if (cell.neighborMines > 0) {
          ctx.fillStyle = T.text[cell.neighborMines] || "#fff";
          ctx.font = `700 ${size*0.95}px system-ui,sans-serif`;
          ctx.textAlign = "center"; ctx.textBaseline = "middle";
          ctx.fillText(cell.neighborMines, cell.x, cell.y + size*0.05);
        }
        ctx.globalAlpha = 1;
      }
      if (cell.flagged && !cell.revealed) {
        ctx.fillStyle = T.flag;
        ctx.font = `bold ${size}px sans-serif`;
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("!", cell.x, cell.y + size*0.1);
      }
    }
  }
});

</script>
<script data-goatcounter="https://stats.dr.eamer.dev/count"
        async src="https://stats.dr.eamer.dev/count.js"></script>
</body>
</html>
