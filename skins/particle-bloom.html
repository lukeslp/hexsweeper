<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Particle Bloom — Hexsweeper Lab</title>
<link rel="stylesheet" href="../skin-chrome.css">
<style>

:root {
  --bg-color: #0f1218;
  --text-main: #e8eef8;
  --text-sub: #7a879c;
  --nav-bg: #161b24;
  --nav-ink: #e8eef8;
}
body {
  font-family: "Segoe UI", system-ui, sans-serif;
  background:
    radial-gradient(ellipse 80% 60% at 50% 40%, #1a2233 0%, #0b0e14 70%),
    #0b0e14;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100vh; margin: 0; overflow: hidden; user-select: none; touch-action: none;
  color: var(--text-main);
}
.modal-content { border-color: #5b8def; }

</style>
</head>
<body>
<div class="fx-layer" id="fx" aria-hidden="true"></div>
<nav class="skin-nav" aria-label="Skin navigation">
  <a href="../lab.html">Lab</a>
  <a href="../classic.html" title="Previous skin (←)">←</a>
  <a href="glass-lens.html" title="Next skin (→)">→</a>
  <span class="meta"><span class="tag">particles</span> · Particle Bloom</span>
</nav>

<div class="canvas-container">
  <canvas id="gameCanvas"></canvas>
</div>

<div class="hud-actions" role="toolbar" aria-label="Game controls">
  <button type="button" id="reset-btn" class="hud-btn" aria-label="Reset" title="Reset">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="23 4 23 10 17 10"></polyline>
      <polyline points="1 20 1 14 7 14"></polyline>
      <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
    </svg>
  </button>
  <button type="button" id="menu-btn" class="hud-btn" aria-label="Menu" title="Menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <line x1="5" y1="7" x2="19" y2="7"></line>
      <line x1="5" y1="12" x2="15" y2="12"></line>
      <line x1="5" y1="17" x2="19" y2="17"></line>
    </svg>
  </button>
</div>

<div id="modal-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="menu-title">
  <div class="modal-content">
    <button id="close-modal-btn" class="close-btn" type="button" aria-label="Close">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
    <h2 id="menu-title" class="menu-title">Menu</h2>
    <div class="modal-row" id="run-row">
      <div class="modal-section-label">Run</div>
      <div class="menu-stats" aria-label="Score">
        <div id="stats-mines" class="stat-item visible" data-label="mines" title="Mines remaining">00</div>
        <div id="stats-time" class="stat-item visible" data-label="cleared" title="Safe cells cleared">000</div>
      </div>
    </div>
    <div class="modal-row">
      <div class="icon-label" title="Board size">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="9" height="9"></rect><rect x="13" y="2" width="9" height="9"></rect><rect x="2" y="13" width="9" height="9"></rect></svg>
      </div>
      <div class="diff-selector" id="diff-selector" role="group" aria-label="Board size">
        <button type="button" class="diff-option" data-val="easy" aria-pressed="false" title="Small · 10 mines">S</button>
        <button type="button" class="diff-option active" data-val="medium" aria-pressed="true" title="Medium · 35 mines">M</button>
        <button type="button" class="diff-option" data-val="hard" aria-pressed="false" title="Large · 80 mines">L</button>
      </div>
    </div>
    <div class="instructions-text">Tap to reveal · flag: right-click, Ctrl-click, or long-hold<br>Menu holds scores · Reset on the board · ← → skins</div>
    <nav class="menu-links" aria-label="Elsewhere">
      <a href="https://lukesteuber.com" target="_blank" rel="noopener noreferrer">Luke Steuber</a>
      <span class="menu-links-sep" aria-hidden="true">·</span>
      <a href="https://datapoems.io" target="_blank" rel="noopener noreferrer">Data Poems</a>
    </nav>
  </div>
</div>

<script src="../core.js"></script>
<script>
// keyboard prev/next
(function(){
  const prev="../classic.html", next="glass-lens.html";
  window.addEventListener("keydown", (e) => {
    if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
    if (e.key === "ArrowLeft") location.href = prev;
    if (e.key === "ArrowRight") location.href = next;
  });
})();

const particles = [];
function emit(x, y, n, color) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 0.4 + Math.random() * 2.2;
    particles.push({
      x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 0.4,
      life: 1, decay: 0.012 + Math.random()*0.02,
      r: 1.2 + Math.random()*2.4, color
    });
  }
}
// ambient dust
for (let i = 0; i < 80; i++) {
  particles.push({
    x: Math.random()*800, y: Math.random()*600,
    vx: (Math.random()-0.5)*0.15, vy: -0.05 - Math.random()*0.12,
    life: 0.3 + Math.random()*0.7, decay: 0,
    r: 0.6 + Math.random()*1.4, color: "rgba(160,190,255,0.35)", ambient: true
  });
}

Hexsweeper.boot({
  theme: {
    bg: "#0f1218", shadowLight: "rgba(120,160,255,0.45)", shadowDark: "rgba(0,0,0,0.55)",
    covered: "#1a2334", revealed: "#121820", flag: "#ff6b8a",
    pressedDark: "rgba(0,0,0,0.5)", pressedLight: "rgba(140,180,255,0.35)",
    text: {1:"#7eb6ff",2:"#5eead4",3:"#fb7185",4:"#c4b5fd",5:"#fbbf24",6:"#f9a8d4",mine:"#f8fafc"}
  },
  hooks: {
    onReveal(cell) {
      const c = cell.isMine ? "rgba(255,100,120,0.9)" : "rgba(140,190,255,0.85)";
      emit(cell.x, cell.y, cell.isMine ? 28 : 10 + cell.neighborMines*2, c);
    },
    onFlag(cell) {
      if (cell.flagged) emit(cell.x, cell.y, 8, "rgba(255,107,138,0.8)");
    },
    beforeFrame(ctx, api) {
      const s = api.state;
      // soft vignette under board
      const g = ctx.createRadialGradient(s.centerX, s.centerY, 20, s.centerX, s.centerY, Math.max(s.canvas.width, s.canvas.height)*0.55);
      g.addColorStop(0, "rgba(40,70,140,0.12)");
      g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g;
      ctx.fillRect(0,0,s.canvas.width,s.canvas.height);
    },
    afterFrame(ctx, api) {
      const s = api.state;
      // reseed ambient if needed
      for (const p of particles) {
        if (p.ambient) {
          p.x += p.vx; p.y += p.vy;
          if (p.y < -10) { p.y = s.canvas.height + 10; p.x = Math.random()*s.canvas.width; }
          if (p.x < -10) p.x = s.canvas.width + 10;
          if (p.x > s.canvas.width + 10) p.x = -10;
        } else {
          p.x += p.vx; p.y += p.vy; p.vy += 0.02; p.life -= p.decay;
        }
      }
      for (let i = particles.length - 1; i >= 0; i--) {
        if (!particles[i].ambient && particles[i].life <= 0) particles.splice(i,1);
      }
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      for (const p of particles) {
        ctx.globalAlpha = p.ambient ? p.life : Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    }
  }
});

</script>
<script data-goatcounter="https://stats.dr.eamer.dev/count"
        async src="https://stats.dr.eamer.dev/count.js"></script>
</body>
</html>
