<!DOCTYPE html>
<!--
  File Purpose: Shared web/native Hexsweeper launcher.
  Primary Functions/Classes: three mode hexes, centered Resume, last-used launch URLs.
  Inputs: pointer/keyboard, saved runs/preferences. Outputs: game links.
  A11y: native links, visible focus, live status, reduced motion, forced colors, noscript fallback.
  Author: Luke Steuber <luke@lukesteuber.com>
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hexsweeper</title>
<meta name="description" content="Choose Infinite, Classic, or Sphere Hexsweeper. Resume waits in the center.">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root {
    --font-ui: "IBM Plex Sans", system-ui, sans-serif;
    --field: #e8eef5;
    --field-glow: #f8fafc;
    --ink: #263240;
    --muted: #68798c;
    --focus: #246da0;
    --infinite-accent: #246da0;
    --classic-accent: #16794f;
    --sphere-accent: #724ab5;
    --glass: rgba(248, 250, 252, .78);
    --glass-edge: rgba(115, 131, 151, .36);
    --shadow: rgba(77, 94, 114, .2);
    --hex-size: clamp(46px, 10.2vmin, 70px);
    --hex-gap: 1.08;
    color-scheme: light dark;
  }
  :root[data-appearance="dark"] {
    --field: #0c1118;
    --field-glow: #18212d;
    --ink: #edf3fb;
    --muted: #a8b6c7;
    --focus: #78c5f4;
    --infinite-accent: #78c5f4;
    --classic-accent: #20a873;
    --sphere-accent: #aa83e8;
    --glass: rgba(17, 24, 33, .78);
    --glass-edge: rgba(168, 182, 199, .28);
    --shadow: rgba(0, 0, 0, .42);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body, main, .launcher { width: 100%; height: 100%; }
  body {
    margin: 0;
    min-width: 280px;
    overflow: hidden;
    overscroll-behavior: none;
    font-family: var(--font-ui);
    color: var(--ink);
    background: var(--field);
    -webkit-text-size-adjust: 100%;
  }
  .launcher {
    position: fixed;
    inset: 0;
    isolation: isolate;
    overflow: hidden;
    background:
      radial-gradient(68% 54% at 50% 48%, color-mix(in srgb, var(--field-glow) 40%, transparent), transparent 76%),
      var(--field);
  }

  .masthead {
    position: fixed;
    z-index: 10;
    left: 50%;
    top: max(16px, calc(env(safe-area-inset-top) + 10px));
    width: min(28rem, calc(100vw - 40px));
    transform: translateX(-50%);
    display: grid;
    justify-items: center;
    gap: 4px;
    pointer-events: none;
    text-align: center;
  }
  .brand {
    margin: 0;
    font-size: clamp(1.08rem, 4.7vw, 1.42rem);
    font-weight: 700;
    letter-spacing: .065em;
    line-height: 1;
    text-transform: uppercase;
    text-shadow: 0 2px 12px var(--field);
  }
  .hint {
    margin: 0;
    color: var(--muted);
    font-size: clamp(.74rem, 3vw, .88rem);
    font-weight: 600;
    line-height: 1.25;
    letter-spacing: .015em;
    text-wrap: balance;
  }

  .triad {
    position: absolute;
    left: 50%;
    top: 54%;
    width: 0;
    height: 0;
    transform: rotate(30deg);
  }

  .hex {
    --accent: var(--focus);
    --x: calc(var(--hex-size) * 1.73205 * var(--hex-gap) * (var(--q) + var(--r) / 2));
    --y: calc(var(--hex-size) * 1.5 * var(--hex-gap) * var(--r));
    position: absolute;
    left: var(--x);
    top: var(--y);
    width: calc(var(--hex-size) * 1.73205);
    height: calc(var(--hex-size) * 2);
    min-width: 44px;
    min-height: 44px;
    transform: translate(-50%, -50%) rotate(-30deg);
    display: grid;
    place-items: center;
    padding: 0;
    border: 0;
    color: var(--ink);
    background: color-mix(in srgb, var(--accent) 16%, var(--glass));
    text-decoration: none;
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    cursor: pointer;
    outline: none;
    -webkit-user-select: none;
    user-select: none;
    filter: drop-shadow(0 8px 18px var(--shadow));
    transition: transform 160ms ease, filter 160ms ease, background 160ms ease;
  }
  .hex::before {
    content: "";
    position: absolute;
    inset: 5px;
    clip-path: inherit;
    background: color-mix(in srgb, var(--accent) 8%, transparent);
  }
  .hex:hover {
    background: color-mix(in srgb, var(--accent) 24%, var(--glass));
    transform: translate(-50%, -50%) rotate(-30deg) scale(1.03);
  }
  .hex:focus-visible {
    background: color-mix(in srgb, var(--accent) 28%, var(--glass));
    filter: drop-shadow(0 0 10px color-mix(in srgb, var(--accent) 70%, transparent));
  }
  .hex:focus-visible::before {
    outline: 3px solid var(--accent);
    outline-offset: -4px;
  }
  .hex-content {
    position: relative;
    z-index: 1;
    display: grid;
    justify-items: center;
    gap: 1px;
    width: 86%;
    text-align: center;
    text-shadow: 0 1px 6px var(--field);
  }
  .hex-icon {
    width: calc(var(--hex-size) * .46);
    height: calc(var(--hex-size) * .46);
    max-width: 28px;
    max-height: 28px;
    color: var(--accent);
  }
  .hex-name {
    font-size: clamp(.8rem, calc(var(--hex-size) * .34), 1.08rem);
    font-weight: 700;
    line-height: .98;
    letter-spacing: -.018em;
  }
  .hex-note {
    color: currentColor;
    opacity: .62;
    font-size: clamp(.56rem, calc(var(--hex-size) * .22), .72rem);
    font-weight: 600;
    line-height: .98;
    letter-spacing: .015em;
  }
  .mode-infinite { --accent: var(--infinite-accent); }
  .mode-classic { --accent: var(--classic-accent); }
  .mode-sphere { --accent: var(--sphere-accent); }
  .resume {
    z-index: 3;
    background: color-mix(in srgb, var(--accent) 28%, var(--glass));
    filter: drop-shadow(0 0 12px color-mix(in srgb, var(--accent) 46%, transparent));
  }
  .resume[data-mode="infinite"] { --accent: var(--infinite-accent); }
  .resume[data-mode="bounded"] { --accent: var(--classic-accent); }
  .resume[data-mode="sphere"] { --accent: var(--sphere-accent); }
  .resume[hidden] { display: none; }
  .seat {
    z-index: 0;
    pointer-events: none;
    background: color-mix(in srgb, var(--muted) 10%, transparent);
    filter: none;
    box-shadow: none;
  }
  .seat::before { background: transparent; }
  .launcher.has-resume .seat { visibility: hidden; }
  .is-launching { opacity: .45; }

  @media (max-width: 430px) {
    :root { --hex-size: clamp(42px, 20vw, 54px); --hex-gap: 1.04; }
  }
  @media (max-height: 480px) and (orientation: landscape) {
    :root { --hex-size: clamp(40px, 14vmin, 56px); }
    .masthead {
      left: max(16px, calc(env(safe-area-inset-left) + 10px));
      top: max(12px, calc(env(safe-area-inset-top) + 8px));
      width: min(16rem, 40vw);
      transform: none;
      justify-items: start;
      text-align: left;
    }
    .triad { left: 58%; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: .01ms !important;
      animation-duration: .01ms !important;
    }
  }
  @media (forced-colors: active) {
    .launcher { background: Canvas; }
    .hex { color: ButtonText; background: Canvas; filter: none; }
    .hex::before { outline: 2px solid ButtonText; outline-offset: -4px; }
    .hex:focus-visible::before { outline: 4px solid Highlight; }
    .brand, .hint, .hex-icon { color: CanvasText; text-shadow: none; }
  }
</style>

<meta property="og:image" content="https://dr.eamer.dev/games/hexsweeper/assets/social/home-og.png">

<body>
<main>
  <section class="launcher" id="launcher" aria-labelledby="launcher-title">
    <header class="masthead">
      <h1 class="brand" id="launcher-title">Hexsweeper</h1>
      <p class="hint" id="launcher-status" role="status" aria-live="polite">Choose a board</p>
    </header>

    <nav class="triad" id="preset-layer" aria-label="Game modes">
      <a class="hex mode mode-infinite" id="infinite-game" href="infinite.html?mode=light&amp;fresh=1" data-mode="infinite" data-branch="infinite" data-q="0" data-r="-1" style="--q:0;--r:-1" aria-label="Play Infinite Hexsweeper">
        <span class="hex-content">
          <svg class="hex-icon" viewBox="0 0 48 48" aria-hidden="true"><path d="M6 24c0-5.4 3.7-9.5 9-9.5 8.3 0 10.6 19 18 19 5.3 0 9-4.1 9-9.5s-3.7-9.5-9-9.5c-7.4 0-9.7 19-18 19-5.3 0-9-4.1-9-9.5Z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="hex-name">Infinite</span>
          <span class="hex-note" id="infinite-mode-current">Light</span>
        </span>
      </a>
      <a class="hex mode mode-classic" id="classic-game" href="bounded.html?size=medium&amp;new=1" data-mode="bounded" data-branch="classic" data-q="1" data-r="0" style="--q:1;--r:0" aria-label="Play Classic Hexsweeper">
        <span class="hex-content">
          <svg class="hex-icon" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 5 40 14v20l-16 9-16-9V14Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M17 35V14m1 2h14l-3.4 4.3L32 25H18m-4 11h9" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="hex-name">Classic</span>
          <span class="hex-note" id="classic-mode-current">Medium</span>
        </span>
      </a>
      <a class="hex mode mode-sphere" id="sphere-game" href="index.html?theme=light&amp;fresh=1" data-mode="sphere" data-branch="sphere" data-q="-1" data-r="1" style="--q:-1;--r:1" aria-label="Play Sphere Hexsweeper">
        <span class="hex-content">
          <svg class="hex-icon" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="18" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M24 6c-7 5-9 12-9 18s2 13 9 18M24 6c7 5 9 12 9 18s-2 13-9 18M6 24h36M9 15c9 4 21 4 30 0M9 33c9-4 21-4 30 0" fill="none" stroke="currentColor" stroke-width="1" opacity=".78"/></svg>
          <span class="hex-name">Sphere</span>
          <span class="hex-note" id="sphere-mode-current">Light</span>
        </span>
      </a>
      <span class="hex seat" id="resume-seat" data-q="0" data-r="0" style="--q:0;--r:0" aria-hidden="true"></span>
      <a class="hex resume destination" id="resume-game" href="infinite.html" data-q="0" data-r="0" data-mode="infinite" style="--q:0;--r:0" aria-label="Resume Infinite Hexsweeper" hidden>
        <span class="hex-content">
          <svg class="hex-icon" viewBox="0 0 48 48" aria-hidden="true"><path d="M13 17H6v-7M7 17a18 18 0 1 1-1 15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="m21 16 14 8-14 8Z" fill="currentColor"/></svg>
          <span class="hex-name">Resume</span>
          <span class="hex-note" id="resume-mode-name">Infinite</span>
        </span>
      </a>
    </nav>
  </section>
</main>
<noscript>
<style>
.launcher-fallback{position:fixed;z-index:99;inset:0;display:grid;place-content:center;
 gap:12px;padding:24px;background:#e8eef5;color:#263240;text-align:center;
 font:600 1rem/1.4 "IBM Plex Sans",system-ui,sans-serif}
.launcher-fallback h2{margin:0 0 4px;font-size:1.3rem}
.launcher-fallback a{display:block;min-width:220px;padding:13px 18px;border:2px solid currentColor;
 border-radius:999px;color:inherit;text-decoration:none}
@media(prefers-color-scheme:dark){.launcher-fallback{background:#0c1118;color:#edf3fb}}
</style>
<nav class="launcher-fallback" aria-label="Choose a Hexsweeper board">
  <h2>Choose a board</h2>
  <a href="infinite.html">Infinite · Endless</a>
  <a href="bounded.html">Classic · Fixed</a>
  <a href="index.html">Sphere · 3D</a>
</nav>
</noscript>
<script data-goatcounter="https://stats.dr.eamer.dev/count"
        async src="https://stats.dr.eamer.dev/count.js"></script>

<script>
(function () {
  "use strict";

  var launcher = document.getElementById("launcher");
  var status = document.getElementById("launcher-status");
  var resume = document.getElementById("resume-game");
  var resumeModeName = document.getElementById("resume-mode-name");
  var infinite = document.getElementById("infinite-game");
  var classic = document.getElementById("classic-game");
  var sphere = document.getElementById("sphere-game");
  var leaving = false;
  var activeResume = null;

  var APPEARANCE_KEY = "hexsweeper-appearance-v1";
  var INFINITE_THEME_KEY = "hexsweeper-mode-v3";
  var CLASSIC_SIZE_KEY = "hexsweeper-classic-size-v1";
  var SPHERE_THEME_KEY = "hexsweeper-sphere-theme-v6";
  var appearancePreference = "system";
  var infiniteThemePreference = "light";
  var classicSizePreference = "medium";
  var sphereThemePreference = "light";
  var colorScheme = matchMedia("(prefers-color-scheme: dark)");

  function storageValue(store, storageKey) {
    try { return store.getItem(storageKey); } catch (_) { return null; }
  }
  function parseSave(raw) {
    if (!raw) return null;
    try { return JSON.parse(raw); } catch (_) { return null; }
  }
  function titleCase(value) { return value.charAt(0).toUpperCase() + value.slice(1); }
  function classicSizeLabel(size) {
    return size === "easy" ? "Small" : size === "hard" ? "Large" : "Medium";
  }
  function reducedMotion() {
    return matchMedia("(prefers-reduced-motion: reduce)").matches;
  }
  function isDark() {
    return appearancePreference === "dark" || (appearancePreference === "system" && colorScheme.matches);
  }
  function applyAppearance() {
    document.documentElement.dataset.appearance = isDark() ? "dark" : "light";
  }

  function loadPreferences() {
    var appearance = storageValue(localStorage, APPEARANCE_KEY);
    if (["system", "light", "dark"].indexOf(appearance) >= 0) appearancePreference = appearance;
    var infiniteTheme = storageValue(localStorage, INFINITE_THEME_KEY);
    if (["light", "dark"].indexOf(infiniteTheme) >= 0) infiniteThemePreference = infiniteTheme;
    var size = storageValue(localStorage, CLASSIC_SIZE_KEY);
    if (["easy", "medium", "hard"].indexOf(size) >= 0) classicSizePreference = size;
    var sphereTheme = storageValue(localStorage, SPHERE_THEME_KEY);
    if (sphereTheme) sphereThemePreference = sphereTheme;
  }

  function syncPreferences() {
    var infiniteLabel = titleCase(infiniteThemePreference);
    var classicLabel = classicSizeLabel(classicSizePreference);
    var sphereLabel = titleCase(sphereThemePreference);
    document.getElementById("infinite-mode-current").textContent = infiniteLabel;
    document.getElementById("classic-mode-current").textContent = classicLabel;
    document.getElementById("sphere-mode-current").textContent = sphereLabel;
    infinite.href = "infinite.html?mode=" + encodeURIComponent(infiniteThemePreference) + "&fresh=1";
    classic.href = "bounded.html?size=" + encodeURIComponent(classicSizePreference) + "&new=1";
    sphere.href = "index.html?theme=" + encodeURIComponent(sphereThemePreference) + "&fresh=1";
    infinite.setAttribute("aria-label", "Play Infinite, " + infiniteLabel + " style");
    classic.setAttribute("aria-label", "Play Classic, " + classicLabel + " board");
    sphere.setAttribute("aria-label", "Play Sphere, " + sphereLabel + " theme");
  }

  function infiniteResumeCandidate() {
    var data = parseSave(storageValue(localStorage, "hexsweeper-endless-plate-v1"));
    if (!data || data.v !== 1 || data.endless !== true) return null;
    if (data.first !== false || data.over !== false || Number(data.cleared) <= 0) return null;
    return { mode: "infinite", name: "Infinite", href: "infinite.html", savedAt: Number(data.savedAt) || 0 };
  }

  function classicResumeCandidate() {
    var data = parseSave(storageValue(localStorage, "hexsweeper-classic-run-v1"));
    if (!data || data.v !== 1 || data.kind !== "classic" || data.endless !== false) return null;
    if (data.first !== false || data.over !== false) return null;
    if (["easy", "medium", "hard"].indexOf(data.difficulty) < 0) return null;
    if (!Array.isArray(data.mines) || !data.mines.length || !Array.isArray(data.revealed) || !data.revealed.length || !Array.isArray(data.flagged)) return null;
    return { mode: "bounded", name: "Classic", href: "bounded.html?resume=1", savedAt: Number(data.savedAt) || 0 };
  }

  function sphereResumeCandidate() {
    var stores = [sessionStorage, localStorage];
    var keys = ["hexsweeper-sphere-run-v2", "hexsweeper-sphere-run-v1"];
    var best = null;
    stores.forEach(function (store) {
      keys.forEach(function (storageKey) {
        var data = parseSave(storageValue(store, storageKey));
        if (!data || (data.v !== 1 && data.v !== 2) || data.kind !== "sphere") return;
        if (data.over !== false || typeof data.first !== "boolean") return;
        var flagged = Array.isArray(data.flagged) ? data.flagged.length : Number(data.flags) || 0;
        if (data.first && flagged <= 0) return;
        if (!data.first && (!Array.isArray(data.mines) || data.mines.length === 0)) return;
        var candidate = { mode: "sphere", name: "Sphere", href: "index.html?resume=1", savedAt: Number(data.savedAt) || 0 };
        if (!best || candidate.savedAt >= best.savedAt) best = candidate;
      });
    });
    return best;
  }

  function refreshResume() {
    activeResume = [infiniteResumeCandidate(), classicResumeCandidate(), sphereResumeCandidate()]
      .filter(Boolean)
      .sort(function (a, b) { return b.savedAt - a.savedAt; })[0] || null;
    if (!activeResume) {
      resume.hidden = true;
      launcher.classList.remove("has-resume");
      status.textContent = "Choose a board";
      return;
    }
    resume.hidden = false;
    resume.href = activeResume.href;
    resume.dataset.mode = activeResume.mode;
    resumeModeName.textContent = activeResume.name;
    resume.setAttribute("aria-label", "Resume " + activeResume.name + " Hexsweeper");
    launcher.classList.add("has-resume");
    status.textContent = "Resume waits in the center";
  }

  function beginLaunch(control, name, href, verb) {
    if (leaving) return;
    leaving = true;
    launcher.classList.add("is-launching");
    control.classList.add("is-launching");
    status.textContent = verb + " " + name;
    setTimeout(function () { location.href = href; }, reducedMotion() ? 0 : 140);
  }

  function onModeClick(event) {
    event.preventDefault();
    var branch = event.currentTarget.dataset.branch;
    if (branch === "infinite") {
      beginLaunch(infinite, "Infinite · " + titleCase(infiniteThemePreference), infinite.href, "Opening");
      return;
    }
    if (branch === "classic") {
      beginLaunch(classic, "Classic · " + classicSizeLabel(classicSizePreference), classic.href, "Opening");
      return;
    }
    beginLaunch(sphere, "Sphere · " + titleCase(sphereThemePreference), sphere.href, "Opening");
  }

  loadPreferences();
  applyAppearance();
  syncPreferences();
  refreshResume();
  colorScheme.addEventListener("change", applyAppearance);

  infinite.addEventListener("click", onModeClick);
  classic.addEventListener("click", onModeClick);
  sphere.addEventListener("click", onModeClick);
  resume.addEventListener("click", function (event) {
    event.preventDefault();
    beginLaunch(resume, resumeModeName.textContent, resume.href, "Resuming");
  });

  addEventListener("pageshow", function () {
    leaving = false;
    launcher.classList.remove("is-launching");
    [infinite, classic, sphere, resume].forEach(function (control) {
      control.classList.remove("is-launching");
    });
    loadPreferences();
    applyAppearance();
    syncPreferences();
    refreshResume();
  });
})();
</script>
</body>
</html>
