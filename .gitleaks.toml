# File Purpose: Allowlist false-positive gitleaks hits for Hexsweeper.
# Notes: localStorage preference/save lane names are not credentials.
title = "hexsweeper"

# Keep gitleaks' built-in rules; without this the file would replace them
# with none and every scan would pass.
[extend]
useDefault = true

[allowlist]
description = "Browser storage keys and collection export mirrors"
regexes = [
  '''hexsweeper-[a-z0-9-]+-v[0-9]+''',
]
paths = [
  '''collection/theme-.*\.html''',
  '''app/www/.*\.html''',
  '''app/www-fdroid/.*\.html''',
  # The F-Droid recipe names the release key's public certificate fingerprint.
  '''fdroid/metadata/.*\.yml''',
]
