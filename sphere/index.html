<!DOCTYPE html>
<!--
  File Purpose: Experimental Hexsweeper on a closed hex sphere (Canvas projection).
  Primary Functions/Classes: SphereSweeper.boot; hexasphere geometry; dig/flag/flood.
  Inputs: hexasphere.js, sphere.js, skin-chrome.css. Outputs: standalone sphere game.
  Chrome: BR pill cluster — Reset·Size·Theme | Flag | Help; minimal first-visit help.
  Notes: Starts zoomed out. Author: Luke Steuber <luke@lukesteuber.com>
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hexagonal Minesweeper on a Sphere</title>
<meta name="description" content="Classic Minesweeper wrapped around a Goldberg sphere you rotate to dig, flag, and clear every face.">
<meta property="og:type" content="website">
<meta property="og:title" content="Hexagonal Minesweeper on a Sphere">
<meta property="og:description" content="Classic Minesweeper wrapped around a Goldberg sphere you rotate to dig, flag, and clear every face.">
<meta property="og:url" content="https://dr.eamer.dev/games/hexsweeper/sphere/">
<meta property="og:image" content="https://dr.eamer.dev/games/hexsweeper/assets/social/sphere-og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Hexagonal Minesweeper on a Sphere">
<meta name="twitter:description" content="Classic Minesweeper wrapped around a Goldberg sphere you rotate to dig, flag, and clear every face.">
<meta name="twitter:image" content="https://dr.eamer.dev/games/hexsweeper/assets/social/sphere-og.png">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../skin-chrome.css">
<style>
/* Sphere chrome tokens — pure mono dark/light via body[data-sphere-theme] */
:root,
body[data-sphere-theme="light"] {
  --bg-color: #ffffff;
  --text-main: #000000;
  --text-sub: #666666;
  --nav-bg: #f0f0f0;
  --nav-ink: #000000;
}
body[data-sphere-theme="dark"] {
  --bg-color: #000000;
  --text-main: #ffffff;
  --text-sub: #888888;
  --nav-bg: #111111;
  --nav-ink: #ffffff;
}
html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--bg-color);
  color: var(--text-main);
  font-family: "IBM Plex Sans", system-ui, sans-serif;
  user-select: none;
  touch-action: none;
}
body.help-open { overflow: hidden; }
.canvas-container {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: stretch;
  justify-content: stretch;
}
#gameCanvas {
  display: block;
  width: 100%;
  height: 100%;
  cursor: grab;
}
#gameCanvas:active { cursor: grabbing; }
.hud-stats {
  position: fixed;
  top: max(12px, env(safe-area-inset-top));
  right: max(12px, env(safe-area-inset-right));
  z-index: 40;
  display: flex;
  gap: 0.65rem;
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 0.04em;
  font-variant-numeric: tabular-nums;
  color: var(--text-sub);
  pointer-events: none;
}
.hud-stats .stat-item { color: var(--text-main); }
.sphere-banner {
  position: fixed;
  left: 50%;
  bottom: max(80px, calc(env(safe-area-inset-bottom) + 72px));
  transform: translateX(-50%) translateY(12px);
  z-index: 45;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  max-width: min(360px, calc(100vw - 32px));
  padding: 14px 18px;
  border-radius: 16px;
  background: color-mix(in srgb, var(--nav-bg) 92%, transparent);
  border: 1px solid color-mix(in srgb, var(--text-main) 20%, transparent);
  color: var(--text-main);
  font-size: 14px;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
}
.sphere-banner.visible {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
  pointer-events: auto;
}
.sphere-banner .banner-msg {
  line-height: 1.35;
}
.sphere-banner .banner-meta {
  font-size: 0.75rem;
  color: var(--text-sub);
  font-variant-numeric: tabular-nums;
}
.sphere-banner .banner-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
}
.sphere-banner .banner-btn {
  appearance: none;
  border: 1px solid color-mix(in srgb, var(--text-main) 22%, transparent);
  background: color-mix(in srgb, var(--text-main) 8%, transparent);
  color: var(--text-main);
  border-radius: 999px;
  padding: 8px 14px;
  font: 600 0.8rem/1 "IBM Plex Sans", system-ui, sans-serif;
  cursor: pointer;
}
.sphere-banner .banner-btn.primary {
  background: var(--text-main);
  color: var(--bg-color);
  border-color: transparent;
}
.sphere-banner .banner-btn:focus-visible {
  outline: 2px solid color-mix(in srgb, var(--text-main) 55%, transparent);
  outline-offset: 2px;
}
.sphere-banner .banner-btn:disabled {
  opacity: 0.55;
  cursor: wait;
}
.hud-cluster {
  position: fixed;
  right: max(12px, env(safe-area-inset-right));
  bottom: max(14px, env(safe-area-inset-bottom));
  z-index: 50;
  display: flex;
  flex-direction: row;
  gap: 8px;
  align-items: center;
  pointer-events: none;
}
.hud-cluster .hud-actions {
  position: static;
  pointer-events: auto;
  background: color-mix(in srgb, var(--nav-bg) 52%, transparent);
  border: 1px solid color-mix(in srgb, var(--text-main) 12%, transparent);
}
.hud-btn.active {
  background: color-mix(in srgb, var(--text-main) 14%, transparent);
  opacity: 1;
}
#flag-toggle.active { color: #ff0000; }
body[data-sphere-theme="light"] #flag-toggle.active { color: #ff0000; }
/* Board size: plain S/M/L letter (scaled) — readable at a glance when static */
#size-btn .size-mark {
  display: block;
  font-family: "IBM Plex Sans", system-ui, sans-serif;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  letter-spacing: 0.02em;
  user-select: none;
}
#size-btn .size-mark[data-size="S"] { font-size: 14px; }
#size-btn .size-mark[data-size="M"] { font-size: 17px; }
#size-btn .size-mark[data-size="L"] { font-size: 20px; }
/* Count-style btn — morphing icon per mode */
#nest-btn .count-mark {
  display: block;
  font-family: "IBM Plex Sans", system-ui, sans-serif;
  font-weight: 700;
  font-size: 15px;
  line-height: 1;
  user-select: none;
}
#nest-btn.active { opacity: 1; }
/* Count-style toast — above BR chrome */
.count-style-toast {
  position: fixed;
  bottom: max(72px, calc(env(safe-area-inset-bottom, 0px) + 64px));
  left: 50%;
  z-index: 28;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-main);
  background: color-mix(in srgb, var(--nav-bg) 55%, transparent);
  backdrop-filter: blur(14px);
  padding: 8px 14px;
  border-radius: 999px;
  opacity: 0;
  transform: translate(-50%, -6px);
  pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s ease;
}
.count-style-toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}
/* Minimal help — mono chrome; classic Minesweeper tile is the only color */
.help-overlay {
  position: fixed;
  inset: 0;
  z-index: 110;
  background: color-mix(in srgb, var(--bg-color) 78%, transparent);
  backdrop-filter: blur(6px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.25rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
}
.help-overlay.open { opacity: 1; pointer-events: auto; }
.help-panel {
  width: min(280px, 100%);
  background: var(--nav-bg);
  color: var(--text-main);
  border: 1px solid color-mix(in srgb, var(--text-main) 12%, transparent);
  border-radius: 14px;
  padding: 1rem 1rem 0.9rem;
  position: relative;
  box-shadow: 0 12px 36px rgba(0,0,0,0.28);
  text-align: center;
}
.help-close {
  position: absolute;
  top: 0.4rem;
  right: 0.4rem;
  width: 1.85rem;
  height: 1.85rem;
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  border-radius: 999px;
  background: transparent;
  color: var(--text-sub);
  font-size: 1.25rem;
  line-height: 1;
  cursor: pointer;
}
.help-close:hover,
.help-close:focus-visible {
  color: var(--text-main);
  background: color-mix(in srgb, var(--text-main) 8%, transparent);
  outline: none;
}
.help-panel h2 {
  font-size: 1rem;
  margin: 0 1.5rem 0.45rem 0;
  letter-spacing: -0.02em;
  text-align: left;
}
.help-lede {
  margin: 0 0 0.85rem;
  font-size: 0.8rem;
  line-height: 1.4;
  color: var(--text-sub);
  text-align: left;
}
.help-lede kbd {
  font-family: ui-monospace, monospace;
  font-size: 0.85em;
  border: 1px solid color-mix(in srgb, var(--text-main) 22%, transparent);
  border-radius: 4px;
  padding: 0.05em 0.3em;
}
.help-history {
  display: block;
  width: 100%;
  margin: 0 0 0.75rem;
  padding: 0;
  border: none;
  border-radius: 8px;
  overflow: hidden;
  cursor: pointer;
  background: #000;
  line-height: 0;
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--text-main) 16%, transparent);
}
.help-history:focus-visible {
  outline: 2px solid var(--text-main);
  outline-offset: 2px;
}
.help-history img {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 4 / 3;
  object-fit: cover;
  object-position: center top;
}
.help-history-cap {
  margin: 0 0 0.85rem;
  font-size: 0.72rem;
  line-height: 1.35;
  color: var(--text-sub);
  text-align: left;
}
.help-history-cap a {
  color: var(--text-main);
  text-decoration: underline;
  text-underline-offset: 0.12em;
}
.help-modes {
  margin: 0 0 0.75rem;
  font-size: 0.72rem;
  color: var(--text-sub);
  text-align: left;
}
.help-modes a {
  color: var(--text-main);
  text-decoration: none;
}
.help-modes a:hover { text-decoration: underline; }
.help-done {
  appearance: none;
  width: 100%;
  border: 1px solid color-mix(in srgb, var(--text-main) 18%, transparent);
  border-radius: 10px;
  padding: 0.5rem 0.75rem;
  background: color-mix(in srgb, var(--text-main) 8%, transparent);
  color: var(--text-main);
  font: inherit;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
}
.help-done:hover,
.help-done:focus-visible {
  background: color-mix(in srgb, var(--text-main) 12%, transparent);
  outline: none;
}
.menu-links {
  margin-top: 0.7rem;
  text-align: center;
  font-size: 0.68rem;
}
.menu-links a {
  color: var(--text-sub);
  text-decoration: none;
}
.menu-links a:hover { color: var(--text-main); }
.menu-links-sep { opacity: 0.45; margin: 0 0.3rem; }
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 130;
  background: rgba(0,0,0,0.82);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.25rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s ease;
}
.lightbox.open { opacity: 1; pointer-events: auto; }
.lightbox img {
  max-width: min(920px, 100%);
  max-height: min(88vh, 100%);
  border-radius: 6px;
  box-shadow: 0 16px 48px rgba(0,0,0,0.5);
}
.lightbox-close {
  position: absolute;
  top: max(12px, env(safe-area-inset-top));
  right: max(12px, env(safe-area-inset-right));
  width: 2.25rem;
  height: 2.25rem;
  border: none;
  border-radius: 999px;
  background: rgba(255,255,255,0.12);
  color: #fff;
  font-size: 1.4rem;
  cursor: pointer;
}
.lightbox-close:hover,
.lightbox-close:focus-visible {
  background: rgba(255,255,255,0.22);
  outline: none;
}
@media (prefers-reduced-motion: reduce) {
  .sphere-banner,
  .help-overlay,
  .lightbox,
  .count-style-toast { transition: none; }
}
</style>
</head>
<body data-sphere-theme="light">
<div class="canvas-container">
  <canvas id="gameCanvas" aria-label="Hex sphere minesweeper board"></canvas>
</div>

<div class="hud-stats" aria-live="polite">
  <span><span class="stat-item" id="stats-mines">00</span> left</span>
  <span><span class="stat-item" id="stats-time">000</span>s</span>
</div>

<div id="sphere-banner" class="sphere-banner" role="status" hidden>
  <div class="banner-msg" id="banner-msg"></div>
  <div class="banner-meta" id="banner-meta" hidden></div>
  <div class="banner-actions" id="banner-actions" hidden>
    <button type="button" class="banner-btn primary" id="share-win-btn">Share image</button>
    <button type="button" class="banner-btn" id="banner-again-btn">Play again</button>
  </div>
</div>

<div class="hud-cluster" role="toolbar" aria-label="Game controls">
  <div class="hud-actions" aria-label="Board controls">
    <button type="button" id="reset-btn" class="hud-btn" aria-label="Reset" title="Reset (R)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="23 4 23 10 17 10"></polyline>
        <polyline points="1 20 1 14 7 14"></polyline>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
      </svg>
    </button>
    <button type="button" id="size-btn" class="hud-btn" aria-label="Board size M, Medium, 1002 faces. Activate to cycle small, medium, large." title="Board size M — Medium (1002 faces). Click to cycle S → M → L.">
      <span class="size-mark" data-size="M" aria-hidden="true">M</span>
    </button>
    <button type="button" id="theme-btn" class="hud-btn" aria-label="Theme: Light" title="Theme — Light">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="5"></circle>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
      </svg>
    </button>
    <button type="button" id="nest-btn" class="hud-btn" aria-label="Count style: Numerals. Activate to cycle." title="Count style — Numerals (N)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><text x="12" y="16" text-anchor="middle" font-family="IBM Plex Sans,system-ui,sans-serif" font-size="13" font-weight="700" fill="currentColor" stroke="none">1</text></svg>
    </button>
  </div>
  <div class="hud-actions" aria-label="Flag mode">
    <button type="button" id="flag-toggle" class="hud-btn" aria-label="Flag mode" aria-pressed="false" title="Flag mode (F)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
        <line x1="4" y1="22" x2="4" y2="15"></line>
      </svg>
    </button>
  </div>
  <div class="hud-actions" aria-label="Help">
    <button type="button" id="help-btn" class="hud-btn" aria-label="Help" title="Help (?)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
    </button>
  </div>
</div>

<div id="count-style-toast" class="count-style-toast" role="status" aria-live="polite"></div>

<div id="help-overlay" class="help-overlay" role="dialog" aria-modal="true" aria-labelledby="help-title" hidden>
  <div class="help-panel" id="help-panel" tabindex="-1">
    <button type="button" class="help-close" id="help-close-btn" aria-label="Close help">×</button>
    <h2 id="help-title">Hex Sphere</h2>
    <p class="help-lede">Dig and flag on a closed hex sphere.<br>Six neighbors · first dig is safe · drag to spin · progress autosaves.<br><kbd>N</kbd> cycles count styles (numerals · rings · yellow · flush · borderless).</p>
    <button type="button" class="help-history" id="help-history-btn" aria-label="Open classic Minesweeper screenshot">
      <img src="assets/classic-minesweeper.png" alt="Classic Windows Minesweeper" width="320" height="240" loading="lazy">
    </button>
    <p class="help-history-cap">
      <a href="https://www.coolmathgames.com/blog/the-history-of-minesweeper" target="_blank" rel="noopener noreferrer">The history of Minesweeper</a>
    </p>
    <p class="help-modes">Also try <a href="../?mode=fire">Fire</a> · <a href="../?mode=plague">Plague</a></p>
    <button type="button" class="help-done" id="help-done-btn">Done</button>
    <nav class="menu-links" aria-label="Elsewhere">
      <a href="https://lukesteuber.com" rel="noopener noreferrer">lukesteuber.com</a>
      <span class="menu-links-sep" aria-hidden="true">·</span>
      <a href="https://datapoems.io" rel="noopener noreferrer">datapoems.io</a>
    </nav>
  </div>
</div>

<div id="history-lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Classic Minesweeper" hidden>
  <button type="button" class="lightbox-close" id="lightbox-close-btn" aria-label="Close">×</button>
  <img src="assets/classic-minesweeper.png" alt="Classic Windows Minesweeper on the Bliss desktop">
</div>

<script src="hexasphere.js?v=20260806s"></script>
<script src="sphere.js?v=20260806s"></script>
<script>
SphereSweeper.boot({ canvasId: "gameCanvas" });
(function () {
  const lb = document.getElementById("history-lightbox");
  const openBtn = document.getElementById("help-history-btn");
  const closeBtn = document.getElementById("lightbox-close-btn");
  if (!lb || !openBtn) return;
  function openLb() {
    lb.hidden = false;
    requestAnimationFrame(() => lb.classList.add("open"));
    closeBtn && closeBtn.focus();
  }
  function closeLb() {
    lb.classList.remove("open");
    setTimeout(() => { lb.hidden = true; }, 180);
    openBtn.focus();
  }
  openBtn.addEventListener("click", openLb);
  closeBtn && closeBtn.addEventListener("click", closeLb);
  lb.addEventListener("click", (e) => { if (e.target === lb) closeLb(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && lb.classList.contains("open")) {
      e.stopPropagation();
      closeLb();
    }
  });
})();
</script>
</body>
</html>
