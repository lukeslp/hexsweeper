<!DOCTYPE html>
<!--
  File Purpose: Experimental Hexsweeper on a closed hex sphere (Canvas projection).
  Primary Functions/Classes: SphereSweeper.boot; hexasphere geometry; dig/flag/flood.
  Inputs: hexasphere.js, sphere.js, skin-chrome.css. Outputs: standalone sphere game.
  Chrome: BR pill cluster — Reset·Size·Theme | Flag | Help; first-visit instructions modal.
  Author: Luke Steuber <luke@lukesteuber.com>
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hex Sphere — Hexsweeper (experimental)</title>
<meta name="description" content="Hexagonal minesweeper on a closed Goldberg sphere. Drag to rotate; dig, flag, and clear the geodesic board.">
<meta property="og:type" content="website">
<meta property="og:title" content="Hex Sphere — Hexsweeper">
<meta property="og:description" content="Hexagonal minesweeper on a closed Goldberg sphere. Drag to rotate; dig, flag, and clear the geodesic board.">
<meta property="og:url" content="https://dr.eamer.dev/games/hexsweeper/sphere/">
<meta property="og:image" content="https://dr.eamer.dev/games/hexsweeper/assets/social/sphere-og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Hex Sphere — Hexsweeper">
<meta name="twitter:description" content="Hexagonal minesweeper on a closed Goldberg sphere. Drag to rotate; dig, flag, and clear the geodesic board.">
<meta name="twitter:image" content="https://dr.eamer.dev/games/hexsweeper/assets/social/sphere-og.png">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../skin-chrome.css">
<style>
/* Sphere chrome tokens — pure mono dark/light via body[data-sphere-theme] */
:root,
body[data-sphere-theme="light"] {
  --bg-color: #ffffff;
  --text-main: #000000;
  --text-sub: #666666;
  --nav-bg: #f0f0f0;
  --nav-ink: #000000;
}
body[data-sphere-theme="dark"] {
  --bg-color: #000000;
  --text-main: #ffffff;
  --text-sub: #888888;
  --nav-bg: #111111;
  --nav-ink: #ffffff;
}
html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--bg-color);
  color: var(--text-main);
  font-family: "IBM Plex Sans", system-ui, sans-serif;
  user-select: none;
  touch-action: none;
}
body.help-open { overflow: hidden; }
.canvas-container {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: stretch;
  justify-content: stretch;
}
#gameCanvas {
  display: block;
  width: 100%;
  height: 100%;
  cursor: grab;
}
#gameCanvas:active { cursor: grabbing; }
.sphere-stats {
  position: fixed;
  top: max(12px, env(safe-area-inset-top));
  right: max(12px, env(safe-area-inset-right));
  z-index: 35;
  display: flex;
  gap: 14px;
  pointer-events: none;
  padding: 6px 12px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--nav-bg) 52%, transparent);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid color-mix(in srgb, var(--text-main) 12%, transparent);
}
.sphere-stats .stat-item { opacity: 1; min-width: 36px; font-size: 15px; }
.sphere-banner {
  position: fixed;
  left: 50%;
  bottom: max(80px, calc(env(safe-area-inset-bottom) + 72px));
  transform: translateX(-50%) translateY(12px);
  z-index: 45;
  padding: 12px 20px;
  border-radius: 12px;
  background: color-mix(in srgb, var(--nav-bg) 92%, transparent);
  border: 1px solid color-mix(in srgb, var(--text-main) 20%, transparent);
  color: var(--text-main);
  font-size: 14px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
}
.sphere-banner.visible {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
  pointer-events: auto;
}
.hud-cluster {
  position: fixed;
  right: max(12px, env(safe-area-inset-right));
  bottom: max(14px, env(safe-area-inset-bottom));
  z-index: 50;
  display: flex;
  flex-direction: row;
  gap: 8px;
  align-items: center;
  pointer-events: none;
}
.hud-cluster .hud-actions {
  position: static;
  pointer-events: auto;
  background: color-mix(in srgb, var(--nav-bg) 52%, transparent);
  border: 1px solid color-mix(in srgb, var(--text-main) 12%, transparent);
}
.hud-btn.active {
  background: color-mix(in srgb, var(--text-main) 14%, transparent);
  opacity: 1;
}
#flag-toggle.active { color: #ff0000; }
body[data-sphere-theme="light"] #flag-toggle.active { color: #ff0000; }
/* Instructions modal */
.help-overlay {
  position: fixed;
  inset: 0;
  z-index: 110;
  background: color-mix(in srgb, var(--bg-color) 88%, transparent);
  backdrop-filter: blur(10px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.25rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
}
.help-overlay.open { opacity: 1; pointer-events: auto; }
.help-panel {
  width: min(380px, 100%);
  max-height: min(75vh, 480px);
  overflow: auto;
  background: color-mix(in srgb, var(--nav-bg) 94%, transparent);
  color: var(--text-main);
  border: 1px solid color-mix(in srgb, var(--text-main) 12%, transparent);
  border-radius: 22px;
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  padding: 1.35rem 1.3rem 1.2rem;
  position: relative;
  box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  text-align: left;
}
.help-panel h2 {
  font-size: 1.1rem;
  margin: 0 0 0.85rem;
  letter-spacing: -0.02em;
  text-align: center;
}
.help-glyphs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin: 0 0 0.75rem;
}
.help-glyph {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 10px 6px;
  border-radius: 14px;
  background: color-mix(in srgb, var(--text-main) 6%, transparent);
  border: 1px solid color-mix(in srgb, var(--text-main) 10%, transparent);
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: color-mix(in srgb, var(--text-main) 90%, var(--text-sub));
  text-align: center;
  line-height: 1.2;
}
.help-glyph svg {
  width: 22px;
  height: 22px;
  stroke: var(--text-main);
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: 0.92;
}
.help-tagline {
  margin: 0 0 0.65rem;
  font-size: 0.82rem;
  line-height: 1.35;
  text-align: center;
  color: var(--text-sub);
}
.help-panel .help-keys {
  margin-top: 0.65rem;
  font-size: 0.78rem;
  text-align: center;
  color: var(--text-sub);
}
.help-panel kbd {
  font-family: ui-monospace, monospace;
  font-size: 0.8em;
  border: 1px solid color-mix(in srgb, var(--text-main) 30%, transparent);
  border-radius: 5px;
  padding: 0.05em 0.4em;
  background: color-mix(in srgb, var(--text-main) 8%, transparent);
}
.help-close {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 44px;
  height: 44px;
  border: none;
  background: transparent;
  color: var(--text-sub);
  cursor: pointer;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.help-close:hover { color: var(--text-main); }
.help-close:focus-visible {
  outline: 2px solid color-mix(in srgb, var(--text-main) 55%, transparent);
  outline-offset: 2px;
}
.help-play {
  appearance: none;
  border: 0;
  display: block;
  width: 100%;
  margin-top: 0.65rem;
  padding: 10px 18px;
  border-radius: 999px;
  font: 600 0.9rem/1 "IBM Plex Sans", system-ui, sans-serif;
  cursor: pointer;
  background: var(--text-main);
  color: var(--bg-color);
}
.help-play:focus-visible {
  outline: 2px solid color-mix(in srgb, var(--text-main) 55%, transparent);
  outline-offset: 3px;
}
.menu-links {
  margin-top: 0.85rem;
  padding-top: 0.65rem;
  border-top: 1px solid color-mix(in srgb, var(--text-main) 10%, transparent);
  text-align: center;
  font-size: 0.72rem;
}
.menu-links a {
  color: var(--text-sub);
  text-decoration: none;
}
.menu-links a:hover { color: var(--text-main); }
.menu-links-sep { opacity: 0.45; margin: 0 0.35rem; }
@media (prefers-reduced-motion: reduce) {
  .sphere-banner,
  .help-overlay { transition: none; }
}
</style>
</head>
<body data-sphere-theme="light">
<div class="sphere-stats" aria-label="Score">
  <div id="stats-mines" class="stat-item visible" data-label="mines" title="Mines remaining">00</div>
  <div id="stats-time" class="stat-item visible" data-label="time" title="Elapsed seconds">000</div>
</div>

<div class="canvas-container">
  <canvas id="gameCanvas" aria-label="Hex sphere minesweeper board"></canvas>
</div>

<div class="hud-cluster" role="toolbar" aria-label="Game controls">
  <div class="hud-actions" aria-label="Board controls">
    <button type="button" id="reset-btn" class="hud-btn" aria-label="Reset" title="Reset (R)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="23 4 23 10 17 10"></polyline>
        <polyline points="1 20 1 14 7 14"></polyline>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
      </svg>
    </button>
    <button type="button" id="size-btn" class="hud-btn" aria-label="Board size: Medium" title="Size — Medium (1002 faces)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="12" cy="12" r="9"></circle>
        <ellipse cx="12" cy="12" rx="9" ry="4" transform="rotate(-20 12 12)"></ellipse>
      </svg>
    </button>
    <button type="button" id="theme-btn" class="hud-btn" aria-label="Theme: Light" title="Theme — Light">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="5"></circle>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
      </svg>
    </button>
  </div>
  <div class="hud-actions" aria-label="Flag mode">
    <button type="button" id="flag-toggle" class="hud-btn" aria-label="Flag mode" aria-pressed="false" title="Flag mode (F)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
        <line x1="4" y1="22" x2="4" y2="15"></line>
      </svg>
    </button>
  </div>
  <div class="hud-actions" aria-label="Help">
    <button type="button" id="help-btn" class="hud-btn" aria-label="Help" title="Help (?)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
    </button>
  </div>
</div>

<div id="help-overlay" class="help-overlay" role="dialog" aria-modal="true" aria-labelledby="help-title" hidden>
  <div class="help-panel">
    <button type="button" class="help-close" id="help-close" aria-label="Close help">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
    <h2 id="help-title">Hex Sphere</h2>
    <p class="help-tagline">Minesweeper on a closed sphere · six neighbors · first dig safe</p>
    <div class="help-glyphs" aria-label="Controls">
      <div class="help-glyph">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Dig
      </div>
      <div class="help-glyph">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
        Flag
      </div>
      <div class="help-glyph">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9l7-7 7 7"/><path d="M12 2v20"/></svg>
        Drag rotate
      </div>
      <div class="help-glyph">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="9" ry="4"/></svg>
        S · M · L
      </div>
      <div class="help-glyph">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41"/></svg>
        Themes
      </div>
      <div class="help-glyph">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/></svg>
        Clear all
      </div>
    </div>
    <p class="help-keys"><kbd>F</kbd> flag · <kbd>R</kbd> reset · <kbd>?</kbd> help · <kbd>T</kbd> theme · size icon cycles · scroll or pinch to zoom</p>
    <nav class="menu-links" aria-label="Elsewhere">
      <a href="https://lukesteuber.com" rel="noopener">lukesteuber.com</a>
      <span class="menu-links-sep" aria-hidden="true">·</span>
      <a href="https://datapoems.io" rel="noopener">datapoems.io</a>
    </nav>
    <button type="button" class="help-play" id="help-play">Got it — play</button>
  </div>
</div>

<script src="hexasphere.js?v=20260806d"></script>
<script src="sphere.js?v=20260806d"></script>
<script>
SphereSweeper.boot({ canvasId: "gameCanvas" });
</script>
</body>
</html>
