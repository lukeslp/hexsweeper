<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" role="img" aria-labelledby="title desc">
  <title id="title">Douse an armed mine</title>
  <desc id="desc">A glowing red mined face rotates from above the waterline to a cool inert face below it.</desc>
  <defs>
    <linearGradient id="deep" x2="0" y2="1"><stop stop-color="#147b9b" stop-opacity=".82"/><stop offset="1" stop-color="#02283d"/></linearGradient>
    <radialGradient id="sphere"><stop stop-color="#4c7384"/><stop offset="1" stop-color="#173b4d"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="480" height="280" rx="22" fill="#0a2b3d"/>
  <circle cx="240" cy="144" r="124" fill="url(#sphere)" stroke="#b3efff" stroke-width="3"/>
  <path d="M0 137Q80 129 160 138t160 0 160 0V280H0Z" fill="url(#deep)"/>
  <path d="M0 137Q80 129 160 138t160 0 160 0" fill="none" stroke="#92ecff" stroke-width="5"/>
  <g transform="translate(240 72)" filter="url(#glow)">
    <path d="m0-43 38 22v43L0 44l-38-22v-43z" fill="#ff3c20" stroke="#ffe7a6" stroke-width="4"/>
    <circle r="11" fill="#161616"/><path d="M7-8 21-24" stroke="#111" stroke-width="6" stroke-linecap="round"/>
    <path d="m22-26 8-8m-3 12 10-1" stroke="#ffd543" stroke-width="5" stroke-linecap="round"/>
  </g>
  <path d="M345 76c58 60 28 148-54 168" fill="none" stroke="#ffd543" stroke-width="7" stroke-linecap="round"/>
  <path d="m304 229-18 17 24 7" fill="none" stroke="#ffd543" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(240 208)">
    <circle r="52" fill="#77ecff" opacity=".16"/>
    <circle r="39" fill="none" stroke="#9bf4ff" stroke-width="3" opacity=".55"/>
    <path d="m0-37 33 19v37L0 38l-33-19v-37z" fill="#0b5870" stroke="#c9faff" stroke-width="4"/>
    <path d="m-10 1 7 7 15-18" fill="none" stroke="#bffcff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
