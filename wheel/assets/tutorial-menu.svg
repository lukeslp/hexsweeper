<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" role="img" aria-labelledby="title desc">
  <title id="title">Tap outside for controls</title>
  <desc id="desc">A finger taps the open sea beside the half-submerged sphere and a seven-hex control flower blooms over its centre; a curved arrow shows dragging to rotate.</desc>
  <defs>
    <linearGradient id="deep" x2="0" y2="1"><stop stop-color="#147b9b" stop-opacity=".82"/><stop offset="1" stop-color="#02283d"/></linearGradient>
    <radialGradient id="sphere"><stop stop-color="#4c7384"/><stop offset="1" stop-color="#173b4d"/></radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="480" height="280" rx="22" fill="#0a2b3d"/>
  <!-- the wheel, half in the water -->
  <circle cx="240" cy="144" r="124" fill="url(#sphere)" stroke="#b3efff" stroke-width="3"/>
  <g fill="none" stroke="#9bd6ea" stroke-width="1.6" opacity=".45">
    <path d="m240 40 30 17v35l-30 17-30-17V57zM180 92l30 17v35l-30 17-30-17v-35zM300 92l30 17v35l-30 17-30-17v-35zM240 144l30 17v35l-30 17-30-17v-35zM180 196l30 17v9M300 196l30 17v9"/>
  </g>
  <path d="M0 137Q80 129 160 138t160 0 160 0V280H0Z" fill="url(#deep)"/>
  <path d="M0 137Q80 129 160 138t160 0 160 0" fill="none" stroke="#92ecff" stroke-width="5"/>
  <!-- the flower over the centre: restart · flag · menu · help around a filled heart -->
  <g transform="translate(240 144)">
    <circle r="86" fill="#0a2b3d" opacity=".55"/>
    <g fill="#0b5870" stroke="#c9faff" stroke-width="3.5" stroke-linejoin="round">
      <path d="m0-58 24 14v27L0-3l-24-14v-27z"/>
      <path d="m48-31 24 14v27L48 24 24 10v-27z"/>
      <path d="m48 24 24 14v27L48 79 24 65V38z"/>
      <path d="m0 51 24 14v27L0 106l-24-14V65z"/>
      <path d="m-48 24-24 14v27l24 14 24-14V38z"/>
      <path d="m-48-31-24 14v27l24 14 24-14v-27z"/>
      <path d="m0-3 24 14v27L0 52l-24-14V11z" fill="#ffd543" stroke="#fff4c9"/>
    </g>
    <g fill="none" stroke="#e8fbff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <!-- restart (top) -->
      <path d="M-9-38a11 11 0 1 1 5 9M-13-40l4 6 6-4"/>
      <!-- flag (upper right) -->
      <path d="M43-8v-24h13l-3 6 3 6H43"/>
      <!-- help (lower right) -->
      <path d="M43 44a6 6 0 1 1 8 5c-2 1-3 2-3 5M48 62v.5"/>
      <!-- close (bottom) -->
      <path d="m-7 72 14 14M7 72-7 86"/>
      <!-- flag mode (lower left) -->
      <path d="M-56 44v-24h13l-3 6 3 6h-13" fill="#e8fbff"/>
      <!-- undo (upper left) -->
      <path d="M-58-16h14a7 7 0 0 1 0 14h-6M-53-22l-5 6 5 6"/>
    </g>
  </g>
  <!-- the tap, out in the open sea -->
  <g transform="translate(78 200)">
    <circle r="16" fill="#ffd543"/>
    <circle r="27" fill="none" stroke="#ffd543" stroke-width="3" opacity=".55"/>
    <circle r="40" fill="none" stroke="#ffd543" stroke-width="2" opacity=".28"/>
    <path d="M12-58c8-2 12 4 10 12l-6 22-4 6" fill="none" stroke="#ffe9a6" stroke-width="7" stroke-linecap="round" filter="url(#soft)"/>
  </g>
  <!-- drag to rotate -->
  <path d="M400 70c22 40 22 96 0 136" fill="none" stroke="#ffd543" stroke-width="7" stroke-linecap="round" opacity=".9"/>
  <path d="m392 190 8 18 16-10" fill="none" stroke="#ffd543" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
