apply plugin: 'com.android.application'

// Release signing comes from the environment, never from a file in Git.
// Populate it with: android-release with-signing --profile hexsweeper -- <cmd>
def signingValues = [
    'HEXSWEEPER_ANDROID_STORE_FILE',
    'HEXSWEEPER_ANDROID_STORE_PASSWORD',
    'HEXSWEEPER_ANDROID_KEY_ALIAS',
    'HEXSWEEPER_ANDROID_KEY_PASSWORD',
].collectEntries { [(it): System.getenv(it)] }
def hasReleaseSigning = signingValues.values().every { it != null && !it.trim().isEmpty() }

// Application id. The direct download, Amazon and every build made without
// -Pplay keep the id those installs already have. A Google Play build
// (-Pplay) takes its id from ONE property, hexsweeperPlayApplicationId in
// gradle.properties. Android treats the two ids as two different apps: they
// install side by side, neither updates the other, and saves do not carry
// over. The namespace (the Java package and R class) is the same for both.
def directApplicationId = "app.hexodus.ios"
def playBuild = project.hasProperty('play')
def hexsweeperApplicationId = directApplicationId
if (playBuild) {
    hexsweeperApplicationId = (project.findProperty('hexsweeperPlayApplicationId') ?: '').toString().trim()
    if (!(hexsweeperApplicationId ==~ /[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+/)) {
        throw new GradleException("-Pplay needs hexsweeperPlayApplicationId in gradle.properties (got '${hexsweeperApplicationId}')")
    }
    if (hexsweeperApplicationId == directApplicationId) {
        throw new GradleException("The Play application id must differ from the direct build's ${directApplicationId}")
    }
}

android {
    namespace = "app.hexodus.ios"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId hexsweeperApplicationId
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 37
        versionName "1.0.12"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(signingValues['HEXSWEEPER_ANDROID_STORE_FILE'])
                storePassword signingValues['HEXSWEEPER_ANDROID_STORE_PASSWORD']
                keyAlias signingValues['HEXSWEEPER_ANDROID_KEY_ALIAS']
                keyPassword signingValues['HEXSWEEPER_ANDROID_KEY_PASSWORD']
            }
        }
    }
    buildTypes {
        release {
            // Release bytes must not depend on how the source was checked out
            // (F-Droid rebuilds from a clean clone and compares with the signed file).
            vcsInfo.include false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }
}

// F-Droid's scanner rejects the Play dependency-metadata signing block in an APK.
// Play bundles keep theirs (includeInBundle is left at its default).
android.dependenciesInfo {
    includeInApk = false
}

tasks.register('printApplicationId') {
    doLast { println hexsweeperApplicationId }
}

tasks.register('printVersion') {
    doLast { println android.defaultConfig.versionName }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
