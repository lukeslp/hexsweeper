/* skin-chrome.css */
/*
 * File Purpose: Shared HUD chrome for Hexsweeper lab skins (+ helpers for production).
 * Primary Classes: .skin-nav, .hud-actions, .hud-btn, .menu-stats, .menu-links, .fx-layer, overlays.
 * Inputs: CSS variables --nav-bg, --nav-ink, --bg-color, --text-main, --text-sub.

<script>
/* core.js */
/**
 * File Purpose: Shared Hexsweeper game engine (hex grid, endless/finite boards,
 *   dig/flag/chord, drag-pan, wheel/pinch zoom, RAF loop) with skin hooks.
 * Primary Functions/Classes: Cell; boot(); applyViewZoom; exportEndlessState;
 *   applyEndlessState; setFinish; Hexsweeper.DEFAULT_*.
 * Inputs: Hexsweeper.boot({ canvasId, theme, hooks, difficulty, showStats, endless }).
 * Outputs: API (setZoom, adjustZoom, setFlagMode, setCamera, restart, setFinish,
 *   exportEndlessState, applyEndlessState, …) on window.Hexsweeper.
 * Notes: Endless Escape may set finishKey — reveal that safe hex to win.
 *   hooks.onReset / skin startFreshRun: chrome must be live before framing zoom.
 *   Boot skips onReset once; index.html restores autosave or calls startFreshRun.
 *   hooks.cameraLock (bool|fn): Fire-style tilt while the board fits the
 *   viewport. Once zoom pushes the board past the frame, drag pans (clamped
 *   to the board) so edge tiles stay reachable — especially on mobile.
 *   Long-press still flags; pinch zooms; Space/middle-drag always pans.
 */
(function (global) {
  "use strict";

  const SQRT3 = Math.sqrt(3);

  /**
   * Global effects preference, shared by every Hexsweeper page on the origin.
   *
   *   "auto"    follow the OS Reduce Motion setting (default)
   *   "full"    force effects on, even if the OS asks to reduce
   *   "reduced" force effects off
   *
   * "auto" is the default so the accessibility behaviour still works untouched;
   * "full" exists because a player who turned Reduce Motion on system-wide may
   * still want the particles here, and that is their call to make.
   *
   * MIRROR: sphere/sphere.js and tools/app-launcher.html carry the same seven
   * lines — they do not load core.js. Change all three together.
   */
  const EFFECTS_KEY = "hexsweeper-effects-v1";

  function effectsReduced() {
    let pref = null;
    try {
      pref = localStorage.getItem(EFFECTS_KEY);
    } catch (_) {}
    if (pref === "reduced") return true;
    if (pref === "full") return false;
    return (
      typeof matchMedia === "function" &&
      matchMedia("(prefers-reduced-motion: reduce)").matches
    );
  }

  /** Mirror the resolved preference onto <html> so CSS can gate too. */
  function applyEffectsAttribute() {
    if (typeof document === "undefined") return;
    document.documentElement.setAttribute(
      "data-effects",
      effectsReduced() ? "reduced" : "full"
    );
  }

  const DEFAULT_CONFIG = {
    easy: { radius: 4, mines: 10, cellSize: 35 },
    medium: { radius: 7, mines: 35, cellSize: 28 },
    hard: { radius: 10, mines: 80, cellSize: 22 },
  };

  /** Endless Soft White defaults — density by starting difficulty. */
  const ENDLESS_DENSITY = { easy: 0.13, medium: 0.155, hard: 0.18 };
  /** Soft cap only — viewport-driven growth; not a fixed board size. */
  const ENDLESS_MAX_RADIUS = 160;
  /** Extra rings beyond the camera frustum so edges never show void. */
  const ENDLESS_VIEW_BUFFER = 4;

  const DEFAULT_THEME = {
    bg: "#e0e5ec",
    shadowLight: "#ffffff",
    shadowDark: "#a3b1c6",
    covered: "#e0e5ec",
    revealed: "#e0e5ec",
    flag: "#ef4444",
    text: {
      1: "#3b82f6",
      2: "#10b981",
      3: "#ef4444",
      4: "#8b5cf6",
      5: "#f59e0b",
      6: "#ec4899",
      mine: "#333",
    },
  };

  class Cell {
    constructor(q, r) {
      this.q = q;
      this.r = r;
      this.isMine = false;
      this.isFinish = false;
      this.revealed = false;
      this.flagged = false;
      this.neighborMines = 0;
      this.x = 0;
      this.y = 0;
      this.path = null;
      this.animHover = 0;
      this.animReveal = 0;
      this.ring = 0;
      this._pendingReveal = false;
      this.revealDue = 0;
    }

    calcGeometry(centerX, centerY, size) {
      this.x = centerX + size * SQRT3 * (this.q + this.r / 2);
      this.y = centerY + size * 1.5 * this.r;
      this.ring = (Math.abs(this.q) + Math.abs(this.q + this.r) + Math.abs(this.r)) / 2;
      this.path = new Path2D();
      for (let i = 0; i < 6; i++) {
        const angle = (Math.PI / 180) * (30 + 60 * i);
        const vx = this.x + size * Math.cos(angle);
        const vy = this.y + size * Math.sin(angle);
        if (i === 0) this.path.moveTo(vx, vy);
        else this.path.lineTo(vx, vy);
      }
      this.path.closePath();
    }

    hexPath(size, scale = 1) {
      const drawSize = size * scale;
      const p = new Path2D();
      for (let i = 0; i < 6; i++) {
        const angle = (Math.PI / 180) * (30 + 60 * i);
        const vx = this.x + drawSize * Math.cos(angle);
        const vy = this.y + drawSize * Math.sin(angle);
        if (i === 0) p.moveTo(vx, vy);
        else p.lineTo(vx, vy);
      }
      p.closePath();
      return p;
    }
  }

  function boot(userOpts = {}) {
    // Publish the resolved effects preference before first paint so CSS gates
    // apply to the opening frame rather than snapping in after it.
    applyEffectsAttribute();
    const opts = {
      canvasId: "gameCanvas",
      difficulty: "medium",
      showStats: false,
      config: DEFAULT_CONFIG,
      theme: { ...DEFAULT_THEME, ...(userOpts.theme || {}) },
      hooks: userOpts.hooks || {},
      ...userOpts,
    };
    if (userOpts.theme && userOpts.theme.text) {
      opts.theme.text = { ...DEFAULT_THEME.text, ...userOpts.theme.text };
    }

    const requestedMinZoom = Number.isFinite(opts.minZoom) ? opts.minZoom : 0.55;
    const requestedMaxZoom = Number.isFinite(opts.maxZoom) ? opts.maxZoom : 1.9;
    const minViewZoom = Math.max(0.1, Math.min(requestedMinZoom, requestedMaxZoom));
    const maxViewZoom = Math.max(minViewZoom, Math.max(requestedMinZoom, requestedMaxZoom));
    const clampViewZoom = (value) => Math.max(minViewZoom, Math.min(maxViewZoom, value));

    const canvas = document.getElementById(opts.canvasId);
    if (!canvas) throw new Error("Hexsweeper: canvas not found");
    const ctx = canvas.getContext("2d");

    const state = {
      canvas,
      ctx,
      map: new Map(),
      mapRadius: 0,
      mineCount: 0,
      cellSize: 0,
      isGameOver: false,
      isFirstClick: true,
      flagsPlaced: 0,
      timeElapsed: 0,
      timerInterval: null,
      hoveredKey: null,
      currentDifficulty: opts.difficulty,
      showStats: opts.showStats,
      theme: opts.theme,
      config: opts.config,
      hooks: opts.hooks,
      pointer: { x: 0, y: 0, nx: 0, ny: 0, active: false },
      t0: performance.now(),
      now: 0,
      win: null,
      detonator: null, // cell that triggered a loss (for blast FX)
      centerX: 0,
      centerY: 0,
      boardOffset: { x: 0, y: 0 },
      // Endless / infinite field (Soft White): expand at the frontier, no win
      // Escape may set finishKey — revealing that hex is a positive exit.
      endless: !!opts.endless,
      mineDensity:
        opts.mineDensity != null && Number.isFinite(opts.mineDensity)
          ? opts.mineDensity
          : ENDLESS_DENSITY.medium,
      maxRadius: opts.maxRadius != null ? opts.maxRadius : ENDLESS_MAX_RADIUS,
      finishKey: null,
      clearedSafe: 0,
      bestCleared: 0,
      hitMaxRadius: false,
      // Camera (world → screen). Skins read these when positioning cells.
      camX: 0,
      camY: 0,
      camTX: 0,
      camTY: 0,
      focusCell: null,
      // Interaction: zoom (multiplies base cell size), dig vs flag, pan locks.
      viewZoom: Number.isFinite(opts.initialZoom) ? clampViewZoom(opts.initialZoom) : clampViewZoom(1),
      flagMode: false,
      panning: false,
      spaceDown: false,
      floodPending: 0,
      _growAfterFlood: false,
    };

    if (!Number.isFinite(opts.initialZoom) && opts.zoomStorageKey !== false) {
      try {
        const zoomKey = opts.zoomStorageKey || "hexsweeper-zoom-v1";
        const z = parseFloat(localStorage.getItem(zoomKey) || "1");
        if (Number.isFinite(z)) state.viewZoom = clampViewZoom(z);
      } catch (_) {}
    }

    try {
      const storedBest = parseInt(localStorage.getItem("hexsweeper-endless-best") || "0", 10);
      if (Number.isFinite(storedBest) && storedBest > 0) state.bestCleared = storedBest;
    } catch (_) {}

    const modal = document.getElementById("modal-overlay");
    const diffOptions = document.querySelectorAll(".diff-option");
    const statsToggle = document.getElementById("stats-toggle");
    const statsMines = document.getElementById("stats-mines");
    const statsTime = document.getElementById("stats-time");
    const menuBtn = document.getElementById("menu-btn");
    const closeBtn = document.getElementById("close-modal-btn");
    // Production uses #reset-btn on the HUD; lab skins still use #restart-btn in the modal.
    const restartBtn =
      document.getElementById("restart-btn") || document.getElementById("reset-btn");

    function openModal() {
      if (modal) modal.classList.add("open");
    }
    function closeModal() {
      if (modal) modal.classList.remove("open");
    }

    if (menuBtn) menuBtn.addEventListener("click", openModal);
    if (closeBtn) closeBtn.addEventListener("click", closeModal);
    if (modal) {
      modal.addEventListener("click", (e) => {
        if (e.target === modal) closeModal();
      });
    }

    function syncDiffButtons() {
      if (!diffOptions.length) return;
      diffOptions.forEach((opt) => {
        const on = opt.dataset.val === state.currentDifficulty;
        opt.classList.toggle("active", on);
        opt.setAttribute("aria-pressed", on ? "true" : "false");
      });
    }

    /**
     * Start a clean board. Any persistence-owning surface must drop autosave
     * here — otherwise S/M/L or Restart would paint a fresh field while the
     * old run still resurrected on the next load.
     */
    function beginFreshRun(level, { clearPersist = true } = {}) {
      if (
        clearPersist &&
        typeof state.hooks.onClearPersist === "function"
      ) {
        state.hooks.onClearPersist(api);
      }
      setDifficulty(level || state.currentDifficulty);
    }

    if (diffOptions.length) {
      syncDiffButtons();
      diffOptions.forEach((opt) => {
        opt.addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
          const level = opt.dataset.val;
          if (!level || !state.config[level]) return;
          // Always rebuild so S/M/L is never a no-op highlight-only change.
          beginFreshRun(level);
          closeModal();
        });
      });
    }

    if (statsToggle) {
      statsToggle.classList.toggle("active", state.showStats);
      statsToggle.addEventListener("click", () => {
        state.showStats = !state.showStats;
        statsToggle.classList.toggle("active", state.showStats);
        updateStatsVisibility();
      });
    }

    function updateStatsVisibility() {
      if (!statsMines || !statsTime) return;
      // Menu-embedded stats (no .score-rail) stay visible; lab score rails still honor the toggle.
      const inRail = !!(statsMines.closest(".score-rail") || statsTime.closest(".score-rail"));
      const show = !inRail || state.showStats || state.endless;
      statsMines.classList.toggle("visible", show);
      statsTime.classList.toggle("visible", show);
      if (statsToggle) {
        statsToggle.classList.toggle("active", state.showStats);
        statsToggle.setAttribute("aria-checked", state.showStats ? "true" : "false");
      }
    }

    if (restartBtn) {
      restartBtn.addEventListener("click", () => {
        closeModal();
        beginFreshRun(state.currentDifficulty);
      });
    }

    function getNeighbors(q, r) {
      const directions = [
        { dq: 1, dr: 0 },
        { dq: 1, dr: -1 },
        { dq: 0, dr: -1 },
        { dq: -1, dr: 0 },
        { dq: -1, dr: 1 },
        { dq: 0, dr: 1 },
      ];
      const neighbors = [];
      for (const d of directions) {
        const nKey = `${q + d.dq},${r + d.dr}`;
        if (state.map.has(nKey)) neighbors.push(state.map.get(nKey));
      }
      return neighbors;
    }

    const api = {
      get state() {
        return state;
      },
      getNeighbors,
      hexPath(cell, size, scale) {
        return cell.hexPath(size, scale);
      },
      drawDefaultCell(cell, size) {
        drawDefaultCell(cell, size);
      },
      setBoardOffset(x, y) {
        state.boardOffset.x = x;
        state.boardOffset.y = y;
      },
      setEndless(on, density) {
        state.endless = !!on;
        // Preserve an explicit density (including 0) across setDifficulty.
        if (density != null && Number.isFinite(density)) {
          state.mineDensity = density;
          state._densityLocked = true;
        } else if (state.endless) {
          state._densityLocked = false;
          state.mineDensity =
            ENDLESS_DENSITY[state.currentDifficulty] != null
              ? ENDLESS_DENSITY[state.currentDifficulty]
              : ENDLESS_DENSITY.medium;
        } else {
          state._densityLocked = false;
        }
        setDifficulty(state.currentDifficulty);
      },
      setCamera(x, y) {
        state.camX = x;
        state.camY = y;
        state.camTX = x;
        state.camTY = y;
      },
      /** Explicit framing only (themes / tools). Never called from dig/chord/flood. */
      focusOnCell(cell, snap) {
        if (!cell) return;
        if (isCameraLocked()) return;
        state.focusCell = cell;
        const wx = state.cellSize * SQRT3 * (cell.q + cell.r / 2);
        const wy = state.cellSize * 1.5 * cell.r;
        state.camTX = wx;
        state.camTY = wy;
        if (snap) {
          state.camX = wx;
          state.camY = wy;
        }
      },
      /**
       * @param {{ clearPersist?: boolean }} [opts]
       * clearPersist defaults true (R / Restart). Theme swaps pass false so
       * the destination lane's autosave can be restored.
       */
      restart(opts = {}) {
        beginFreshRun(state.currentDifficulty, {
          clearPersist: opts.clearPersist !== false,
        });
      },
      /** Snapshot any run (mines / revealed / flags / camera). */
      exportRunState() {
        return exportRunState();
      },
      /** Restore a matching finite or endless snapshot. */
      applyRunState(data) {
        return applyRunState(data);
      },
      /** Backward-compatible endless-only snapshot adapter. */
      exportEndlessState() {
        return exportEndlessState();
      },
      /** Backward-compatible endless-only restore adapter. */
      applyEndlessState(data) {
        return applyEndlessState(data);
      },
      toggleFlag(cell) {
        if (cell) toggleFlag(cell);
      },
      setZoom(z, anchor, opts) {
        return applyViewZoom(z, anchor, opts);
      },
      adjustZoom(factor, anchor) {
        return applyViewZoom(state.viewZoom * factor, anchor);
      },
      setFlagMode(on) {
        state.flagMode = !!on;
        document.body.classList.toggle("flag-mode", state.flagMode);
        syncCursor();
        if (typeof state.hooks.onFlagMode === "function") state.hooks.onFlagMode(state.flagMode, api);
        return state.flagMode;
      },
      toggleFlagMode() {
        return api.setFlagMode(!state.flagMode);
      },
      /** Skin-driven loss/win (e.g. Escape rift catch). */
      endGame(win, meta) {
        if (state.isGameOver) return false;
        if (meta && meta.detonator) state.detonator = meta.detonator;
        if (meta && meta.reason) state.endReason = meta.reason;
        else state.endReason = win ? "win" : "mine";
        gameOver(!!win);
        return true;
      },
      /**
       * Escape exit hex (axial). Null clears. Never mined; created on expand if needed.
       * @returns {string|null} finish key
       */
      setFinish(q, r) {
        return setFinishCell(q, r);
      },
      /** Debug / skin helper: dig a cell by axial key or Cell. */
      dig(target) {
        if (state.isGameOver) return false;
        let cell = target;
        if (typeof target === "string") cell = state.map.get(target);
        else if (target && typeof target.q === "number") {
          cell = state.map.get(`${target.q},${target.r}`) || target;
        }
        if (!cell || cell.revealed || cell.flagged || cell._riftTorn) return false;
        reveal(cell);
        return true;
      },
    };

    function hexRing(q, r) {
      return (Math.abs(q) + Math.abs(q + r) + Math.abs(r)) / 2;
    }

    function shuffleInPlace(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function isSafeZone(cell, safeQ, safeR) {
      if (cell.q === safeQ && cell.r === safeR) return true;
      const dq = cell.q - safeQ;
      const dr = cell.r - safeR;
      return hexRing(dq, dr) <= 1;
    }

    function finishKeyOf(q, r) {
      return `${q | 0},${r | 0}`;
    }

    function isFinishCell(cell) {
      if (!cell) return false;
      if (cell.isFinish) return true;
      return !!(state.finishKey && state.finishKey === `${cell.q},${cell.r}`);
    }

    /**
     * Product surfaces can reserve playable-looking cells for embedded controls
     * (for example the shared launcher). Protected cells remain part of the
     * board and can reveal normally, but never receive a mine or a flag.
     */
    function isProtectedCell(cell) {
      if (!cell) return false;
      if (isFinishCell(cell)) return true;
      const guard = state.hooks && state.hooks.isProtectedCell;
      return typeof guard === "function" && !!guard(cell, api);
    }

    /** Mark / clear the Escape finish hex; demines if already present. */
    function setFinishCell(q, r) {
      if (state.finishKey) {
        const prev = state.map.get(state.finishKey);
        if (prev) prev.isFinish = false;
      }
      if (q == null || r == null || !Number.isFinite(q) || !Number.isFinite(r)) {
        state.finishKey = null;
        return null;
      }
      const key = finishKeyOf(q, r);
      state.finishKey = key;
      const cell = state.map.get(key);
      if (cell) stampFinishCell(cell);
      return key;
    }

    function stampFinishCell(cell) {
      if (!cell) return;
      cell.isFinish = true;
      if (cell.isMine) {
        cell.isMine = false;
        state.mineCount = Math.max(0, (state.mineCount | 0) - 1);
        recountNeighbors();
      }
    }

    function ensureFinishStamp() {
      if (!state.finishKey) return;
      const cell = state.map.get(state.finishKey);
      if (cell) stampFinishCell(cell);
    }

    function recountNeighbors() {
      state.map.forEach((cell) => {
        if (!cell.isMine) {
          cell.neighborMines = getNeighbors(cell.q, cell.r).filter((n) => n.isMine).length;
        } else {
          cell.neighborMines = 0;
        }
      });
    }

    function applyLayout() {
      if (typeof state.hooks.layout === "function") {
        state.hooks.layout(api);
      } else if (state.endless) {
        // Full-window viewport; camera pans the field
        canvas.width = Math.max(320, window.innerWidth);
        canvas.height = Math.max(320, window.innerHeight);
      } else {
        const boardWidth = (state.mapRadius * 2 + 1) * SQRT3 * state.cellSize;
        const boardHeight =
          (state.mapRadius * 2 + 1) * 1.5 * state.cellSize + 0.5 * state.cellSize;
        canvas.width = Math.ceil(boardWidth + 40);
        canvas.height = Math.ceil(boardHeight + 40);
      }
      state.centerX = canvas.width / 2 + state.boardOffset.x;
      state.centerY = canvas.height / 2 + state.boardOffset.y;
    }

    /** Cell size for current difficulty / mode (does not mutate radius). */
    function computeCellSize(level, mapRadius) {
      const conf = state.config[level];
      if (!conf) return state.cellSize || 28;
      let cellSize = conf.cellSize;
      if (state.endless) {
        // Readable base size; user zoom multiplies. Pan instead of shrinking the world.
        const phone = window.innerWidth < 500;
        cellSize = phone ? 26 : Math.max(26, conf.cellSize + 4);
      } else {
        // Scale finite boards so the outer hex fills most of the viewport.
        // viewportFill is a fraction of the live window (no stolen chrome padding —
        // that made Fire's 0.98 read as ~90% with large letterbox margins).
        // Optional viewportPadCells grows the height budget for innie shaft sink.
        const maxW = Math.max(280, window.innerWidth);
        const maxH = Math.max(280, window.innerHeight);
        const padCells = Number.isFinite(state.config.viewportPadCells)
          ? state.config.viewportPadCells
          : 0;
        const naturalW = (mapRadius * 2 + 1) * SQRT3 * cellSize;
        const naturalH =
          (mapRadius * 2 + 1) * 1.5 * cellSize + 0.5 * cellSize + padCells * cellSize;
        // Fire ~0.98 fills the short axis; Plague keeps a thin specimen margin.
        const fillDefault = window.innerWidth < 500 ? 0.96 : 0.94;
        const fill = Number.isFinite(state.config.viewportFill)
          ? state.config.viewportFill
          : fillDefault;
        if (naturalW > 0 && naturalH > 0) {
          const scale = Math.min((maxW * fill) / naturalW, (maxH * fill) / naturalH);
          // Cap high enough for easy Fire on large monitors (old 62 capped ~70% fill).
          cellSize = Math.max(14, Math.min(96, cellSize * scale));
        }
      }
      const zoom = Number.isFinite(state.viewZoom) ? state.viewZoom : 1;
      return Math.max(12, Math.min(110, cellSize * zoom));
    }

    /**
     * Zoom the board. When `anchor` is a canvas pixel, keep that world point under the cursor.
     * `persist: false` frames the view without touching the stored preference — the zoom key
     * is shared across themes, so an opening zoom must not overwrite what the player chose.
     */
    /** Finite board size in pixels at the current cellSize (includes zoom). */
    function boardPixelExtents() {
      const r = state.mapRadius || 0;
      const s = state.cellSize || 28;
      const pad = Number.isFinite(state.config && state.config.viewportPadCells)
        ? state.config.viewportPadCells
        : 0;
      return {
        w: (r * 2 + 1) * SQRT3 * s,
        h: (r * 2 + 1) * 1.5 * s + 0.5 * s + pad * s,
      };
    }

    /**
     * True when edge tiles need pan: zoomed past default, or the finite board
     * no longer fits the canvas. Zoom-1 Fire (~0.98 fill) stays tilt-only.
     */
    function boardOverflowsViewport() {
      if (state.endless) return false;
      const zoom = Number.isFinite(state.viewZoom) ? state.viewZoom : 1;
      // Any deliberate zoom-in unlocks pan — bounding-box alone often leaves
      // maxX=0 on wide desks (height overflows first) so rim tiles stayed stuck.
      if (zoom > 1.04) return true;
      const { w, h } = boardPixelExtents();
      const slack = 12;
      return w > canvas.width + slack || h > canvas.height + slack;
    }

    /** Keep a finite board's camera inside a usable overflow range. */
    function clampCameraToBoard() {
      if (state.endless) return;
      const { w, h } = boardPixelExtents();
      const zoom = Number.isFinite(state.viewZoom) ? state.viewZoom : 1;
      const byBoxX = Math.max(0, (w - canvas.width) / 2);
      const byBoxY = Math.max(0, (h - canvas.height) / 2);
      // Zoom slack: even when one axis still "fits", let the player reach the rim.
      const byZoomX = zoom > 1 ? (canvas.width * (zoom - 1)) / 2 : 0;
      const byZoomY = zoom > 1 ? (canvas.height * (zoom - 1)) / 2 : 0;
      const maxX = Math.max(byBoxX, byZoomX);
      const maxY = Math.max(byBoxY, byZoomY);
      if (maxX < 0.5 && maxY < 0.5) {
        state.camX = 0;
        state.camY = 0;
      } else {
        state.camX = Math.max(-maxX, Math.min(maxX, state.camX || 0));
        state.camY = Math.max(-maxY, Math.min(maxY, state.camY || 0));
      }
      state.camTX = state.camX;
      state.camTY = state.camY;
    }

    function applyViewZoom(nextZoom, anchor, { persist = true } = {}) {
      const z = clampViewZoom(nextZoom);
      if (Math.abs(z - state.viewZoom) < 0.001) return state.viewZoom;
      const oldSize = state.cellSize || 28;
      let worldUnder = null;
      // Endless always; Fire (cameraLock) also — pinch/wheel should keep the dig under the finger.
      const anchorZoom = state.endless || isCameraLocked();
      if (anchor && Number.isFinite(anchor.x) && Number.isFinite(anchor.y) && anchorZoom) {
        const wx = anchor.x - canvas.width / 2 + state.camX;
        const wy = anchor.y - canvas.height / 2 + state.camY;
        worldUnder = { wx, wy };
      }
      state.viewZoom = z;
      if (persist && opts.zoomStorageKey !== false) {
        try {
          const zoomKey = opts.zoomStorageKey || "hexsweeper-zoom-v1";
          localStorage.setItem(zoomKey, String(Math.round(z * 100) / 100));
        } catch (_) {}
      }
      const level = state.currentDifficulty;
      state.cellSize = computeCellSize(level, state.mapRadius);
      // Keep camera focus coherent when cell size changes
      if (worldUnder && oldSize > 0) {
        const ratio = state.cellSize / oldSize;
        const wx = worldUnder.wx * ratio;
        const wy = worldUnder.wy * ratio;
        state.camX = wx - (anchor.x - canvas.width / 2);
        state.camY = wy - (anchor.y - canvas.height / 2);
        state.camTX = state.camX;
        state.camTY = state.camY;
      } else if (state.focusCell && oldSize > 0) {
        const ratio = state.cellSize / oldSize;
        state.camX *= ratio;
        state.camY *= ratio;
        state.camTX = state.camX;
        state.camTY = state.camY;
      }
      state.map.forEach((cell) => {
        cell.calcGeometry(state.centerX, state.centerY, state.cellSize);
      });
      if (state.endless) ensureWorldCoverage(true);
      // Fire: snap home when the pit fits again; clamp when zoomed past the frame.
      if (isCameraLocked() && !state.endless) clampCameraToBoard();
      if (typeof state.hooks.onZoom === "function") state.hooks.onZoom(api, { zoom: state.viewZoom });
      syncCursor();
      return state.viewZoom;
    }

    function syncCursor() {
      if (!canvas) return;
      if (state.panning) canvas.style.cursor = "grabbing";
      else if (state.flagMode) canvas.style.cursor = "cell";
      else if (state.hoveredKey) canvas.style.cursor = "pointer";
      else canvas.style.cursor = state.endless ? "grab" : "crosshair";
    }

    /**
     * Resize / reflow without wiping the run.
     * Window resize used to call setDifficulty → full reset (fatal for endless).
     */
    function relayout() {
      const level = state.currentDifficulty;
      const conf = state.config[level];
      if (!conf) return;
      // Endless: keep world scale stable mid-run (only canvas / camera frame changes).
      // Finite: may shrink slightly if the viewport got smaller.
      if (!state.endless || state.isFirstClick) {
        state.cellSize = computeCellSize(level, state.mapRadius || conf.radius);
      }
      applyLayout();
      // Geometry is recomputed every frame by skins (beforeFrame); keep base paths
      // coherent for any default draw / debug paths.
      state.map.forEach((cell) => {
        cell.calcGeometry(state.centerX, state.centerY, state.cellSize);
      });
      if (state.endless) ensureWorldCoverage(true);
      if (isCameraLocked() && !state.endless) clampCameraToBoard();
      if (typeof state.hooks.onRelayout === "function") state.hooks.onRelayout(api);
    }

    function setDifficulty(level, options = {}) {
      const conf = state.config[level];
      if (!conf) {
        console.warn("Hexsweeper: unknown difficulty", level);
        return;
      }
      state.currentDifficulty = level;
      // Finite modes use configured radius; endless starts small then fills the viewport.
      state.mapRadius = state.endless ? Math.max(6, conf.radius) : conf.radius;
      state.mineCount = conf.mines;
      if (state.endless) {
        if (!state._densityLocked) {
          state.mineDensity =
            ENDLESS_DENSITY[level] != null ? ENDLESS_DENSITY[level] : ENDLESS_DENSITY.medium;
        }
        // Score / mines matter in endless — surface the stats strip
        if (!state.showStats) {
          state.showStats = true;
          if (statsToggle) {
            statsToggle.classList.add("active");
            statsToggle.setAttribute("aria-checked", "true");
          }
          updateStatsVisibility();
        }
      }
      state.cellSize = computeCellSize(level, state.mapRadius);

      applyLayout();
      syncDiffButtons();
      resetGame(options);
      // Endless: grow the honeycomb until it fills the canvas (+ buffer)
      if (state.endless) ensureWorldCoverage(true);
    }

    function resetGame(options = {}) {
      state.map.clear();
      state.camX = 0;
      state.camY = 0;
      state.camTX = 0;
      state.camTY = 0;
      state.focusCell = null;
      state.clearedSafe = 0;
      state.hitMaxRadius = false;
      state.centerX = canvas.width / 2 + state.boardOffset.x;
      state.centerY = canvas.height / 2 + state.boardOffset.y;

      for (let q = -state.mapRadius; q <= state.mapRadius; q++) {
        const r1 = Math.max(-state.mapRadius, -q - state.mapRadius);
        const r2 = Math.min(state.mapRadius, -q + state.mapRadius);
        for (let r = r1; r <= r2; r++) {
          const cell = new Cell(q, r);
          cell.calcGeometry(state.centerX, state.centerY, state.cellSize);
          state.map.set(`${q},${r}`, cell);
        }
      }

      state.isGameOver = false;
      state.isFirstClick = true;
      state.flagsPlaced = 0;
      state.timeElapsed = 0;
      state.hoveredKey = null;
      state.win = null;
      state.detonator = null;
      state.endReason = null;
      state.finishKey = null;
      state.floodPending = 0;
      state._growAfterFlood = false;
      // Endless: mineCount filled after first click by density
      if (state.endless) state.mineCount = 0;
      else {
        const conf = state.config[state.currentDifficulty];
        if (conf) state.mineCount = conf.mines;
      }
      stopTimer();
      updateUI();
      if (
        options.skipHooks !== true &&
        typeof state.hooks.onReset === "function"
      ) {
        state.hooks.onReset(api);
      }
    }

    function noteCleared(n) {
      if (n <= 0) return;
      state.clearedSafe += n;
      if (state.endless && state.clearedSafe > state.bestCleared) {
        state.bestCleared = state.clearedSafe;
        try {
          localStorage.setItem("hexsweeper-endless-best", String(state.bestCleared));
        } catch (_) {}
      }
    }

    function placeMines(safeQ, safeR) {
      const keys = Array.from(state.map.keys());
      shuffleInPlace(keys);
      let placed = 0;

      if (state.endless) {
        const density =
          state.mineDensity != null && Number.isFinite(state.mineDensity)
            ? state.mineDensity
            : ENDLESS_DENSITY.medium;
        for (const key of keys) {
          const cell = state.map.get(key);
          if (isSafeZone(cell, safeQ, safeR) || isProtectedCell(cell)) continue;
          if (Math.random() < density) {
            cell.isMine = true;
            placed++;
          }
        }
        // Guarantee at least a few mines on tiny boards
        if (placed < 3 && keys.length > 12) {
          for (const key of keys) {
            const cell = state.map.get(key);
            if (cell.isMine || isSafeZone(cell, safeQ, safeR) || isProtectedCell(cell)) {
              continue;
            }
            cell.isMine = true;
            placed++;
            if (placed >= 3) break;
          }
        }
      } else {
        const target = state.mineCount;
        for (const key of keys) {
          if (placed >= target) break;
          const cell = state.map.get(key);
          if (isSafeZone(cell, safeQ, safeR) || isProtectedCell(cell)) continue;
          cell.isMine = true;
          placed++;
        }
      }
      state.mineCount = placed;
      ensureFinishStamp();
      recountNeighbors();
    }

    /**
     * Grow the hex field by one or more rings (endless mode).
     * New cells get mines at mineDensity; neighbor counts refresh.
     */
    function expandMap(newRadius) {
      const cap = state.maxRadius || ENDLESS_MAX_RADIUS;
      const wanted = newRadius;
      newRadius = Math.min(newRadius, cap);
      if (newRadius <= state.mapRadius) {
        if (wanted > cap && !state.hitMaxRadius) {
          state.hitMaxRadius = true;
          if (typeof state.hooks.onMaxRadius === "function") {
            state.hooks.onMaxRadius(api, { radius: state.mapRadius, cap });
          }
        }
        return 0;
      }
      const oldR = state.mapRadius;
      const fresh = [];
      for (let R = oldR + 1; R <= newRadius; R++) {
        for (let q = -R; q <= R; q++) {
          const r1 = Math.max(-R, -q - R);
          const r2 = Math.min(R, -q + R);
          for (let r = r1; r <= r2; r++) {
            if (hexRing(q, r) !== R) continue;
            const key = `${q},${r}`;
            if (state.map.has(key)) continue;
            const cell = new Cell(q, r);
            cell.calcGeometry(state.centerX, state.centerY, state.cellSize);
            if (state.finishKey === key) cell.isFinish = true;
            state.map.set(key, cell);
            fresh.push(cell);
          }
        }
      }
      state.mapRadius = newRadius;
      ensureFinishStamp();

      if (!state.isFirstClick && fresh.length) {
        const density =
          state.mineDensity != null && Number.isFinite(state.mineDensity)
            ? state.mineDensity
            : ENDLESS_DENSITY.medium;
        let added = 0;
        // Freeze numbers on already-revealed cells: never place a mine adjacent
        // to a revealed cell, and only recount unrevealed cells afterward.
        const revealedKeys = new Set();
        state.map.forEach((c, k) => {
          if (c.revealed) revealedKeys.add(k);
        });
        // Eligible = not touching open (safe-band cells are forced clean).
        // Boost density on the rest so overall field density does not drift down
        // as the frontier expands (safe band would otherwise dilute mines).
        const eligible = [];
        for (const cell of fresh) {
          if (isProtectedCell(cell)) continue;
          const touchesOpen = getNeighbors(cell.q, cell.r).some((n) => n.revealed);
          if (!touchesOpen) eligible.push(cell);
        }
        const safeBand = fresh.length - eligible.length;
        const boost =
          eligible.length > 0 && safeBand > 0
            ? Math.min(0.42, density * (1 + (safeBand / fresh.length) * 1.35))
            : density;
        shuffleInPlace(eligible);
        for (const cell of eligible) {
          if (Math.random() < boost) {
            cell.isMine = true;
            added++;
          }
        }
        state.mineCount += added;
        // Recount only cells that were not revealed before this expand
        state.map.forEach((cell, key) => {
          if (revealedKeys.has(key)) return;
          if (!cell.isMine) {
            cell.neighborMines = getNeighbors(cell.q, cell.r).filter((n) => n.isMine).length;
          } else {
            cell.neighborMines = 0;
          }
        });
      }

      if (newRadius >= cap && !state.hitMaxRadius) {
        state.hitMaxRadius = true;
        if (typeof state.hooks.onMaxRadius === "function") {
          state.hooks.onMaxRadius(api, { radius: state.mapRadius, cap });
        }
      }

      if (typeof state.hooks.onExpand === "function") {
        state.hooks.onExpand(api, { oldRadius: oldR, newRadius, added: fresh.length });
      }
      updateUI();
      return fresh.length;
    }

    /**
     * Minimum map radius so every screen corner (plus buffer) has hex cells.
     * This is what makes the field feel infinite on the canvas — not a floating disc.
     */
    function radiusNeededForViewport() {
      const size = state.cellSize || 28;
      if (size <= 0) return state.mapRadius || 8;
      const w = Math.max(320, canvas.width || window.innerWidth || 800);
      const h = Math.max(320, canvas.height || window.innerHeight || 600);
      const camX = state.camX || 0;
      const camY = state.camY || 0;
      const pad = size * (ENDLESS_VIEW_BUFFER + 1);
      const samples = [
        [pad, pad],
        [w * 0.5, pad],
        [w - pad, pad],
        [pad, h * 0.5],
        [w - pad, h * 0.5],
        [pad, h - pad],
        [w * 0.5, h - pad],
        [w - pad, h - pad],
      ];
      let need = 0;
      for (const [sx, sy] of samples) {
        // Inverse of beforeFrame endless layout (no parallax): world = screen - center + cam
        const wx = sx - w / 2 + camX;
        const wy = sy - h / 2 + camY;
        const rFloat = wy / (size * 1.5);
        const qFloat = wx / (size * SQRT3) - rFloat / 2;
        const hr = hexRound(qFloat, rFloat);
        need = Math.max(need, hexRing(hr.q, hr.r));
      }
      return need + ENDLESS_VIEW_BUFFER;
    }

    /**
     * Grow the world until the viewport (and optionally the dig frontier) is covered.
     * @param {boolean} fillHard — allow larger jumps (boot / resize)
     */
    function ensureWorldCoverage(fillHard) {
      if (!state.endless || state.isGameOver) return 0;
      let want = radiusNeededForViewport();
      // Also keep headroom past any revealed cell so dig never hits a hard rim
      if (!state.isFirstClick) {
        state.map.forEach((c) => {
          if (c.revealed) want = Math.max(want, c.ring + ENDLESS_VIEW_BUFFER);
        });
      }
      if (want <= state.mapRadius) return 0;
      const cap = state.maxRadius || ENDLESS_MAX_RADIUS;
      const step = fillHard ? 8 : 4;
      let added = 0;
      let guard = 0;
      while (state.mapRadius < want && state.mapRadius < cap && guard < 24) {
        const next = Math.min(want, state.mapRadius + step, cap);
        added += expandMap(next);
        guard++;
        if (state.mapRadius < next) break; // hit expand no-op
      }
      return added;
    }

    /** @deprecated path — use ensureWorldCoverage; kept as alias for clarity */
    function maybeExpandFrontier() {
      ensureWorldCoverage(false);
    }

    function stepCamera() {
      if (!state.endless) return;
      // Smooth pan toward camTX (user drag / explicit setCamera only)
      state.camX += (state.camTX - state.camX) * 0.08;
      state.camY += (state.camTY - state.camY) * 0.08;
      // As the camera moves, grow the honeycomb so the canvas never shows empty space
      if (Math.abs(state.camTX - state.camX) > 0.5 || Math.abs(state.camTY - state.camY) > 0.5) {
        ensureWorldCoverage(false);
      }
    }

    function pixelToHex(x, y) {
      const px = x - state.centerX;
      const py = y - state.centerY;
      const q_float = ((SQRT3 / 3) * px - (1 / 3) * py) / state.cellSize;
      const r_float = ((2 / 3) * py) / state.cellSize;
      return hexRound(q_float, r_float);
    }

    function hexRound(q, r) {
      let s = -q - r;
      let rq = Math.round(q);
      let rr = Math.round(r);
      let rs = Math.round(s);
      const q_diff = Math.abs(rq - q);
      const r_diff = Math.abs(rr - r);
      const s_diff = Math.abs(rs - s);
      if (q_diff > r_diff && q_diff > s_diff) rq = -rr - rs;
      else if (r_diff > s_diff) rr = -rq - rs;
      return { q: rq, r: rr };
    }

    function canvasPointFromEvent(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      let clientX = e.clientX;
      let clientY = e.clientY;
      if (clientX == null && e.touches && e.touches[0]) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      }
      let x = (clientX - rect.left) * scaleX;
      let y = (clientY - rect.top) * scaleY;
      if (typeof state.hooks.transformPoint === "function") {
        const t = state.hooks.transformPoint({ x, y }, api);
        if (t) {
          x = t.x;
          y = t.y;
        }
      }
      return { x, y };
    }

    function cellAtPixel(x, y) {
      if (typeof state.hooks.hitTest === "function") {
        return state.hooks.hitTest(x, y, api);
      }
      // Path hit-test when skins move cells (parallax / warp)
      if (state.hooks.usePathHitTest) {
        let cells = Array.from(state.map.values());
        if (state.endless && cells.length > 200) {
          const pad = state.cellSize * 3;
          cells = cells.filter(
            (c) =>
              !c._offscreen &&
              c.x > x - pad &&
              c.x < x + pad &&
              c.y > y - pad &&
              c.y < y + pad
          );
        }
        // front-to-back: higher ring first
        cells.sort((a, b) => b.ring - a.ring || b.y - a.y);
        for (const cell of cells) {
          if (cell._riftTorn) continue;
          const scale = cell._depthScale || 1;
          const path = cell.hexPath(state.cellSize, scale);
          if (ctx.isPointInPath(path, x, y)) return cell;
        }
        return null;
      }
      const coords = pixelToHex(x, y);
      return state.map.get(`${coords.q},${coords.r}`) || null;
    }

    function getCellAtInput(e) {
      const p = canvasPointFromEvent(e);
      state.pointer.x = p.x;
      state.pointer.y = p.y;
      state.pointer.nx = (p.x / canvas.width) * 2 - 1;
      state.pointer.ny = (p.y / canvas.height) * 2 - 1;
      state.pointer.active = true;
      return cellAtPixel(p.x, p.y);
    }

    function cellActionHandled(cell, source, event) {
      const handler = state.hooks && state.hooks.onCellAction;
      return typeof handler === "function" && handler(cell, api, { source, event }) === true;
    }

    let lastClickTime = 0;
    let lastClickKey = null;
    let suppressTapReveal = false;
    let digSession = null; // { x, y, camX, camY, button, panned }
    let pinchStartDist = 0;
    let pinchStartZoom = 1;

    function handleMouseDown(e) {
      if (state.isGameOver && e.button === 0 && !state.spaceDown) return;
      const p = canvasPointFromEvent(e);
      state.pointer.x = p.x;
      state.pointer.y = p.y;
      state.pointer.nx = (p.x / canvas.width) * 2 - 1;
      state.pointer.ny = (p.y / canvas.height) * 2 - 1;
      state.pointer.active = true;

      // Middle-click or Space+drag → pan. Right / Ctrl / Cmd → flag.
      if (e.button === 1 || (e.button === 0 && state.spaceDown)) {
        e.preventDefault();
        digSession = {
          x: e.clientX,
          y: e.clientY,
          camX: state.camX,
          camY: state.camY,
          button: e.button,
          panned: true,
          forcePan: true,
        };
        state.panning = true;
        syncCursor();
        return;
      }
      if (e.button === 2 || (e.button === 0 && (e.ctrlKey || e.metaKey))) {
        e.preventDefault();
        const cell = cellAtPixel(p.x, p.y);
        if (cell) toggleFlag(cell);
        return;
      }
      if (e.button !== 0) return;
      digSession = {
        x: e.clientX,
        y: e.clientY,
        camX: state.camX,
        camY: state.camY,
        button: 0,
        panned: false,
        forcePan: false,
      };
    }

    function handleMouseMove(e) {
      const p = canvasPointFromEvent(e);
      state.pointer.x = p.x;
      state.pointer.y = p.y;
      state.pointer.nx = (p.x / canvas.width) * 2 - 1;
      state.pointer.ny = (p.y / canvas.height) * 2 - 1;
      state.pointer.active = true;

      if (digSession && (e.buttons & 1 || digSession.forcePan || digSession.button === 1)) {
        const dx = e.clientX - digSession.x;
        const dy = e.clientY - digSession.y;
        const dist = Math.hypot(dx, dy);
        const panThreshold = digSession.forcePan || state.endless ? 8 : 18;
        if (digSession.panned || dist > panThreshold) {
          // Fire fits → tilt; Fire zoomed past frame (or Space/middle) → pan.
          const lockTilt = isTiltDragOnly() && !digSession.forcePan;
          if (!digSession.panned) {
            digSession.panned = true;
            // Tilt-only: suppress dig-on-release, but keep hover for heat/tilt
            if (!lockTilt) {
              state.panning = true;
              state.hoveredKey = null;
            }
            syncCursor();
          }
          if (!lockTilt) {
            // Absolute pan from drag origin (stable, no acceleration drift)
            state.camX = digSession.camX - dx;
            state.camY = digSession.camY - dy;
            state.camTX = state.camX;
            state.camTY = state.camY;
            state.focusCell = null;
            if (isCameraLocked() && !state.endless) clampCameraToBoard();
            if (state.endless) ensureWorldCoverage(false);
            return;
          }
          // Fall through: pointer already updated → pit tilt + cell hover
        }
      }

      if (state.isGameOver) {
        syncCursor();
        return;
      }
      const cell = cellAtPixel(p.x, p.y);
      state.hoveredKey = cell ? `${cell.q},${cell.r}` : null;
      syncCursor();
    }

    function handleMouseUp(e) {
      const wasPan = digSession && digSession.panned;
      const wasForcePan = digSession && digSession.forcePan;
      digSession = null;
      state.panning = false;
      syncCursor();
      if (wasPan) {
        // Camera moved — let endless autosave capture the new viewport
        if (!isTiltDragOnly() || wasForcePan) {
          if (typeof state.hooks.onPersistTick === "function") state.hooks.onPersistTick(api);
        }
        return;
      }
      if (state.isGameOver) return;
      if (e.button !== 0 || e.ctrlKey || e.metaKey || state.spaceDown) return;
      const cell = getCellAtInput(e);
      if (!cell) return;
      if (cellActionHandled(cell, "pointer", e)) return;
      const now = Date.now();
      const key = `${cell.q},${cell.r}`;
      if (state.flagMode) {
        if (!cell.revealed) toggleFlag(cell);
        return;
      }
      // Chord only when double-clicking the *same* revealed cell
      if (now - lastClickTime < 300 && cell.revealed && key === lastClickKey) chord(cell);
      else if (!cell.revealed && !cell.flagged) reveal(cell);
      else if (cell.revealed) {
        // Single click on a satisfied number also chords (faster than double-click)
        const flags = getNeighbors(cell.q, cell.r).filter((n) => n.flagged).length;
        if (flags === cell.neighborMines && cell.neighborMines > 0) chord(cell);
      }
      lastClickTime = now;
      lastClickKey = key;
    }

    let longPressTimer;
    let touchStartPos;
    let touchStartKey = null;
    let touchMoved = false;
    let touchFlagged = false;
    let touchPanOrigin = null;

    /** Fire (and similar): theme wants pit-tilt chrome rather than free pan. */
    function isCameraLocked() {
      const lock = state.hooks && state.hooks.cameraLock;
      if (typeof lock === "function") return !!lock(api);
      return !!lock;
    }

    /**
     * Tilt-only drag while the locked board still fits the viewport.
     * Once zoom overflows the frame, drag pans (clamped) so rim tiles stay reachable.
     */
    function isTiltDragOnly() {
      return isCameraLocked() && !boardOverflowsViewport();
    }

    function handleTouchStart(e) {
      e.preventDefault();
      if (e.touches.length === 2) {
        clearTimeout(longPressTimer);
        const a = e.touches[0];
        const b = e.touches[1];
        pinchStartDist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) || 1;
        pinchStartZoom = state.viewZoom;
        touchMoved = true;
        suppressTapReveal = true;
        touchStartPos = null;
        return;
      }
      if (state.isGameOver) return;
      touchFlagged = false;
      touchMoved = false;
      suppressTapReveal = false;
      const cell = getCellAtInput(e);
      touchStartPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      touchPanOrigin = { camX: state.camX, camY: state.camY };
      if (cell) {
        touchStartKey = `${cell.q},${cell.r}`;
        state.hoveredKey = touchStartKey;
        // Long-press flags on touch (no separate mode required)
        longPressTimer = setTimeout(() => {
          if (navigator.vibrate) navigator.vibrate(50);
          toggleFlag(cell);
          touchFlagged = true;
          suppressTapReveal = true;
          state.hoveredKey = null;
        }, 420);
      } else {
        touchStartKey = null;
      }
    }
    function handleTouchMove(e) {
      e.preventDefault();
      if (e.touches.length === 2) {
        clearTimeout(longPressTimer);
        const a = e.touches[0];
        const b = e.touches[1];
        const dist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) || 1;
        const mid = canvasPointFromEvent({
          clientX: (a.clientX + b.clientX) / 2,
          clientY: (a.clientY + b.clientY) / 2,
        });
        applyViewZoom(pinchStartZoom * (dist / pinchStartDist), mid);
        touchMoved = true;
        suppressTapReveal = true;
        state.panning = false;
        return;
      }
      if (!touchStartPos) return;
      const dx = e.touches[0].clientX - touchStartPos.x;
      const dy = e.touches[0].clientY - touchStartPos.y;
      if (Math.hypot(dx, dy) > 10) {
        touchMoved = true;
        clearTimeout(longPressTimer);
        // Fire fits the frame → tilt; zoomed past the frame → clamped pan to the rim.
        if (isTiltDragOnly()) {
          handleMouseMove(e);
          return;
        }
        state.hoveredKey = null;
        state.panning = true;
        // Pan the camera (endless plates + zoomed Fire / finite boards)
        if (touchPanOrigin) {
          state.camX = touchPanOrigin.camX - dx;
          state.camY = touchPanOrigin.camY - dy;
          state.camTX = state.camX;
          state.camTY = state.camY;
          state.focusCell = null;
          if (isCameraLocked() && !state.endless) clampCameraToBoard();
          if (state.endless) ensureWorldCoverage(false);
        }
        const p = canvasPointFromEvent(e);
        state.pointer.x = p.x;
        state.pointer.y = p.y;
        state.pointer.nx = (p.x / canvas.width) * 2 - 1;
        state.pointer.ny = (p.y / canvas.height) * 2 - 1;
        state.pointer.active = true;
        syncCursor();
        return;
      }
      handleMouseMove(e);
    }
    function handleTouchEnd(e) {
      e.preventDefault();
      clearTimeout(longPressTimer);
      state.panning = false;
      syncCursor();
      if (e.touches && e.touches.length > 0) {
        // Still one finger down after pinch — ignore residual tap
        suppressTapReveal = true;
        return;
      }
      // Locked pit: ease parallax back to center when the finger lifts
      if (isCameraLocked()) {
        state.pointer.nx = 0;
        state.pointer.ny = 0;
        state.pointer.active = false;
      }
      if (suppressTapReveal || touchFlagged || touchMoved) {
        if (touchMoved && !isTiltDragOnly() && typeof state.hooks.onPersistTick === "function") {
          state.hooks.onPersistTick(api);
        }
        suppressTapReveal = false;
        touchFlagged = false;
        touchMoved = false;
        state.hoveredKey = null;
        touchStartPos = null;
        touchStartKey = null;
        touchPanOrigin = null;
        return;
      }
      const key = touchStartKey || state.hoveredKey;
      if (key && !state.isGameOver) {
        const cell = state.map.get(key);
        if (cell) {
          if (cellActionHandled(cell, "touch", e)) {
            state.hoveredKey = null;
            touchStartPos = null;
            touchStartKey = null;
            touchPanOrigin = null;
            touchMoved = false;
            return;
          }
          if (state.flagMode) {
            if (!cell.revealed) toggleFlag(cell);
          } else if (!cell.flagged && !cell.revealed) reveal(cell);
          else if (cell.revealed) chord(cell);
        }
      }
      state.hoveredKey = null;
      touchStartPos = null;
      touchStartKey = null;
      touchPanOrigin = null;
      touchMoved = false;
    }

    function handleWheel(e) {
      e.preventDefault();
      const anchor = canvasPointFromEvent(e);
      const factor = e.deltaY < 0 ? 1.08 : 1 / 1.08;
      applyViewZoom(state.viewZoom * factor, anchor);
    }

    function reveal(cell) {
      if (!cell || cell._riftTorn || cell._pendingReveal) return;
      if (state.isFirstClick) {
        startTimer();
        placeMines(cell.q, cell.r);
        state.isFirstClick = false;
      }
      cell.revealed = true;
      if (!cell.isMine) noteCleared(1);
      if (typeof state.hooks.onReveal === "function") {
        state.hooks.onReveal(cell, api, { source: "dig" });
      }
      if (cell.isMine) {
        state.detonator = cell;
        gameOver(false);
      } else {
        openFrontier(cell);
        if (!state.floodPending) checkWin();
      }
    }

    /** Flood empties, then grow the infinite field and re-flood into new rings. */
    function openFrontier(seed) {
      if (seed && seed.neighborMines === 0) floodFrom(seed);
      if (!state.endless) {
        // Finite: win check runs when the reveal wave settles.
        if (!state.floodPending) checkWin();
        return;
      }
      if (state.floodPending > 0) {
        // Grow after the wave finishes so new rings can cascade.
        state._growAfterFlood = true;
        return;
      }
      growEndlessFrontier();
    }

    function growEndlessFrontier() {
      for (let i = 0; i < 8; i++) {
        const r0 = state.mapRadius;
        ensureWorldCoverage(false);
        if (state.mapRadius === r0) break;
        // New empty cells adjacent to opened zeros should keep cascading
        const seeds = [];
        state.map.forEach((c) => {
          if (c.revealed && !c.isMine && c.neighborMines === 0) seeds.push(c);
        });
        for (const s of seeds) floodFrom(s);
        if (state.floodPending > 0) {
          state._growAfterFlood = true;
          return;
        }
      }
      checkWin();
    }

    /**
     * Classic empty-cell flood, but cells open in BFS rings from the dig so
     * the clearing reads as a wave out to the numbered boundary — not a poof.
     */
    function floodFrom(startCell) {
      const queue = [{ cell: startCell, dist: 0 }];
      const visited = new Set([`${startCell.q},${startCell.r}`]);
      const wave = [];
      while (queue.length > 0) {
        const { cell: current, dist } = queue.shift();
        for (const n of getNeighbors(current.q, current.r)) {
          const k = `${n.q},${n.r}`;
          if (
            visited.has(k) ||
            n.revealed ||
            n._pendingReveal ||
            n.flagged ||
            n.isMine ||
            n._riftTorn
          ) {
            continue;
          }
          visited.add(k);
          const nextDist = dist + 1;
          wave.push({ cell: n, dist: nextDist });
          if (n.neighborMines === 0) queue.push({ cell: n, dist: nextDist });
        }
      }
      if (!wave.length) return;

      const reduceMotion = effectsReduced();
      const now = performance.now();
      // Pace by ring distance; cap so huge clears still finish in about a second.
      const stepMs = reduceMotion ? 0 : 32;
      for (const { cell, dist } of wave) {
        cell._pendingReveal = true;
        cell.revealDue = now + Math.min(dist * stepMs, reduceMotion ? 0 : 920);
        cell.animReveal = 0;
      }
      state.floodPending = (state.floodPending || 0) + wave.length;
      stepRevealWave();
    }

    function commitFloodReveal(cell) {
      if (!cell || cell.revealed) {
        if (cell && cell._pendingReveal) {
          cell._pendingReveal = false;
          state.floodPending = Math.max(0, (state.floodPending || 1) - 1);
        }
        return;
      }
      cell.revealed = true;
      cell._pendingReveal = false;
      cell.revealDue = 0;
      cell.animReveal = 0;
      state.floodPending = Math.max(0, (state.floodPending || 1) - 1);
      if (!cell.isMine) noteCleared(1);
      if (typeof state.hooks.onReveal === "function") {
        state.hooks.onReveal(cell, api, { source: "flood" });
      }
    }

    function stepRevealWave() {
      if (!state.floodPending) return;
      const now = performance.now();
      let opened = 0;
      state.map.forEach((c) => {
        if (c._pendingReveal && now >= (c.revealDue || 0)) {
          commitFloodReveal(c);
          opened++;
        }
      });
      if (!opened) return;
      updateUI();
      if (state.floodPending > 0) return;
      if (state._growAfterFlood) {
        state._growAfterFlood = false;
        growEndlessFrontier();
      } else {
        checkWin();
      }
    }

    function toggleFlag(cell) {
      if (!cell || cell.revealed || cell._pendingReveal || cell._riftTorn) return;
      if (isProtectedCell(cell)) {
        if (typeof state.hooks.onProtectedFlag === "function") {
          state.hooks.onProtectedFlag(cell, api);
        }
        return;
      }
      cell.flagged = !cell.flagged;
      state.flagsPlaced += cell.flagged ? 1 : -1;
      updateUI();
      if (typeof state.hooks.onFlag === "function") state.hooks.onFlag(cell, api);
    }

    function chord(cell) {
      const neighbors = getNeighbors(cell.q, cell.r);
      const flagged = neighbors.filter((n) => n.flagged).length;
      if (flagged === cell.neighborMines) {
        let hitMine = false;
        for (const n of neighbors) {
          if (!n.revealed && !n.flagged && !n._riftTorn) {
            n.revealed = true;
            if (!n.isMine) noteCleared(1);
            if (typeof state.hooks.onReveal === "function") {
              state.hooks.onReveal(n, api, { source: "chord" });
            }
            if (n.isMine) {
              hitMine = true;
              if (!state.detonator) state.detonator = n;
            } else if (n.neighborMines === 0) floodFrom(n);
          }
        }
        if (hitMine) gameOver(false);
        else {
          openFrontier(null);
          if (!state.floodPending) checkWin();
        }
      }
    }

    function checkWin() {
      // Endless Soft White: no clear-the-board win — the field keeps expanding.
      // Escape: revealing the finish hex is a positive exit.
      if (state.endless) {
        if (state.finishKey) {
          const fin = state.map.get(state.finishKey);
          if (fin && fin.revealed && !fin.isMine) {
            state.endReason = "finish";
            gameOver(true);
            return;
          }
        }
        updateUI();
        return;
      }
      let revealed = 0;
      state.map.forEach((c) => {
        if (c.revealed) revealed++;
      });
      if (revealed === state.map.size - state.mineCount) gameOver(true);
    }

    function gameOver(win) {
      state.isGameOver = true;
      state.win = win;
      stopTimer();
      const reason = state.endReason || (win ? "win" : "mine");
      // Rift catch: don't spoil the board with revealed mines — the tear is the death.
      if (!win && reason !== "rift")
        state.map.forEach((c) => {
          if (c.isMine && !c.flagged) c.revealed = true;
        });
      else if (win) {
        state.map.forEach((c) => {
          if (c.isMine) c.flagged = true;
        });
        state.flagsPlaced = state.mineCount;
        updateUI();
        state.detonator = null;
      }
      if (typeof state.hooks.onGameOver === "function") {
        state.hooks.onGameOver(win, api, { detonator: state.detonator, reason });
      }
    }

    function startTimer(resumeAt) {
      if (state.timerInterval) return;
      if (Number.isFinite(resumeAt)) state.timeElapsed = Math.max(0, resumeAt | 0);
      else state.timeElapsed = 0;
      state.timerInterval = setInterval(() => {
        state.timeElapsed++;
        updateUI();
        if (typeof state.hooks.onPersistTick === "function") {
          state.hooks.onPersistTick(api);
        }
      }, 1000);
    }
    function stopTimer() {
      clearInterval(state.timerInterval);
      state.timerInterval = null;
    }

    /**
     * Pack a run for localStorage / file export. Only stores mines, revealed,
     * flagged, and torn cells — sparse vs the complete board map.
     */
    function exportRunState() {
      if (state.endless) ensureFinishStamp();
      const mines = [];
      const revealed = [];
      const flagged = [];
      const torn = [];
      state.map.forEach((c) => {
        const key = `${c.q},${c.r}`;
        if (c.isMine && !isFinishCell(c)) mines.push(key);
        if (c.revealed) revealed.push(key);
        if (c.flagged) flagged.push(key);
        if (c._riftTorn) torn.push(key);
      });
      return {
        v: 1,
        endless: !!state.endless,
        difficulty: state.currentDifficulty,
        density: state.mineDensity,
        radius: state.mapRadius,
        first: !!state.isFirstClick,
        over: !!state.isGameOver,
        win: state.win,
        endReason: state.endReason || null,
        finish: state.finishKey || null,
        cleared: state.clearedSafe | 0,
        flags: state.flagsPlaced | 0,
        mineCount: state.mineCount | 0,
        time: state.timeElapsed | 0,
        cam: [state.camX || 0, state.camY || 0],
        zoom: Number.isFinite(state.viewZoom) ? state.viewZoom : 1,
        mines,
        revealed,
        flagged,
        torn,
      };
    }

    function exportEndlessState() {
      return state.endless ? exportRunState() : null;
    }

    function buildMapToRadius(radius) {
      const R = Math.max(1, radius | 0);
      state.map.clear();
      state.centerX = canvas.width / 2 + state.boardOffset.x;
      state.centerY = canvas.height / 2 + state.boardOffset.y;
      for (let q = -R; q <= R; q++) {
        const r1 = Math.max(-R, -q - R);
        const r2 = Math.min(R, -q + R);
        for (let r = r1; r <= r2; r++) {
          const cell = new Cell(q, r);
          cell.calcGeometry(state.centerX, state.centerY, state.cellSize);
          state.map.set(`${q},${r}`, cell);
        }
      }
      state.mapRadius = R;
    }

    function applyKeyList(list, fn) {
      if (!Array.isArray(list)) return;
      for (const key of list) {
        if (typeof key !== "string") continue;
        let cell = state.map.get(key);
        if (!cell) {
          const parts = key.split(",");
          const q = parseInt(parts[0], 10);
          const r = parseInt(parts[1], 10);
          if (!Number.isFinite(q) || !Number.isFinite(r)) continue;
          cell = new Cell(q, r);
          cell.calcGeometry(state.centerX, state.centerY, state.cellSize);
          state.map.set(key, cell);
          state.mapRadius = Math.max(state.mapRadius, cell.ring);
        }
        fn(cell);
      }
    }

    /** Restore a snapshot for the currently booted topology. */
    function applyRunState(data) {
      if (!data || data.v !== 1 || typeof data.endless !== "boolean") return false;
      if (!!data.endless !== !!state.endless) return false;
      stopTimer();
      if (data.difficulty && state.config[data.difficulty]) {
        state.currentDifficulty = data.difficulty;
      }
      if (Number.isFinite(data.density)) {
        state.mineDensity = data.density;
        state._densityLocked = true;
      }
      const conf = state.config[state.currentDifficulty];
      state.cellSize = computeCellSize(
        state.currentDifficulty,
        Math.max(conf?.radius || 6, data.radius | 0)
      );
      applyLayout();
      syncDiffButtons();

      const R = Math.max(conf?.radius || 6, data.radius | 0);
      buildMapToRadius(R);

      // Clear defaults then stamp sparse lists
      state.map.forEach((c) => {
        c.isMine = false;
        c.isFinish = false;
        c.revealed = false;
        c.flagged = false;
        c._riftTorn = false;
        c.neighborMines = 0;
        c.animReveal = 0;
      });
      applyKeyList(data.mines, (c) => {
        c.isMine = true;
      });
      applyKeyList(data.revealed, (c) => {
        c.revealed = true;
        c.animReveal = 1;
        c._pendingReveal = false;
      });
      applyKeyList(data.flagged, (c) => {
        c.flagged = true;
      });
      applyKeyList(data.torn, (c) => {
        c._riftTorn = true;
        c._blastAlpha = 0.15;
      });

      state.isFirstClick = !!data.first;
      state.isGameOver = !!data.over;
      state.win = data.win == null ? null : !!data.win;
      state.endReason = data.endReason || null;
      state.clearedSafe = data.cleared | 0;
      state.flagsPlaced = data.flags | 0;
      state.mineCount = Number.isFinite(data.mineCount)
        ? data.mineCount | 0
        : Array.isArray(data.mines)
          ? data.mines.length
          : 0;
      // Escape finish (axial key) — never a mine; stamp after mineCount restore.
      if (state.endless && typeof data.finish === "string" && data.finish.includes(",")) {
        const parts = data.finish.split(",");
        setFinishCell(parseInt(parts[0], 10), parseInt(parts[1], 10));
      } else {
        state.finishKey = null;
      }
      if (state.endless) ensureFinishStamp();
      recountNeighbors();
      state.timeElapsed = data.time | 0;
      state.detonator = null;
      state.hitMaxRadius = false;
      if (Array.isArray(data.cam) && data.cam.length >= 2) {
        state.camX = Number(data.cam[0]) || 0;
        state.camY = Number(data.cam[1]) || 0;
        state.camTX = state.camX;
        state.camTY = state.camY;
      }
      if (Number.isFinite(data.zoom)) {
        // Restoring a lane's view, not choosing a zoom: leave the shared
        // preference to explicit wheel / pinch / button input.
        applyViewZoom(data.zoom, null, { persist: false });
      }

      updateUI();
      if (!state.isFirstClick && !state.isGameOver) {
        startTimer(state.timeElapsed);
      }
      if (typeof state.hooks.onRelayout === "function") state.hooks.onRelayout(api);
      // Endless restores may need another ring to cover a changed viewport.
      if (state.endless && !state.isGameOver) ensureWorldCoverage(true);
      return true;
    }

    function applyEndlessState(data) {
      if (!data || !data.endless || !state.endless) return false;
      return applyRunState(data);
    }

    function updateUI() {
      if (!statsMines || !statsTime) return;
      if (state.endless) {
        // Mines left · cells cleared (score); title includes best
        const left = Math.max(0, state.mineCount - state.flagsPlaced);
        statsMines.innerText = left >= 100 ? String(left) : left.toString().padStart(2, "0");
        const score = state.clearedSafe || 0;
        statsTime.innerText =
          score >= 1000 ? String(score) : score.toString().padStart(3, "0");
        statsMines.title = "Mines remaining (unflagged estimate)";
        statsMines.setAttribute("data-label", "mines");
        const best = state.bestCleared || 0;
        statsTime.title =
          best > score
            ? `Safe cells cleared · best ${best}`
            : best > 0
              ? `Safe cells cleared · best ${best}`
              : "Safe cells cleared (score)";
        statsTime.setAttribute("data-label", best > 0 ? `best ${best}` : "cleared");
      } else {
        const left = Math.max(0, state.mineCount - state.flagsPlaced);
        statsMines.innerText = left.toString().padStart(2, "0");
        statsTime.innerText = Math.min(999, state.timeElapsed).toString().padStart(3, "0");
        statsMines.title = "Mines remaining";
        statsTime.title = "Time";
        statsMines.setAttribute("data-label", "mines");
        statsTime.setAttribute("data-label", "time");
      }
    }

    function drawDefaultCell(cell, size) {
      const T = state.theme;
      const scale = 0.92 + cell.animHover * 0.05;
      const drawPath = cell.hexPath(size, scale);
      const drawSize = size * scale;

      ctx.fillStyle = cell.revealed ? T.revealed || T.covered : T.covered;
      ctx.fill(drawPath);
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      if (cell.animReveal < 0.99) {
        const opacity = 1 - cell.animReveal;
        ctx.globalAlpha = opacity;
        ctx.strokeStyle = T.shadowLight;
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i = 3; i <= 5; i++) {
          const angle = (Math.PI / 180) * (30 + 60 * i);
          const vx = cell.x + drawSize * Math.cos(angle);
          const vy = cell.y + drawSize * Math.sin(angle);
          if (i === 3) ctx.moveTo(vx, vy);
          else ctx.lineTo(vx, vy);
        }
        ctx.stroke();
        ctx.strokeStyle = T.shadowDark;
        ctx.beginPath();
        for (let i = 0; i <= 2; i++) {
          const angle = (Math.PI / 180) * (30 + 60 * i);
          const vx = cell.x + drawSize * Math.cos(angle);
          const vy = cell.y + drawSize * Math.sin(angle);
          if (i === 0) ctx.moveTo(vx, vy);
          else ctx.lineTo(vx, vy);
        }
        ctx.stroke();
      }

      if (cell.animReveal > 0.01) {
        ctx.globalAlpha = cell.animReveal;
        ctx.strokeStyle = T.pressedDark || "#c8d0d9";
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i = 3; i <= 5; i++) {
          const angle = (Math.PI / 180) * (30 + 60 * i);
          const vx = cell.x + drawSize * Math.cos(angle);
          const vy = cell.y + drawSize * Math.sin(angle);
          if (i === 3) ctx.moveTo(vx, vy);
          else ctx.lineTo(vx, vy);
        }
        ctx.stroke();
        ctx.strokeStyle = T.pressedLight || "#ffffff";
        ctx.beginPath();
        for (let i = 0; i <= 2; i++) {
          const angle = (Math.PI / 180) * (30 + 60 * i);
          const vx = cell.x + drawSize * Math.cos(angle);
          const vy = cell.y + drawSize * Math.sin(angle);
          if (i === 0) ctx.moveTo(vx, vy);
          else ctx.lineTo(vx, vy);
        }
        ctx.stroke();
      }

      ctx.globalAlpha = 1;

      if (cell.animReveal > 0.1) {
        ctx.globalAlpha = cell.animReveal;
        if (cell.isMine) {
          ctx.fillStyle = T.text.mine;
          ctx.beginPath();
          ctx.arc(cell.x, cell.y, size * 0.4, 0, Math.PI * 2);
          ctx.fill();
        } else if (cell.neighborMines > 0) {
          ctx.fillStyle = T.text[cell.neighborMines] || "#333";
          ctx.font = `700 ${size}px "Segoe UI", system-ui, sans-serif`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(cell.neighborMines, cell.x, cell.y + size * 0.05);
        }
        ctx.globalAlpha = 1;
      }

      if (cell.flagged && !cell.revealed) {
        ctx.fillStyle = T.flag;
        ctx.font = `bold ${size}px sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("!", cell.x, cell.y + size * 0.1);
      }
    }

    function updateCell(cell) {
      if (cell._offscreen) return;
      const isHovered = state.hoveredKey === `${cell.q},${cell.r}` && !state.isGameOver;
      cell.animHover += ((isHovered ? 1 : 0) - cell.animHover) * 0.2;
      cell.animReveal += ((cell.revealed ? 1 : 0) - cell.animReveal) * 0.15;
    }

    /** Canvas on-screen (IntersectionObserver) — offscreen iframes / desk pens rest. */
    let frameVisible = true;
    let lastPaintTs = 0;
    const inIframe = typeof window !== "undefined" && window.self !== window.top;

    function isEndlessIdle(ts) {
      if (!state.endless) return false;
      const z = Number.isFinite(state.viewZoom) ? state.viewZoom : 1;
      if (z >= 0.87) return false;
      const camMoving =
        Math.abs(state.camTX - state.camX) > 0.5 || Math.abs(state.camTY - state.camY) > 0.5;
      if (camMoving || state.pointer.active) return false;
      if (state.revealWave && state.revealWave.length) return false;
      if (state.hoveredKey) return false;
      if (typeof state.hooks.isFrameBusy === "function" && state.hooks.isFrameBusy(api, ts)) {
        return false;
      }
      return true;
    }

    function framePaintInterval(ts) {
      if (!isEndlessIdle(ts)) return 0;
      // Zoomed-out endless plate: 15 fps standalone, 5 fps in embeds / background pens.
      if (inIframe || !frameVisible) return 200;
      return 66;
    }

    function resumeGameLoop() {
      if (rafId) return;
      if (typeof document !== "undefined" && document.hidden) return;
      if (!frameVisible) return;
      rafId = requestAnimationFrame(gameLoop);
    }

    let rafId = 0;
    function gameLoop(ts) {
      rafId = 0;
      // Hidden tabs / offscreen canvas: stop painting so endless Soft UI rests.
      if (typeof document !== "undefined" && document.hidden) return;
      if (!frameVisible) return;

      const minGap = framePaintInterval(ts);
      if (minGap > 0 && ts - lastPaintTs < minGap) {
        rafId = requestAnimationFrame(gameLoop);
        return;
      }
      lastPaintTs = ts;

      state.now = ts - state.t0;
      stepRevealWave();
      stepCamera();
      // Periodic coverage check (camera settled / first frames after boot)
      if (state.endless && (ts | 0) % 8 === 0) ensureWorldCoverage(false);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (typeof state.hooks.beforeFrame === "function") state.hooks.beforeFrame(ctx, api);

      // Draw far rings first for depth skins that sort
      let cells = Array.from(state.map.values());
      // Endless: cull parked / off-screen tiles (beforeFrame sets _offscreen).
      if (state.endless) {
        cells = cells.filter((c) => !c._offscreen);
        if (cells.length > 200) {
          const pad = state.cellSize * 3;
          const w = canvas.width;
          const h = canvas.height;
          cells = cells.filter(
            (c) => c.x > -pad && c.y > -pad && c.x < w + pad && c.y < h + pad
          );
        }
      }
      if (state.hooks.sortCells) cells.sort(state.hooks.sortCells);
      else cells.sort((a, b) => a.ring - b.ring || a.y - b.y);

      for (const cell of cells) {
        updateCell(cell);
        if (typeof state.hooks.drawCell === "function") state.hooks.drawCell(ctx, cell, state.cellSize, api);
        else drawDefaultCell(cell, state.cellSize);
        if (typeof state.hooks.decorateCell === "function")
          state.hooks.decorateCell(ctx, cell, state.cellSize, api);
      }

      if (typeof state.hooks.afterFrame === "function") state.hooks.afterFrame(ctx, api);
      rafId = requestAnimationFrame(gameLoop);
    }
    if (typeof document !== "undefined" && document.addEventListener) {
      document.addEventListener("visibilitychange", () => {
        resumeGameLoop();
      });
    }
    if (typeof IntersectionObserver !== "undefined") {
      const frameObserver = new IntersectionObserver(
        (entries) => {
          frameVisible = entries.some((e) => e.isIntersecting && e.intersectionRatio > 0);
          if (frameVisible) resumeGameLoop();
        },
        { threshold: [0, 0.01] }
      );
      frameObserver.observe(canvas);
    }
    if (typeof document !== "undefined" && document.addEventListener && inIframe) {
      window.addEventListener("focus", resumeGameLoop);
      window.addEventListener("blur", () => {
        if (rafId) {
          cancelAnimationFrame(rafId);
          rafId = 0;
        }
      });
    }

    canvas.addEventListener("mousemove", handleMouseMove);
    canvas.addEventListener("mousedown", handleMouseDown);
    canvas.addEventListener("mouseup", handleMouseUp);
    window.addEventListener("mouseup", (e) => {
      if (digSession) handleMouseUp(e);
    });
    canvas.addEventListener("mouseout", () => {
      if (!digSession) {
        state.hoveredKey = null;
        state.pointer.active = false;
        // Locked pits ease back to a calm center when the pointer leaves
        if (isCameraLocked()) {
          state.pointer.nx = 0;
          state.pointer.ny = 0;
        }
        syncCursor();
      }
    });
    canvas.addEventListener("contextmenu", (e) => e.preventDefault());
    canvas.addEventListener("wheel", handleWheel, { passive: false });
    canvas.addEventListener("touchstart", handleTouchStart, { passive: false });
    canvas.addEventListener("touchend", handleTouchEnd, { passive: false });
    canvas.addEventListener("touchcancel", handleTouchEnd, { passive: false });
    canvas.addEventListener("touchmove", handleTouchMove, { passive: false });
    // Never reset the run on viewport change — endless depends on this.
    let resizeTimer = null;
    const scheduleRelayout = () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => relayout(), 80);
    };
    window.addEventListener("resize", scheduleRelayout);
    // Mobile URL-bar show/hide changes visualViewport without always firing resize.
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", scheduleRelayout);
      window.visualViewport.addEventListener("scroll", scheduleRelayout);
    }

    window.addEventListener("keydown", (e) => {
      if (
        e.target &&
        (e.target.closest?.("button, a, input, textarea, select, [contenteditable='true']") ||
          /input|textarea|select/i.test(e.target.tagName))
      ) {
        return;
      }
      if (e.code === "Space") {
        state.spaceDown = true;
        if (!e.repeat) e.preventDefault();
        syncCursor();
      }
      if (e.key === "Escape") {
        closeModal();
      }
      if ((e.key === "+" || e.key === "=") && !e.metaKey && !e.ctrlKey) {
        e.preventDefault();
        applyViewZoom(state.viewZoom * 1.1, {
          x: canvas.width / 2,
          y: canvas.height / 2,
        });
      }
      if ((e.key === "-" || e.key === "_") && !e.metaKey && !e.ctrlKey) {
        e.preventDefault();
        applyViewZoom(state.viewZoom / 1.1, {
          x: canvas.width / 2,
          y: canvas.height / 2,
        });
      }
      if ((e.key === "f" || e.key === "F") && !e.metaKey && !e.ctrlKey) {
        api.toggleFlagMode();
      }
      if ((e.key === "r" || e.key === "R") && !e.metaKey && !e.ctrlKey) {
        if (!modal || !modal.classList.contains("open")) {
          api.restart();
        }
      }
    });
    window.addEventListener("keyup", (e) => {
      if (e.code === "Space") {
        state.spaceDown = false;
        syncCursor();
      }
    });

    updateStatsVisibility();
    // Skins finish chrome first, then call startFreshRun or restore — see index.html.
    setDifficulty(state.currentDifficulty, { skipHooks: true });
    // Re-apply persisted zoom after first layout (startFreshRun may override).
    if (Math.abs(state.viewZoom - 1) > 0.01) {
      applyViewZoom(state.viewZoom);
    }
    syncCursor();
    rafId = requestAnimationFrame(gameLoop);

    // Expose relayout for skins / debug
    api.relayout = relayout;

    return api;
  }

  global.Hexsweeper = {
    boot,
    DEFAULT_THEME,
    DEFAULT_CONFIG,
    SQRT3,
    EFFECTS_KEY,
    effectsReduced,
    applyEffectsAttribute,
  };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
// materials/shader-comet + motifs/meteor-sky
const sparks = [];
const streaks = [];
function spark(x,y,n=12){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=0.8+Math.random()*3;
    sparks.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,r:1+Math.random()*2});
  }
}
// ambient streaks
for(let i=0;i<8;i++){
  streaks.push({
    x: Math.random(), y: Math.random(),
    len: 40+Math.random()*80, speed: 0.002+Math.random()*0.004,
    ang: -0.6 - Math.random()*0.4, w: 1+Math.random()*1.5
  });
}

Hexsweeper.boot({
  theme: {
    bg:"#000", shadowLight:"#b59c18", shadowDark:"#1b0a03",
    covered:"#510e05", revealed:"#2a0a04", flag:"#b59c18",
    pressedDark:"#140600", pressedLight:"#b59c18",
    text:{1:"#f5d76e",2:"#ff8c42",3:"#ff4d4d",4:"#e8c547",5:"#ffb347",6:"#ff6b6b",mine:"#fff5d6"}
  },
  hooks: {
    onReveal(cell){ spark(cell.x, cell.y, cell.isMine?40:8); },
    beforeFrame(ctx, api){
      const s=api.state, t=s.now*0.001;
      // polar noise-ish void
      const g=ctx.createRadialGradient(s.centerX, s.centerY, 10, s.centerX, s.centerY, s.canvas.width*0.5);
      g.addColorStop(0,"rgba(81,14,5,0.35)");
      g.addColorStop(0.5,"rgba(64,27,0,0.2)");
      g.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle=g; ctx.fillRect(0,0,s.canvas.width,s.canvas.height);
      // meteor streaks
      ctx.save();
      ctx.globalCompositeOperation="lighter";
      for(const st of streaks){
        st.x += Math.cos(st.ang)*st.speed;
        st.y += Math.sin(st.ang)*st.speed;
        if(st.x<-0.2||st.y<-0.2||st.x>1.2||st.y>1.2){
          st.x = Math.random(); st.y = -0.05; 
        }
        const x=st.x*s.canvas.width, y=st.y*s.canvas.height;
        const x2=x+Math.cos(st.ang)*st.len, y2=y+Math.sin(st.ang)*st.len;
        const lg=ctx.createLinearGradient(x,y,x2,y2);
        lg.addColorStop(0,"rgba(255,200,80,0)");
        lg.addColorStop(0.7,"rgba(255,180,60,0.55)");
        lg.addColorStop(1,"rgba(255,240,200,0.9)");
        ctx.strokeStyle=lg; ctx.lineWidth=st.w; ctx.lineCap="round";
        ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x2,y2); ctx.stroke();
      }
      ctx.restore();
    },
    afterFrame(ctx, api){
      ctx.save();
      ctx.globalCompositeOperation="lighter";
      for(let i=sparks.length-1;i>=0;i--){
        const p=sparks[i];
        p.x+=p.vx; p.y+=p.vy; p.vy+=0.03; p.life-=0.02;
        if(p.life<=0){sparks.splice(i,1);continue;}
        ctx.globalAlpha=p.life;
        ctx.fillStyle="#b59c18";
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
        ctx.fillStyle="#fff5d6";
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r*0.4,0,Math.PI*2); ctx.fill();
      }
      ctx.restore();
    },
    decorateCell(ctx, cell, size){
      if(!cell.revealed){
        const scale=0.92+cell.animHover*0.05;
        const p=cell.hexPath(size,scale);
        const g=ctx.createRadialGradient(cell.x,cell.y,1,cell.x,cell.y,size);
        g.addColorStop(0,"rgba(181,156,24,0.25)");
        g.addColorStop(1,"rgba(181,156,24,0)");
        ctx.fillStyle=g; ctx.fill(p);
      }
    }
  }
});

</script>
<script data-goatcounter="https://stats.dr.eamer.dev/count"
        async src="https://stats.dr.eamer.dev/count.js"></script>
