name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sphere neighbor + flood closure smoke
        run: node sphere/test-neighbors.js

      - name: Sphere optional variant contract
        run: node sphere/test-variant-contract.js

      - name: Reflection renderer frame loop
        run: node sphere/test-mirror-loop.js

      - name: Reflection themes keep the far side hidden
        run: node sphere/test-far-side.js

      - name: Glitch Sphere state and route contracts
        run: |
          node glitch-sphere/test-glitch-hazard.js
          node glitch-sphere/test-integration.js

      - name: Flux Sphere pair and route contracts
        run: |
          node flux-sphere/test-flux-pairs.js
          node flux-sphere/test-integration.js

      - name: Catch the Monkey UI and input contract
        run: node --test tools/test-monkey-ui.mjs

      - name: Water Wheel effect profile contract
        run: node wheel/test-effects.js

      - name: Water Wheel menu profile contract
        run: node wheel/test-menu-variants.js

      - name: Dodecahedron panel campaign smoke
        run: node polyhedron/test-campaign.js

      - name: Build sealed app payload
        run: python3 tools/export-collection.py --app

      - name: Web launcher route contract
        run: node tools/test-web-launcher.mjs

      - name: Collection export drift guard
        run: python3 tools/export-collection.py --check

      - name: Choices lab redirect drift guard
        run: python3 tools/export-choices-lab.py --check

  # The native app in app/ ships a pinned snapshot of the game. This job
  # regenerates that snapshot from the recorded commit of this repository and
  # fails if app/www/ has drifted, then builds the Android shell.
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Check the payload against the commit app/WWW_SOURCE.txt records, not
      # against the moving tip of the game source.
      - name: Check out the recorded game source
        run: |
          commit="$(awk '$1 == "source_commit" {print $2}' app/WWW_SOURCE.txt)"
          git worktree add --detach "$RUNNER_TEMP/hexsweeper-source" "$commit"

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The action's default package list includes the retired 'tools' package.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install app dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Payload integrity, Capacitor sync and source drift guard
        working-directory: app
        run: bash scripts/smoke.sh --with-source "$RUNNER_TEMP/hexsweeper-source"

      - name: Android debug build
        working-directory: app
        run: pnpm android:build:debug

      # The unsigned F-Droid APK, built the way F-Droid would build it: the
      # www-fdroid payload, which must carry no photograph and no screenshot.
      - name: Android unsigned F-Droid build
        working-directory: app
        run: |
          grep -E '^[0-9a-f]{64}  ' WWW_SOURCE_FDROID.txt | (cd www-fdroid && sha256sum -c --status -)
          scripts/android-build.sh assembleFdroidRelease
          APK=android/app/build/outputs/apk/release/app-release-unsigned.apk
          if unzip -l "$APK" | grep -E 'assets/public/.*(classic-minesweeper|\.webp$)'; then
            echo "The F-Droid APK carries an image it must not." >&2; exit 1
          fi
          if unzip -p "$APK" assets/public/index.html | grep -q 'data:image/webp'; then
            echo "The F-Droid payload embeds a photograph." >&2; exit 1
          fi
          sha256sum "$APK"
